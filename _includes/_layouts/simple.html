<!DOCTYPE html>
<html lang="en">
<!-- This is a simple HTML layout for Jekyll pages. It includes a stylesheet and a script for rendering math equations using KaTeX. -->
<!-- The layout is designed to be minimal and focuses on displaying the content of the page. -->
<!-- ... -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- KaTeX Dependencies -->
  {% if page.math != false %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  {% endif %}
  #{% if page.custom_css %}
  <!-- If a custom CSS file is specified in the page's front matter, include it here. -->
  <link rel="stylesheet" href="{{ '/assets/css/' | append: page.stylesheet | append: '.css' | relative_url }}" />
  # {% else %}
  <!-- If no custom CSS file is specified, include the default stylesheet. -->
  <link rel="stylesheet" href='/assets/css/' | append: 'style' | append: '.css' | relative_url }}" />
  {% endif %}

</head>

<div>
  <div="content">

    {{ content | markdownify }}


</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.1/dist/katex.min.js" integrity="sha384-DY6j7g5+2z5v"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.1/dist/contrib/auto-render.min.js"
  integrity="sha384-DY6j7g5+2z5v"></script>
<script>renderMathInElement(document.body);</script>
</div>
