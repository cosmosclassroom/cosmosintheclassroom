<!-- Global Settings Panel for Cosmos in the Classroom -->
<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <div class="settings-title">
                <span class="settings-icon">⚙️</span>
                <span>Cosmos Settings</span>
            </div>
            <button class="settings-close" onclick="toggleSettings()" aria-label="Close Settings">
                <span>×</span>
            </button>
        </div>
        
        <div class="settings-content">
            <!-- Theme Settings -->
            <div class="setting-group">
                <div class="setting-label">
                    <span class="setting-icon">🎨</span>
                    Theme
                </div>
                <div class="setting-description">Choose your preferred color scheme</div>
                <div class="theme-buttons" id="themeButtons">
                    <button class="theme-btn" data-theme="light">
                        <span class="theme-icon">☀️</span>
                        <span>Light</span>
                    </button>
                    <button class="theme-btn" data-theme="dark">
                        <span class="theme-icon">🌙</span>
                        <span>Dark</span>
                    </button>
                    <button class="theme-btn" data-theme="auto">
                        <span class="theme-icon">🔄</span>
                        <span>Auto</span>
                    </button>
                </div>
            </div>
            
            <!-- User Preferences -->
            <div class="setting-group">
                <div class="setting-label">
                    <span class="setting-icon">👤</span>
                    User Preferences
                </div>
                <div class="setting-row">
                    <label for="usernameInput">Name:</label>
                    <input type="text" id="usernameInput" placeholder="Enter your name..." 
                           class="setting-input">
                </div>
                <div class="setting-row">
                    <label for="courseLevelSelect">Course Level:</label>
                    <select id="courseLevelSelect" class="setting-select">
                        <option value="honors">Honors Physics</option>
                        <option value="standard">Standard Physics</option>
                    </select>
                </div>
            </div>
            
            <!-- Ratatoskr Widget Settings -->
            <div class="setting-group">
                <div class="setting-label">
                    <span class="setting-icon">🐿️</span>
                    Ratatoskr Widget
                </div>
                <div class="setting-description">Progress tracking widget settings</div>
                
                <div class="setting-row">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="ratatoskrEnabled">
                        <span class="checkmark"></span>
                        Enable Ratatoskr widget
                    </label>
                </div>
                
                <div class="setting-row" id="ratatoskrSettings">
                    <label for="chunkCountSlider">Chunks to display:</label>
                    <div class="slider-container">
                        <input type="range" id="chunkCountSlider" min="2" max="6" step="1" 
                               class="setting-slider">
                        <span id="chunkCountValue" class="slider-value">4</span>
                    </div>
                </div>
                
                <div class="setting-row">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="ratatoskrAnimations">
                        <span class="checkmark"></span>
                        Enable animations
                    </label>
                </div>
            </div>
            
            <!-- Learning Preferences -->
            <div class="setting-group">
                <div class="setting-label">
                    <span class="setting-icon">📚</span>
                    Learning Preferences
                </div>
                
                <div class="setting-row">
                    <label for="mathNotationSelect">Math notation:</label>
                    <select id="mathNotationSelect" class="setting-select">
                        <option value="latex">LaTeX (recommended)</option>
                        <option value="ascii">ASCII text</option>
                    </select>
                </div>
                
                <div class="setting-row">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="showHints">
                        <span class="checkmark"></span>
                        Show problem hints
                    </label>
                </div>
                
                <div class="setting-row">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="accessibilityMode">
                        <span class="checkmark"></span>
                        Enhanced accessibility
                    </label>
                </div>
            </div>
            
            <!-- Privacy Settings -->
            <div class="setting-group">
                <div class="setting-label">
                    <span class="setting-icon">🔒</span>
                    Privacy & Data
                </div>
                
                <div class="setting-row">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="storeProgress">
                        <span class="checkmark"></span>
                        Store learning progress locally
                    </label>
                </div>
                
                <div class="setting-row">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="analyticsEnabled">
                        <span class="checkmark"></span>
                        Anonymous usage analytics
                    </label>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="settings-actions">
                <button class="settings-btn settings-btn-secondary" onclick="resetSettings()">
                    Reset to Defaults
                </button>
                <button class="settings-btn settings-btn-primary" onclick="exportSettings()">
                    Export Settings
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Settings Trigger Button -->
<button class="settings-trigger" onclick="toggleSettings()" aria-label="Open Settings">
    <span class="settings-trigger-icon">⚙️</span>
</button>

<style>
/* Settings Panel Styles */
.settings-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.settings-overlay.visible {
    opacity: 1;
    visibility: visible;
}

.settings-panel {
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    background: var(--panel-bg-solid, #ffffff);
    border-radius: 15px;
    box-shadow: 0 10px 40px var(--shadow-heavy, rgba(0,0,0,0.3));
    transform: scale(0.9) translateY(20px);
    transition: transform 0.3s ease;
    overflow: hidden;
    border: 1px solid var(--border-color, #e0e0e0);
}

.settings-overlay.visible .settings-panel {
    transform: scale(1) translateY(0);
}

.settings-header {
    background: var(--accent-color, #8B4513);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.settings-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
}

.settings-close {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 5px;
    border-radius: 50%;
    transition: background-color 0.2s ease;
}

.settings-close:hover {
    background: rgba(255, 255, 255, 0.1);
}

.settings-content {
    padding: 20px;
    max-height: calc(90vh - 80px);
    overflow-y: auto;
}

.setting-group {
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-color, #e0e0e0);
}

.setting-group:last-child {
    border-bottom: none;
    margin-bottom: 0;
}

.setting-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary, #333);
    margin-bottom: 5px;
}

.setting-description {
    font-size: 14px;
    color: var(--text-secondary, #666);
    margin-bottom: 15px;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 15px;
}

.setting-row label {
    font-size: 14px;
    color: var(--text-primary, #333);
    min-width: 120px;
}

.setting-input, .setting-select {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--input-border, #ddd);
    border-radius: 6px;
    background: var(--input-bg, #fff);
    color: var(--input-text, #333);
    font-size: 14px;
    transition: border-color 0.2s ease;
}

.setting-input:focus, .setting-select:focus {
    outline: none;
    border-color: var(--accent-color, #8B4513);
}

.theme-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

.theme-btn {
    padding: 12px 8px;
    border: 2px solid var(--border-color, #ddd);
    border-radius: 8px;
    background: var(--input-bg, #fff);
    color: var(--text-primary, #333);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 13px;
}

.theme-btn:hover {
    border-color: var(--accent-color, #8B4513);
}

.theme-btn.active {
    background: var(--accent-color, #8B4513);
    color: white;
    border-color: var(--accent-color, #8B4513);
}

.setting-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-primary, #333);
}

.setting-checkbox input[type="checkbox"] {
    display: none;
}

.checkmark {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border-color, #ddd);
    border-radius: 4px;
    position: relative;
    transition: all 0.2s ease;
}

.setting-checkbox input[type="checkbox"]:checked + .checkmark {
    background: var(--accent-color, #8B4513);
    border-color: var(--accent-color, #8B4513);
}

.setting-checkbox input[type="checkbox"]:checked + .checkmark::after {
    content: '✓';
    position: absolute;
    top: -2px;
    left: 2px;
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
}

.setting-slider {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--border-color, #ddd);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
}

.setting-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-color, #8B4513);
    cursor: pointer;
}

.slider-value {
    min-width: 20px;
    font-weight: 600;
    color: var(--text-primary, #333);
}

.settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-color, #e0e0e0);
}

.settings-btn {
    flex: 1;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.settings-btn-primary {
    background: var(--accent-color, #8B4513);
    color: white;
}

.settings-btn-primary:hover {
    background: var(--accent-hover, #A0522D);
}

.settings-btn-secondary {
    background: transparent;
    color: var(--text-secondary, #666);
    border: 1px solid var(--border-color, #ddd);
}

.settings-btn-secondary:hover {
    background: var(--border-color, #ddd);
}

/* Settings Trigger Button */
.settings-trigger {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    background: var(--panel-bg, rgba(255,255,255,0.9));
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-color, #ddd);
    border-radius: 50%;
    box-shadow: 0 4px 20px var(--shadow-light, rgba(0,0,0,0.1));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 1000;
}

.settings-trigger:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 25px var(--shadow-medium, rgba(0,0,0,0.2));
}

.settings-trigger-icon {
    font-size: 20px;
    color: var(--text-primary, #333);
}

/* Responsive Design */
@media (max-width: 768px) {
    .settings-panel {
        width: 95%;
        max-height: 95vh;
    }
    
    .theme-buttons {
        grid-template-columns: 1fr;
    }
    
    .setting-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }
    
    .setting-row label {
        min-width: auto;
    }
    
    .setting-input, .setting-select {
        width: 100%;
    }
    
    .settings-actions {
        flex-direction: column;
    }
}
</style>

<script>
// Settings Panel JavaScript
let settingsVisible = false;

function toggleSettings() {
    const overlay = document.getElementById('settingsOverlay');
    settingsVisible = !settingsVisible;
    
    if (settingsVisible) {
        overlay.classList.add('visible');
        loadSettings();
        document.body.style.overflow = 'hidden';
    } else {
        overlay.classList.remove('visible');
        document.body.style.overflow = '';
    }
}

function loadSettings() {
    if (!window.CosmosConfig) return;
    
    const config = window.CosmosConfig;
    
    // Theme buttons
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === config.get('ui.theme'));
        btn.onclick = () => {
            config.set('ui.theme', btn.dataset.theme);
            loadSettings(); // Refresh UI
        };
    });
    
    // User preferences
    document.getElementById('usernameInput').value = config.get('user.name') || '';
    document.getElementById('usernameInput').onchange = (e) => 
        config.set('user.name', e.target.value);
    
    document.getElementById('courseLevelSelect').value = config.get('user.preferredLevel') || 'honors';
    document.getElementById('courseLevelSelect').onchange = (e) => 
        config.set('user.preferredLevel', e.target.value);
    
    // Ratatoskr settings
    const ratatoskrEnabled = document.getElementById('ratatoskrEnabled');
    ratatoskrEnabled.checked = config.get('ratatoskr.enabled');
    ratatoskrEnabled.onchange = (e) => {
        config.set('ratatoskr.enabled', e.target.checked);
        document.getElementById('ratatoskrSettings').style.display = 
            e.target.checked ? 'flex' : 'none';
    };
    
    const chunkCountSlider = document.getElementById('chunkCountSlider');
    const chunkCountValue = document.getElementById('chunkCountValue');
    chunkCountSlider.value = config.get('ratatoskr.chunkDisplayCount') || 4;
    chunkCountValue.textContent = chunkCountSlider.value;
    chunkCountSlider.oninput = () => {
        chunkCountValue.textContent = chunkCountSlider.value;
        config.set('ratatoskr.chunkDisplayCount', parseInt(chunkCountSlider.value));
    };
    
    const ratatoskrAnimations = document.getElementById('ratatoskrAnimations');
    ratatoskrAnimations.checked = config.get('ratatoskr.animationsEnabled');
    ratatoskrAnimations.onchange = (e) => 
        config.set('ratatoskr.animationsEnabled', e.target.checked);
    
    // Learning preferences
    document.getElementById('mathNotationSelect').value = config.get('learning.mathNotation') || 'latex';
    document.getElementById('mathNotationSelect').onchange = (e) => 
        config.set('learning.mathNotation', e.target.value);
    
    document.getElementById('showHints').checked = config.get('learning.showHints');
    document.getElementById('showHints').onchange = (e) => 
        config.set('learning.showHints', e.target.checked);
    
    document.getElementById('accessibilityMode').checked = config.get('learning.accessibilityMode');
    document.getElementById('accessibilityMode').onchange = (e) => 
        config.set('learning.accessibilityMode', e.target.checked);
    
    // Privacy settings
    document.getElementById('storeProgress').checked = config.get('privacy.storeProgress');
    document.getElementById('storeProgress').onchange = (e) => 
        config.set('privacy.storeProgress', e.target.checked);
    
    document.getElementById('analyticsEnabled').checked = config.get('privacy.analyticsEnabled');
    document.getElementById('analyticsEnabled').onchange = (e) => 
        config.set('privacy.analyticsEnabled', e.target.checked);
    
    // Show/hide Ratatoskr settings based on enabled state
    document.getElementById('ratatoskrSettings').style.display = 
        config.get('ratatoskr.enabled') ? 'flex' : 'none';
}

function resetSettings() {
    if (window.CosmosConfig && confirm('Reset all settings to defaults? This cannot be undone.')) {
        window.CosmosConfig.reset();
        loadSettings();
    }
}

function exportSettings() {
    if (window.CosmosConfig) {
        const settingsData = window.CosmosConfig.export();
        const blob = new Blob([settingsData], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cosmos-settings.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
}

// Close settings when clicking outside
document.addEventListener('click', (e) => {
    const overlay = document.getElementById('settingsOverlay');
    const panel = document.getElementById('settingsPanel');
    const trigger = document.querySelector('.settings-trigger');
    
    if (settingsVisible && overlay && !panel.contains(e.target) && !trigger.contains(e.target)) {
        toggleSettings();
    }
});

// Close settings with Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && settingsVisible) {
        toggleSettings();
    }
});

// Load settings when page loads
document.addEventListener('DOMContentLoaded', () => {
    if (window.CosmosConfig) {
        // Small delay to ensure config is initialized
        setTimeout(loadSettings, 100);
    }
});
</script>
