  - type: reading
    title: "Thinking Lens: Systems and System Models"
    content: |
      Using our lens of **Systems and System Models**, the law of conservation of energy becomes a powerful tool for defining and analyzing a system. When we draw a boundary around our system—whether it's a single pendulum or the entire Hoover Dam—the conservation law holds for everything *inside* that boundary. If the total energy inside seems to decrease, it's only because energy has flowed out of the system into the surroundings (often as heat due to non-conservative forces like friction). This allows us to create models of efficiency. The Hoover Dam is a highly efficient system, converting about 90% of the water's potential energy into electricity. This model helps us understand that "energy loss" isn't a violation of conservation; it's simply energy that has been transferred out of the defined boundaries of our system.

  - type: activity_prompt
    title: "Practice: Conservation and Power"
    content: |
      You now have one of the most powerful laws in physics at your disposal. Let's practice using it. Pause your reading here. Open your **Unit 5 Problem Sets** document and complete "Problem Set 5.2: Conservation and Power."
    button_text: "Open Problem Sets"

  - type: reading
    title: "The Bigger Picture: Synthesis and Connection"
    content: |
      The Law of Conservation of Energy is more than just a rule for physics problems; it is a fundamental pillar of our understanding of the cosmos. The 20th-century mathematician Emmy Noether proved that every conservation law in physics corresponds to a deep symmetry in the universe. Energy is conserved because the laws of physics themselves do not change over time. This profound connection between symmetry and conservation is one of the most beautiful ideas in science. We have seen how this single law governs a pendulum and a dam. Our next journey will be to investigate another, equally powerful conservation law—the Conservation of Momentum. It will take us from simple collisions here on Earth to the "gravity assist" maneuvers that send probes like Voyager slingshotting through the outer solar system.
