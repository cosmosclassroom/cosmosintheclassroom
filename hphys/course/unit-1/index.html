  // Get the dropdown elements
  const unitSelect = document.getElementById('unit-select-hphys');
  const contentSelect = document.getElementById('content-select-hphys');
  const itemSelect = document.getElementById('item-select-hphys');
  const documentSelectGroup = document.getElementById('document-select-group-hphys');
  const goButton = document.getElementById('nav-go-hphys');

  // Content type definitions with proper URL structure
  const contentTypes = [
    {key: "lectures", title: "Lectures", icon: "📝", urlPath: "lectures"},
    {key: "hexagon-labs", title: "Hexagon Labs", icon: "🧪", urlPath: "hexagon-labs"},
    {key: "problem-sets", title: "Problem Sets", icon: "📊", urlPath: "problem-sets"},
    {key: "assessments", title: "Assessments", icon: "✅", urlPath: "assessments"}
  ];

  // Helper function to extract documents by type from manifest
  function getDocumentsByType(unit, contentType) {
    if (!unit || !unit.documents) return [];
    
    const docs = [];
    unit.documents.forEach(doc => {
      if (typeof doc === 'object' && doc[contentType]) {
        // Handle object format: {type: [files]}
        const files = Array.isArray(doc[contentType]) ? doc[contentType] : [doc[contentType]];
        docs.push(...files);
      } else if (typeof doc === 'string' && doc.startsWith(contentType + '/')) {
        // Handle string format: "type/file.md"
        docs.push(doc.substring(contentType.length + 1));
      }
    });
    return docs;
  }

  // Populate content types when unit is selected
  unitSelect.addEventListener('change', function() {
    contentSelect.innerHTML = '<option value="">-- Choose Content Type --</option>';
    contentSelect.disabled = true;
    itemSelect.innerHTML = '<option value="">-- Choose Document --</option>';
    documentSelectGroup.style.display = 'none';
    goButton.disabled = true;

    if (!this.value) return;

    if (useManifest) {
      const unitSlug = this.value;
      const selectedUnit = manifestData.units.find(unit => unit.unitSlug === unitSlug);
      
      if (!selectedUnit) {
        console.error('Unit not found:', unitSlug);
        return;
      }

      // Add available content types
      contentTypes.forEach(content => {
        const docs = getDocumentsByType(selectedUnit, content.key);
        if (docs.length > 0) {
          const option = document.createElement('option');
          option.value = content.urlPath;
          option.textContent = `${content.icon} ${content.title}`;
          option.dataset.contentKey = content.key;
          contentSelect.appendChild(option);
        }
      });
      
      contentSelect.disabled = contentSelect.options.length <= 1;
      goButton.disabled = contentSelect.options.length <= 1;
      
    } else {
      // Legacy course_navigation.yml structure
      const selectedUnit = courseData.units.find(unit => unit.url === this.value);
      if (selectedUnit && selectedUnit.content_types && selectedUnit.content_types.length > 0) {
        selectedUnit.content_types.forEach(content => {
          const option = document.createElement('option');
          option.value = content.type;
          option.textContent = content.title;
          contentSelect.appendChild(option);
        });
        contentSelect.disabled = false;
      }
      goButton.disabled = !selectedUnit || !selectedUnit.content_types;
    }
  });

  // Populate items when content type is selected
  contentSelect.addEventListener('change', function() {
    itemSelect.innerHTML = '<option value="">-- Choose Document --</option>';
    documentSelectGroup.style.display = 'none';
    goButton.disabled = true;
    
    if (!this.value) return;

    if (useManifest) {
      const unitSlug = unitSelect.value;
      const contentUrlPath = this.value;
      const contentKey = this.options[this.selectedIndex].dataset.contentKey;
      
      const selectedUnit = manifestData.units.find(unit => unit.unitSlug === unitSlug);
      if (!selectedUnit) return;

      const docs = getDocumentsByType(selectedUnit, contentKey);
      
      if (docs.length > 0) {
        docs.forEach(docPath => {
          const option = document.createElement('option');
          // Construct proper URL: /course/course/unit-slug/content-type/file
          const cleanPath = docPath.replace('.md', '').replace(/^\/+|\/+$/g, '');
          option.value = `/${courseCode}/course/${unitSlug}/${contentUrlPath}/${cleanPath}/`;
          
          // Extract filename for display
          const filename = docPath.split('/').pop().replace('.md', '').replace(/-/g, ' ');
          option.textContent = filename.replace(/\b\w/g, l => l.toUpperCase());
          itemSelect.appendChild(option);
        });
        documentSelectGroup.style.display = 'block';
      } else {
        // Content type page exists but no individual documents
        goButton.disabled = false;
      }
      
    } else {
      // Legacy structure
      const selectedUnit = courseData.units.find(unit => unit.url === unitSelect.value);
      if (selectedUnit && selectedUnit.files) {
        const files = selectedUnit.files.filter(f => f.type === contentSelect.value);
        if (files.length > 0) {
          files.forEach(file => {
            const option = document.createElement('option');
            option.value = file.url;
            option.textContent = file.title || file.url.split('/').pop();
            itemSelect.appendChild(option);
          });
          documentSelectGroup.style.display = 'block';
        } else {
          goButton.disabled = false;
        }
      }
    }
  });

  // Enable Go button when document is selected
  itemSelect.addEventListener('change', function() {
    goButton.disabled = !this.value;
  });

  // Navigate to selected page
  goButton.addEventListener('click', function() {
    let url;
    
    if (itemSelect.value) {
      url = itemSelect.value;
    } else if (contentSelect.value) {
      if (useManifest) {
        const unitSlug = unitSelect.value;
        const contentPath = contentSelect.value;
        url = `/${courseCode}/course/${unitSlug}/${contentPath}/`;
      } else {
        url = contentSelect.value;
      }
    } else if (unitSelect.value) {
      if (useManifest) {
        url = `/${courseCode}/course/${unitSelect.value}/`;
      } else {
        url = unitSelect.value;
      }
    }
    
    if (url) {
      window.location.href = url;
    }
  });
})();
</script>
