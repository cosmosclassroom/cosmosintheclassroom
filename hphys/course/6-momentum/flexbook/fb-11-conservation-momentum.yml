flexbookOverview:
  - unitNumber: 6
    unitTitle: Voyager's Gravity Assist
    unitSubtitle: The Conservation of Momentum
    centralQuestion: >-
      How can we analyze interactions and collisions using a principle where a
      key quantity is always conserved?
    anchoringPhenomenon: >-
      In the late 1970s, humanity launched two of its most ambitious explorers, the Voyager probes, on a grand tour of the outer solar system. To make the journey possible, engineers relied on a celestial trick—a 'gravity assist' or 'slingshot' maneuver. By flying breathtakingly close to massive planets like Jupiter, the tiny spacecraft were able to 'steal' a tiny fraction of the planet's orbital energy to dramatically increase their own speed, flinging them towards their next destination.  This seemingly magical boost, a cornerstone of interplanetary travel, is not magic at all; it is a profound demonstration of one of physics' most powerful and unwavering laws: the conservation of momentum.
    keyVocabulary:
      - term: Momentum
        definition: >-
          The product of the mass and velocity of an object; a vector
          quantity often described as 'mass in motion'. It is a measure of an object's resistance to being stopped.
      - term: Impulse
        definition: >-
          The change in momentum of an object when the object is acted upon by
          a force for a certain interval of time. A large force for a short time can produce the same impulse as a small force for a long time.
      - term: Elastic Collision
        definition: >-
          A collision in which there is no net loss in kinetic energy in the
          system as a result of the collision. The objects bounce off each other perfectly, like billiard balls.
      - term: Inelastic Collision
        definition: >-
          A collision in which kinetic energy is not conserved, typically being transformed into other forms like heat or sound. A 'perfectly inelastic' collision is one where the objects stick together after impact.
    keyFormulae:
      - | $p = mv$
      - | $J = F\Delta t = \Delta p$
      - | $\Sigma p_0 = \Sigma p_1$
      - | $m_1v_{1,0} + m_2v_{2,0} = m_1v_{1,1} + m_2v_{2,1}$
