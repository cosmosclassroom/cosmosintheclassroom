# ------------------------------------------------------------------------------
# SECTION 3: PROBLEM SET OVERVIEW
# ------------------------------------------------------------------------------
overview:
  follows_lecture: "Lecture 4.1: The Rules of Force"
  introduction: "In this problem set, you will apply Newton's Laws of Motion to analyze the forces involved in moving massive objects. This is the first step in understanding and solving the engineering challenges faced by the builders of the great pyramids, our unit's anchoring phenomenon."
  key_formulae:
    - |
      $\Sigma\vec{F} = m\vec{a}$
  global_standards:
    - "For all problems, assume the acceleration due to gravity is $\\vec{a}_g = -9.80 \\, m/s^2$."
    - "Follow the systematic problem-solving process demonstrated in the lecture."
    - "Draw a Free-Body Diagram for any problem involving multiple forces."
    - "Present all final answers with the correct units and number of significant figures."

# ------------------------------------------------------------------------------
# SECTION 4: PROBLEMS & SOLUTIONS
# ------------------------------------------------------------------------------
problems:
  # ------------------------- TIER 1: APPRENTICE ---------------------------
  - problem_number: 1
    tier:
      level: 1
      title: "The Apprentice's Practice: Foundational Skills"
    phenomenon_connection: "This problem explores the fundamental relationship between force, mass, and acceleration for a single stone block, ignoring the complexities of friction for now."
    problem_statement: "A team of workers applies a net horizontal force of 2.50 x 10³ N to a 1.25 x 10³ kg block of limestone resting on a set of frictionless rollers. What is the acceleration of the block?"
    diagram_placeholder: ""
    solution:
      givens:
        - |
          $\Sigma\vec{F} = +2.50 \times 10^3 \, N$
        - |
          $m = 1.25 \times 10^3 \, kg$
      unknowns:
        - |
          $\vec{a} = ?$
      steps:
        - "1. **Select Parent Equation:** Newton's Second Law directly relates net force, mass, and acceleration: $\\Sigma\\vec{F} = m\\vec{a}$."
        - "2. **Algebraic Rearrangement:** To solve for the unknown, acceleration, we divide both sides by mass: $\\vec{a} = \\frac{\\Sigma\\vec{F}}{m}$."
        - "3. **Substitute Values and Track Units:**"
        - |
          $\vec{a} = \frac{+2.50 \times 10^3 \, N}{1.25 \times 10^3 \, kg}$
        - |
          A Newton (N) is a derived unit equivalent to $kg \cdot m/s^2$.
        - |
          $\vec{a} = \frac{+2.50 \times 10^3 \, kg \cdot m/s^2}{1.25 \times 10^3 \, kg} = +2.00 \, m/s^2$
      final_answer: |
        The block accelerates in the direction of the force at **2.00 m/s²**.

  # ------------------------- TIER 2: JOURNEYMAN ---------------------------
  - problem_number: 2
    tier:
      level: 2
      title: "The Journeyman's Task: Synthesis & Application"
    phenomenon_connection: "This problem models a more realistic scenario for the pyramid builders by including the opposing force of friction. This requires you to calculate the *net* force before determining the block's motion."
    problem_statement: "A different team pulls a 2.50 x 10³ kg granite block across level ground. The workers pull horizontally with a combined force of 9.00 x 10³ N. The opposing force of kinetic friction between the block and the sand is 3.50 x 10³ N. First, draw a complete free-body diagram for the block. Then, calculate the net force on the block and its resulting acceleration."
    diagram_placeholder: ""
    solution:
      givens:
        - |
          $m = 2.50 \times 10^3 \, kg$
        - |
          $\vec{F}_{pull} = +9.00 \times 10^3 \, N$
        - |
          $\vec{F}_{f} = -3.50 \times 10^3 \, N$
      unknowns:
        - |
          $\Sigma\vec{F}_x = ?$
        - |
          $\vec{a}_x = ?$
      steps:
        - "1. **Draw Free-Body Diagram:** The diagram should show four forces: $\\vec{F}_{pull}$ to the right, $\\vec{F}_f$ to the left, the force of gravity ($\\vec{F}_g$) downward, and the normal force ($\\vec{F}_N$) upward."
        - "2. **Calculate Net Force:** Since the block does not accelerate vertically, we only need to sum the horizontal forces. $\\Sigma\\vec{F}_x = \\vec{F}_{pull} + \\vec{F}_f$."
        - |
          $\Sigma\vec{F}_x = (+9.00 \times 10^3 \, N) + (-3.50 \times 10^3 \, N) = +5.50 \times 10^3 \, N$
        - "3. **Select Parent Equation:** Use Newton's Second Law for the horizontal dimension: $\\Sigma\\vec{F}_x = m\\vec{a}_x$."
        - "4. **Algebraic Rearrangement:** Solve for acceleration: $\\vec{a}_x = \\frac{\\Sigma\\vec{F}_x}{m}$."
        - "5. **Substitute Values and Track Units:**"
        - |
          $\vec{a}_x = \frac{+5.50 \times 10^3 \, N}{2.50 \times 10^3 \, kg} = +2.20 \, m/s^2$
      final_answer: |
        The net force on the block is **+5.50 x 10³ N** and its acceleration is **+2.20 m/s²**.

  # ------------------------- TIER 3: MASTER -------------------------------
  - problem_number: 3
    tier:
      level: 3
      title: "The Master's Insight: Design & Optimization"
    phenomenon_connection: "This question addresses a common and profound conceptual hurdle related to Newton's Third Law. A true understanding of this law is required to correctly model the system of forces needed to construct the pyramids."
    problem_statement: "An engineer overseeing the pyramid construction says: 'I am confused. According to Newton's Third Law, if the workers pull on the rope attached to the block, the rope and block pull back on the workers with an equal and opposite force. Since these forces are equal and opposite, they must cancel out. How can the block ever accelerate?' Using the principles of Newton's Laws, write a clear explanation that resolves the engineer's confusion."
    diagram_placeholder: ""
    solution:
      givens: []
      unknowns: []
      steps:
        - "1. **Identify the Flaw:** The engineer's fundamental error is applying two forces from an action-reaction pair to the *same object*. Action-reaction pairs always act on *different* objects."
        - "2. **Analyze Forces on the Block:** To determine the acceleration of the **block**, we only consider the forces acting **on the block**. In this case, that's the pull from the rope and the friction from the ground. The block accelerates if the pull force is greater than the friction force."
        - "3. **Analyze Forces on the Workers:** The 'reaction' force (the rope pulling back on the workers) acts **on the workers**, not the block. This force is what the workers feel in their hands. For the workers to not be pulled backward, they must push on the ground with their feet with a force greater than the pull from the rope."
        - "4. **Conclusion:** The forces don't cancel because they act on different objects within the system. The motion of the block is determined *only* by the net force on the block. The motion of the workers is determined *only* by the net force on the workers."
      final_answer: |
        The engineer's reasoning is flawed because action-reaction forces act on different objects and therefore cannot cancel each other out. The acceleration of the block depends only on the net force exerted **on the block**. The reaction force acts back **on the workers**, not the block.

# ==============================================================================
# SECTION 5: STUDENT SOLUTIONS LIST
# This section provides final, quantitative answers for student self-assessment.
# ==============================================================================
student_solutions_list:
  - problem_number: 1
    final_answer: "+2.00 m/s²"
  - problem_number: 2
    final_answer: "Net Force = +5.50 x 10³ N; Acceleration = +2.20 m/s²"
  - problem_number: 3
    final_answer: "Conceptual explanation required. Key idea: The forces of an action-reaction pair act on different objects and cannot cancel."