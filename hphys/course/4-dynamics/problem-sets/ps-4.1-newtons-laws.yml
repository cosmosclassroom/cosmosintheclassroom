# ------------------------------------------------------------------------------
# SECTION 1: AI GENERATION GUIDELINES
# Notes for an AI assistant to follow when generating a new problem set from
# this template.
# ------------------------------------------------------------------------------
ai_generation_guidelines:
  - "All generated solutions MUST follow the systematic problem-solving process."
  - "All generated solutions MUST show the algebraic rearrangement of the parent formula before substituting numbers."
  - "All generated solutions MUST explicitly track SI units through the calculation to verify the final units."
  - "All 'given' values in problem statements MUST be written with an unambiguous number of significant figures (e.g., use '20. cm' or '2.0e1 cm' for two sig figs, never '20 cm')."
  - "All final answers MUST be reported to the correct number of significant figures."
  - "The student_solutions_list should ONLY contain final, quantitative answers. Do not include conceptual explanations."

# ------------------------------------------------------------------------------
# SECTION 2: FRONT MATTER & METADATA
# ------------------------------------------------------------------------------
