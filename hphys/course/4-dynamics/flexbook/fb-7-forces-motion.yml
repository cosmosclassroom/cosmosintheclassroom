instructional_flow:
  - type: reading
    title: "Introduction: Asking 'Why?'"
    content: |
      Until now, we have been the careful observers and scribes of motion. We have learned the language to describe a journey—its position, its velocity, its acceleration. We can predict *how* a rocket will fly. But we have not yet asked the most important question: *Why?* Why do objects move in the first place? Why do they speed up, slow down, or change direction? For millennia, this was a question steeped in mystery. It took the genius of Isaac Newton to peel back that mystery and reveal a universe governed by a few simple, powerful, and elegant rules. This is the story of how we moved from describing motion to explaining it, discovering the invisible pushes and pulls—the forces—that choreograph the cosmic dance.

  - type: reading
    title: "Phenomenon: The Impossible Task"
    content: |
      
      Gaze across the sands of time to ancient Egypt. A civilization, armed with little more than ropes, ramps, and human ingenuity, is undertaking one of the most ambitious engineering projects in history: the construction of the Great Pyramid of Giza. Armies of workers are moving stone blocks weighing an average of 2.5 tons—the weight of a large SUV—and fitting them into place with astonishing precision. How was this possible? What fundamental forces of nature did they have to understand and overcome? They weren't just lifting stones; they were battling the very essence of sluggishness, the tendency of a massive object to stay put. The pyramid is not just a monument of stone; it is a monument to a deep, intuitive understanding of the rules of force and motion. The puzzle for us is to formalize those rules and uncover the physics that the pyramid builders mastered.

  - type: activity_prompt
    title: "Forecast: The Engineer's Enigma"
    content: |
      Pause your reading here. Before we delve into Newton's formal laws, consider the practical problem faced by the ancient Egyptians. Open your **Unit 4 Research Brief** document and complete the "Forecast" section for "The Engineer's Enigma."
    button_text: "Open Research Brief"

  - type: reading
    title: "Investigation: The Stubbornness of Matter"
    content: |
      Why is it harder to push a car than a shopping cart? Why does a hockey puck glide across the ice but a book slides to a stop on the floor? The ancient pyramid builders knew that massive objects are reluctant to start moving. This inherent "stubbornness" of matter is a fundamental property of the universe. What are the rules that govern it? Let's investigate this property, which scientists call inertia.

  - type: activity_prompt
    title: "Discovery: Investigating Inertia"
    content: |
      Pause your reading here. Open your **Unit 4 Hexagon Labs** document and complete "Hexagon Lab - Investigating Inertia" to develop a conceptual understanding of Newton's First Law.
    button_text: "Open Hexagon Labs"

  - type: reading
    title: "The Rules of the Game: The Three Laws"
    content: |
      Your investigation into inertia revealed the universe's "default setting." This is Newton's First Law: **An object in motion stays in motion, and an object at rest stays at rest, unless acted upon by a net external force.** There is no "un-pushed" motion. If you see an object's velocity changing—if it is accelerating—you know, with 100% certainty, that a net force is the culprit.

      This leads to the Second Law, which is the heart of all of classical mechanics. It tells us exactly how much an object's motion will change. **The acceleration of an object is directly proportional to the net force acting on it and inversely proportional to its mass ($\Sigma \vec{F} = m\vec{a}$)**. This is it. This is the engine of physics. A bigger net force causes a bigger acceleration. A more massive object is more stubborn (has more inertia) and will have a smaller acceleration for the same force.

      Finally, Newton realized that forces never exist in isolation. They are always part of an interaction. If you push on a wall, the wall pushes back on you. This is the Third Law: **For every action, there is an equal and opposite reaction.** These three laws are the complete rulebook. To solve problems, our main tool is the **free-body diagram**, a simple sketch where we isolate an object and draw all the force vectors acting *on* it. It's the physicist's way of setting up the problem to apply the rulebook correctly.

