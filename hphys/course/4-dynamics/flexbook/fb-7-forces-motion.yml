  - type: reading
    title: "Thinking Lens: Cause and Effect"
    content: |
      Using our lens of **Cause and Effect**, Newton's Second Law ($\Sigma \vec{F} = m\vec{a}$) becomes the most powerful statement of causality in physics. It doesn't just say that forces and acceleration are related; it says that a net force is the **cause**, and acceleration is the **effect**. The equation is the rule that connects them. Mass is the property of the object that mediates this relationship—it is the measure of how much an object resists having its motion changed by the cause. The ancient Egyptians couldn't write the equation, but they understood the causality: to create an effect (moving the block), they needed to apply a cause (a large enough net force to overcome inertia and friction).

