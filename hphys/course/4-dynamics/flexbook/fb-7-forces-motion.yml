    button_text: "Open Problem Sets"

  - type: reading
    title: "The Bigger Picture: Synthesis and Connection"
    content: |
      With just three simple laws, Isaac Newton gave us the framework to understand nearly all motion in the everyday world. These rules connect the fall of an apple to the orbit of the Moon. They are the principles behind the design of every car, every bridge, and every airplane. By shifting our focus from describing motion to explaining its cause—the force—we have unlocked a new level of understanding. We have the fundamental rulebook. Our next step is to learn how to apply this rulebook to more complex, real-world situations, where forces like friction and gravity act at strange angles and in complicated combinations.
