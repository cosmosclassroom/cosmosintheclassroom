learning_objectives:
  - Interpret position-time, velocity-time, and acceleration-time graphs for an object in one-dimensional motion.
  - Determine an object's velocity from the slope of a position-time graph.
  - Determine an object's acceleration from the slope of a velocity-time graph.
  - Determine an object's displacement from the area under a velocity-time graph.

keyVocabulary:
  - term: Displacement
    definition: >-
      The change in an object's position; a vector quantity representing
      the shortest distance and direction from the starting point to the
      ending point.
  - term: Velocity
    definition: >-
      The rate at which an object's position changes; a vector quantity
      specifying both speed and direction of motion.
  - term: Acceleration
    definition: >-
      The rate at which an object's velocity changes over time; a vector
      quantity.

keyFormulae:
  - formula: $v_{avg} = \frac{\Delta x}{\Delta t} = \frac{x_1 - x_0}{t_1 - t_0}$
  - formula: $a_{avg} = \frac{\Delta v}{\Delta t} = \frac{v_1 - v_0}{t_1 - t_0}$

# The `instructionalFlow` is an ordered list of content blocks that structure the chapter.
instructional_flow:
  - type: reading
    title: "Introduction: The Story of a Journey"
    content: |
      Motion is the most fundamental story in the universe. It is the story of a planet orbiting a star, an apple falling from a tree, a car driving down the road. But how do we tell this story with precision? How do we capture the nuance of a journey—the speeding up, the slowing down, the moments of rest? The language of words is often not enough. To truly understand motion, we must learn to see it. We will discover that a simple drawing, a graph, can tell the complete story of an object's journey through space and time. This is the story of how we learned to translate the dynamic, flowing reality of motion into a static, elegant picture that reveals all its secrets.

  - type: reading
    title: "Phenomenon: The Ascent of a Rocket"
    content: |
      
      Three... two... one... ignition. A suborbital sounding rocket tears away from the launchpad in a controlled explosion of fire and sound, a testament to human ingenuity. For a few brief, violent moments, its engines burn with furious power, pushing it ever faster against the relentless pull of gravity. Then, silence. The engines cut out, but the rocket's journey is far from over. It coasts silently upward, trading its incredible speed for altitude, until it reaches its highest point—its apogee. For a fleeting instant, it hangs motionless at the edge of space before beginning its long fall back to Earth. This complex, multi-stage journey, full of dramatic changes in speed and direction, presents a puzzle: how can we describe this entire dynamic event in a single, coherent picture? How can we map out its velocity at every single moment in time?

  - type: activity_prompt
    title: "Forecast: Decoding the Data Stream"
    content: |
      Pause your reading here. The rocket's flight is a complex story. Before learning the formal language of motion graphs, let's make an initial attempt to interpret the data. Open your **Unit 2 Research Brief** document and complete the "Forecast" section for "Decoding the Data Stream."
    button_text: "Open Research Brief"

  - type: reading
    title: "Investigation: Finding the Patterns in the Data"
    content: |
      A rocket's ascent data can be presented as a table of numbers: at 1 second, the velocity is this; at 2 seconds, it's that. But the human brain is a pattern-finding machine, and it's much easier to see the story in a picture than in a list. What patterns emerge when we graph a rocket's velocity against time?

  - type: activity_prompt
    title: "Discovery: Analyzing Rocket Ascent Data"
    content: |
      Pause your reading here. Open your **Unit 2 Hexagon Labs** document and complete "Hexagon Lab - Analyzing Rocket Ascent Data."
    button_text: "Open Hexagon Labs"

  - type: reading
    title: "The Rules of the Game: Reading the Slopes and the Spaces"
    content: |
      The lab revealed two simple but profound rules that are the foundation of kinematics. **Rule #1: The slope of a graph tells you the rate of change.** On a position-vs-time graph, the slope is *rise over run*, or the change in position divided by the change in time. That is the very definition of velocity. A steep slope means a high velocity; a flat slope means the velocity is zero. The same logic applies to a velocity-vs-time graph. Its slope is the change in velocity divided by time, which is the definition of acceleration.

      **Rule #2: The area under a graph tells you the accumulation.** Think about the area under a velocity-vs-time graph. The area of a rectangle is its height times its width. In this case, that's velocity (m/s) multiplied by time (s). The seconds cancel out, and you are left with meters—a displacement! So the area under the velocity graph literally tells you how much displacement the object has accumulated over a period of time. These two rules, slope means rate and area means accumulation, are all you need to read the story of any journey.

  - type: image
    # A simple, clear velocity-time graph with a constant positive slope.
    # The slope is labeled "Acceleration (a = Δv/Δt)".
    # The area under the line for a time interval 't' is shaded and labeled "Displacement (Δx = Area)".
    title: "Interpreting a Velocity-Time Graph"
    src: "https://placehold.co/600x400/222/fff?text=Interpreting+a+V-T+Graph"
    caption: "The slope of a velocity-time graph represents acceleration, while the area under the graph represents displacement."

  - type: reading
    title: "Thinking Lens: Patterns"
    content: |
      Using the lens of **Patterns**, we can see that the relationship between position, velocity, and acceleration is beautifully consistent. The act of finding the slope (a calculus concept called a derivative) moves you from position to velocity, and from velocity to acceleration. The act of finding the area (a calculus concept called an integral) moves you in the opposite direction. This elegant, predictable pattern means that if you know the complete story of an object's position over time, you can deduce the entire story of its velocity and acceleration. All three are mathematically linked in a pattern that holds true for any moving object in the universe.

  - type: activity_prompt
    title: "Practice: Describing Motion with Graphs"
    content: |
      You've seen how graphs tell a story. Now it's time to practice your reading and writing skills. Pause your reading here. Open your **Unit 2 Problem Sets** document and complete "Problem Set 2.1: Motion in One Dimension."
    button_text: "Open Problem Sets"

  - type: reading
    title: "The Bigger Picture: Synthesis and Connection"
    content: |
      The chaotic fury of a rocket launch can be captured and understood in the clean lines and simple slopes of a graph. This powerful tool transforms complex motion into a clear, visual narrative. We can now look at a graph and see the story: the initial blast of acceleration, the steady climb, the moment of weightlessness at the peak, and the accelerating descent. We have established a language for describing motion. But description is only the first step. Our next challenge is to move from description to prediction. Can we develop a set of mathematical laws, a handful of simple equations, that will allow us not just to tell the story of a journey that has happened, but to predict the story of one that is about to begin?
