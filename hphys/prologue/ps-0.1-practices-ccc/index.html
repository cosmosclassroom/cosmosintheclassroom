<script>
// Toggle solutions visibility
function toggleSolutions() {
    const solutionsDiv = document.getElementById('student-solutions');
    const toggleBtn = document.getElementById('toggle-solutions-btn');
    
    if (solutionsDiv.style.display === 'none') {
        solutionsDiv.style.display = 'block';
        toggleBtn.textContent = '🙈 Hide Answers';
        toggleBtn.style.background = '#dc3545';
    } else {
        solutionsDiv.style.display = 'none';
        toggleBtn.textContent = '🔍 Check Your Answers';
        toggleBtn.style.background = '#ffc107';
    }
}

// Toggle current problem's answer
function toggleCurrentAnswer(problemNumber) {
    const answerDiv = document.getElementById('answer-key-' + problemNumber);
    const checkBtn = document.getElementById('check-answer-' + problemNumber);
    
    if (answerDiv.style.display === 'none') {
        answerDiv.style.display = 'block';
        checkBtn.textContent = 'Hide Solution';
        checkBtn.style.background = '#6c757d';
        checkBtn.style.borderColor = '#5a6268';
    } else {
        answerDiv.style.display = 'none';
        checkBtn.textContent = 'View Solution';
        checkBtn.style.background = '#007bff';
        checkBtn.style.borderColor = '#0056b3';
    }
}

// Initialize Problem Set Navigator
document.addEventListener('DOMContentLoaded', function() {
    const problems = document.querySelectorAll('.problem-container');
    
    if (problems.length > 0) {
        window.problemNavigator = new ActivityNavigator({
            containerSelector: '.problem-container',
            progressBarId: 'progress-fill',
            progressTextId: 'progress-text',
            prevButtonSelector: '.nav-prev',
            nextButtonSelector: '.nav-next',
            itemLabel: 'Problem',
            dropdownId: 'problem-selector'
        });
        
        console.log('[problem-set] Sequential navigation with dropdown initialized');
    }
});

// Legacy function support (for inline onclick handlers)
function navigateProblem(direction) {
    if (window.problemNavigator) {
        window.problemNavigator.navigate(direction);
    }
}

// Jump to specific problem from dropdown
function jumpToProblem(index) {
    if (window.problemNavigator) {
        window.problemNavigator.jumpTo(parseInt(index));
    }
}
</script>

        break;
      case 'hexagon_lab':
        modulePath = 'hl-form.js';
        break;
      case 'research_brief':
         modulePath = 'rb-form.js';
         break;
      // Add other content types here
    }

    if (modulePath) {
      const script = document.createElement('script');
      script.src = `/assets/js/activity-modules/${modulePath}?v=1761515983`;
      document.body.appendChild(script);
      console.log(`[activity-focused.html] Loaded module: ${script.src}`);
    }
  })();
</script>
