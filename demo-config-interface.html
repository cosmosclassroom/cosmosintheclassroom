<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Content Configuration Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .config-panel {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .config-panel h2 {
            margin-bottom: 1rem;
            color: #4a5568;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2d3748;
        }

        .form-group select,
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: #f7fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-item:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .checkbox-item input[type="checkbox"] {
            margin: 0;
        }

        .content-display {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            min-height: 500px;
        }

        .content-display h2 {
            margin-bottom: 1rem;
            color: #4a5568;
            font-size: 1.3rem;
        }

        .content-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }

        .content-card {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .content-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .content-card.small {
            padding: 0.75rem;
            min-height: 120px;
        }

        .content-card.large {
            padding: 1.5rem;
            min-height: 200px;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2d3748;
            font-size: 1.1rem;
        }

        .card-description {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .config-preview {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4a5568;
            max-height: 200px;
            overflow-y: auto;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            width: 100%;
        }

        .btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .stats-bar {
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #718096;
        }

        @media (max-width: 768px) {
            .demo-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dynamic Content Configuration Demo</h1>
            <p>Configure display settings and see content update in real-time</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="total-items">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="visible-items">0</div>
                <div class="stat-label">Visible Items</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="current-sort">Name</div>
                <div class="stat-label">Sort Method</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="card-size">Medium</div>
                <div class="stat-label">Card Size</div>
            </div>
        </div>

        <div class="demo-grid">
            <div class="config-panel">
                <h2>Configuration Panel</h2>
                
                <div class="form-group">
                    <label for="sort-method">Sort By:</label>
                    <select id="sort-method">
                        <option value="name">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="id">ID Number</option>
                        <option value="priority">Priority</option>
                        <option value="category">Category</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="card-size-select">Card Size:</label>
                    <select id="card-size-select">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="items-per-row">Items Per Row:</label>
                    <input type="number" id="items-per-row" min="1" max="6" value="3">
                </div>

                <div class="form-group">
                    <label>Categories to Show:</label>
                    <div class="checkbox-group" id="category-filters">
                        <!-- Categories will be populated dynamically -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="search-filter">Search Filter:</label>
                    <input type="text" id="search-filter" placeholder="Type to filter items...">
                </div>

                <button class="btn" onclick="exportConfig()">Export Configuration</button>
                <button class="btn" onclick="importConfig()">Import Configuration</button>

                <div class="config-preview" id="config-preview">
                    <!-- Configuration JSON will appear here -->
                </div>
            </div>

            <div class="content-display">
                <h2>Dynamic Content Display</h2>
                <div class="content-grid" id="content-grid">
                    <!-- Content cards will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample data - in a real application, this would come from your data files
        const sampleData = [
            {
                id: 1,
                name: "Asking Questions & Defining Problems",
                category: "inquiry",
                priority: 1,
                description: "Formulate investigable questions and define engineering problems for study.",
                icon: "Q"
            },
            {
                id: 2,
                name: "Developing and Using Models",
                category: "modeling",
                priority: 2,
                description: "Create, use, and refine models to represent and explain systems or phenomena.",
                icon: "M"
            },
            {
                id: 3,
                name: "Planning and Carrying Out Investigations",
                category: "investigation",
                priority: 3,
                description: "Design and conduct scientific investigations to answer questions.",
                icon: "I"
            },
            {
                id: 4,
                name: "Analyzing and Interpreting Data",
                category: "analysis",
                priority: 4,
                description: "Use tools and techniques to make sense of data and identify patterns.",
                icon: "A"
            },
            {
                id: 5,
                name: "Using Mathematics and Computational Thinking",
                category: "mathematics",
                priority: 5,
                description: "Apply mathematical concepts and computational methods to scientific problems.",
                icon: "C"
            },
            {
                id: 6,
                name: "Constructing Explanations",
                category: "explanation",
                priority: 6,
                description: "Develop explanations for phenomena based on evidence and reasoning.",
                icon: "E"
            },
            {
                id: 7,
                name: "Engaging in Argument from Evidence",
                category: "argumentation",
                priority: 7,
                description: "Use evidence to support arguments and critique the arguments of others.",
                icon: "G"
            },
            {
                id: 8,
                name: "Obtaining, Evaluating, and Communicating Information",
                category: "communication",
                priority: 8,
                description: "Gather information from multiple sources and communicate findings clearly.",
                icon: "O"
            }
        ];

        // Configuration object
        let currentConfig = {
            sortMethod: 'name',
            cardSize: 'medium',
            itemsPerRow: 3,
            visibleCategories: ['inquiry', 'modeling', 'investigation', 'analysis', 'mathematics', 'explanation', 'argumentation', 'communication'],
            searchFilter: ''
        };

        // Initialize the interface
        function initializeInterface() {
            populateCategoryFilters();
            setupEventListeners();
            renderContent();
            updateConfigPreview();
        }

        // Populate category filter checkboxes
        function populateCategoryFilters() {
            const categories = [...new Set(sampleData.map(item => item.category))];
            const container = document.getElementById('category-filters');
            
            container.innerHTML = categories.map(category => `
                <div class="checkbox-item">
                    <input type="checkbox" id="cat-${category}" value="${category}" checked>
                    <label for="cat-${category}">${category.charAt(0).toUpperCase() + category.slice(1)}</label>
                </div>
            `).join('');
        }

        // Set up event listeners
        function setupEventListeners() {
            document.getElementById('sort-method').addEventListener('change', (e) => {
                currentConfig.sortMethod = e.target.value;
                updateDisplay();
            });

            document.getElementById('card-size-select').addEventListener('change', (e) => {
                currentConfig.cardSize = e.target.value;
                updateDisplay();
            });

            document.getElementById('items-per-row').addEventListener('input', (e) => {
                currentConfig.itemsPerRow = parseInt(e.target.value);
                updateDisplay();
            });

            document.getElementById('search-filter').addEventListener('input', (e) => {
                currentConfig.searchFilter = e.target.value.toLowerCase();
                updateDisplay();
            });

            // Category filter listeners
            document.getElementById('category-filters').addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') {
                    const category = e.target.value;
                    if (e.target.checked) {
                        if (!currentConfig.visibleCategories.includes(category)) {
                            currentConfig.visibleCategories.push(category);
                        }
                    } else {
                        currentConfig.visibleCategories = currentConfig.visibleCategories.filter(cat => cat !== category);
                    }
                    updateDisplay();
                }
            });
        }

        // Sort data based on current configuration
        function sortData(data) {
            const sorted = [...data];
            
            switch (currentConfig.sortMethod) {
                case 'name':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name));
                case 'name-desc':
                    return sorted.sort((a, b) => b.name.localeCompare(a.name));
                case 'id':
                    return sorted.sort((a, b) => a.id - b.id);
                case 'priority':
                    return sorted.sort((a, b) => a.priority - b.priority);
                case 'category':
                    return sorted.sort((a, b) => a.category.localeCompare(b.category));
                default:
                    return sorted;
            }
        }

        // Filter data based on current configuration
        function filterData(data) {
            return data.filter(item => {
                const matchesCategory = currentConfig.visibleCategories.includes(item.category);
                const matchesSearch = currentConfig.searchFilter === '' || 
                    item.name.toLowerCase().includes(currentConfig.searchFilter) ||
                    item.description.toLowerCase().includes(currentConfig.searchFilter) ||
                    item.category.toLowerCase().includes(currentConfig.searchFilter);
                
                return matchesCategory && matchesSearch;
            });
        }

        // Render content cards
        function renderContent() {
            const filteredData = filterData(sampleData);
            const sortedData = sortData(filteredData);
            const container = document.getElementById('content-grid');
            
            // Update grid layout
            container.style.gridTemplateColumns = `repeat(${currentConfig.itemsPerRow}, 1fr)`;
            
            // Generate cards
            container.innerHTML = sortedData.map(item => `
                <div class="content-card ${currentConfig.cardSize}" onclick="selectCard(${item.id})">
                    <div class="card-icon">${item.icon}</div>
                    <div class="card-title">${item.name}</div>
                    ${currentConfig.cardSize !== 'small' ? `<div class="card-description">${item.description}</div>` : ''}
                    ${currentConfig.cardSize === 'large' ? `<div style="margin-top: 0.5rem; font-size: 0.8rem; color: #9ca3af;">Category: ${item.category}</div>` : ''}
                </div>
            `).join('');

            // Update statistics
            updateStatistics(filteredData.length, sortedData.length);
        }

        // Update statistics display
        function updateStatistics(visible, total) {
            document.getElementById('total-items').textContent = sampleData.length;
            document.getElementById('visible-items').textContent = visible;
            document.getElementById('current-sort').textContent = document.getElementById('sort-method').selectedOptions[0].text;
            document.getElementById('card-size').textContent = currentConfig.cardSize.charAt(0).toUpperCase() + currentConfig.cardSize.slice(1);
        }

        // Update configuration preview
        function updateConfigPreview() {
            const preview = document.getElementById('config-preview');
            preview.textContent = JSON.stringify(currentConfig, null, 2);
        }

        // Complete update function
        function updateDisplay() {
            renderContent();
            updateConfigPreview();
        }

        // Card selection handler
        function selectCard(id) {
            const item = sampleData.find(item => item.id === id);
            alert(`Selected: ${item.name}\nCategory: ${item.category}\nDescription: ${item.description}`);
        }

        // Export configuration
        function exportConfig() {
            const configData = {
                timestamp: new Date().toISOString(),
                config: currentConfig,
                metadata: {
                    totalItems: sampleData.length,
                    visibleItems: filterData(sampleData).length,
                    exportedBy: "Demo Interface"
                }
            };
            
            const blob = new Blob([JSON.stringify(configData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'content-config.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import configuration
        function importConfig() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            currentConfig = imported.config || imported;
                            
                            // Update UI controls
                            document.getElementById('sort-method').value = currentConfig.sortMethod;
                            document.getElementById('card-size-select').value = currentConfig.cardSize;
                            document.getElementById('items-per-row').value = currentConfig.itemsPerRow;
                            document.getElementById('search-filter').value = currentConfig.searchFilter;
                            
                            // Update category checkboxes
                            document.querySelectorAll('#category-filters input[type="checkbox"]').forEach(checkbox => {
                                checkbox.checked = currentConfig.visibleCategories.includes(checkbox.value);
                            });
                            
                            updateDisplay();
                            alert('Configuration imported successfully!');
                        } catch (error) {
                            alert('Error importing configuration: ' + error.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeInterface);
    </script>
</body>
</html>
