<header>Electric Charges and Coulomb's Law</header>
<h2 id="introduction-to-electrostatics">Introduction to Electrostatics</h2>
<ul>
<li><strong>Electric charge</strong>: a fundamental property of matter</li>
<li>Historical understanding:
<ul>
<li>Ancient Greeks noticed amber attracting objects when rubbed</li>
<li>&quot;Electron&quot; comes from Greek word for amber (ήλεκτρον)</li>
<li>Benjamin Franklin proposed positive and negative charges (1700s)</li>
</ul>
</li>
</ul>
<div class="important-info">
<ul>
<li>Two types of charge: <strong>positive</strong> (+) and <strong>negative</strong> (-)</li>
<li>Charge is <strong>conserved</strong>: cannot be created or destroyed, only transferred</li>
<li>SI unit: <strong>coulomb</strong> (C) - a very large amount of charge!</li>
</ul>
</div>
<footer>High School Honors Physics | Unit 8</footer>
</section>

<header>Electric Charges and Coulomb's Law</header>
<h2 id="charging-methods-demonstrated">Charging Methods Demonstrated</h2>
<p><img src="img/8_em-wave-particle/charging_methods.jpg" alt="" style="width:800px;" /></p>
<ul>
<li><strong>Friction</strong>: Transfer of electrons by rubbing materials (balloon on hair)</li>
<li><strong>Contact</strong>: Charge flows when objects touch (charging a metal sphere)</li>
<li><strong>Induction</strong>: Separation of charge without contact (charged rod near metal)</li>
</ul>
<footer>High School Honors Physics | Unit 8</footer>
</section>

<header>Electric Charges and Coulomb's Law</header>
<h2 id="conductors-vs-insulators">Conductors vs. Insulators</h2>
<table>
<thead>
<tr>
<th>Property</th>
<th>Conductors</th>
<th>Insulators</th>
</tr>
</thead>
<tbody>

<header>Electric Charges and Coulomb's Law</header>
<h2 id="coulombs-law-force-direction">Coulomb's Law: Force Direction</h2>
<p><img src="img/8_em-wave-particle/coulomb_force_direction.png" alt="" style="width:700px;" /></p>
<div class="important-info">
<ul>
<li>
<p>Force direction depends on charge signs:</p>
<ul>
<li>Like charges: Force is repulsive (away from each other)</li>
<li>Unlike charges: Force is attractive (toward each other)</li>
</ul>
</li>
<li>
<p><strong>Remember</strong>: The force acts along the line joining the charges</p>
</li>
<li>
<p>Each charge experiences equal and opposite force (Newton's 3rd Law)</p>
</li>
</ul>
</div>
<footer>High School Honors Physics | Unit 8</footer>

<h2 id="multiple-charge-interactions">Multiple Charge Interactions</h2>
<div class="important-info">

<li>
<p>When multiple charges are present, find the <strong>net force</strong> using:</p>

<li>Calculate force from each charge separately</li>

<li>Add all forces <strong>vectorially</strong> (using components)</li>

</li>
<li>
<p>This is called the <strong>Principle of Superposition</strong></p>

<header>Electric Charges and Coulomb's Law</header>
<h2 id="equilibrium-positions">Equilibrium Positions</h2>
<div class="important-info">
<ul>
<li>
<p><strong>Equilibrium</strong>: Position where net force on a charge is zero</p>
</li>
<li>
<p>For two charges:</p>
<ul>

<li>Unlike charges: Equilibrium exists only at the position of one charge</li>

<header>Electric Charges and Coulomb's Law</header>
<h2 id="charge-equilibrium">Charge Equilibrium</h2>
<div class="important-info">
<ul>
<li>
<p><strong>Static equilibrium</strong>: Net force on charge is zero</p>
</li>
<li>
<p><strong>Stable equilibrium</strong>: Returns to position when disturbed</p>
</li>
<li>
<p><strong>Unstable equilibrium</strong>: Moves away when disturbed</p>
</li>
<li>
<p>Finding equilibrium positions:</p>
<ol>
<li>Set up Coulomb's Law equations for all forces</li>
<li>Set net force equal to zero</li>
<li>Solve for position coordinates</li>
</ol>
</li>
</ul>
</div>
<footer>High School Honors Physics | Unit 8</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="Electric Charges and Coulomb's Law" data-footer="High School Honors Physics | Unit 8" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--footer:High School Honors Physics | Unit 8;--theme:default;" data-marpit-pagination-total="22">
<header>Electric Charges and Coulomb's Law</header>
<h2 id="charge-equilibrium-example">Charge Equilibrium: Example</h2>
<p><img src="img/8_em-wave-particle/equilibrium_example.png" alt="" style="width:500px;" /></p>
<div class="important-info">
<p><strong>Problem</strong>: Two +1.0 μC charges are fixed 10 cm apart. Where should a -1.0 μC charge be placed to be in equilibrium?</p>
<p><strong>Solution</strong>:</p>
<ul>
<li>By symmetry: The negative charge must be somewhere on the line connecting the positive charges</li>
<li>Let's place positive charges at x = 0 and x = 10 cm</li>
<li>For equilibrium, forces from both positive charges must be equal and opposite</li>
<li>This occurs at x = 5 cm (midpoint)</li>
<li>But this is an <strong>unstable equilibrium</strong>!</li>
</ul>
</div>
