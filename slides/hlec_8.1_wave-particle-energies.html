</section>

<h2 id="review-simple-harmonic-motion">Review: Simple Harmonic Motion</h2>

<ul>
<li>Mechanical waves illustrated differences between particle (oscillation, sometimes perpendicular) and wave (propagation, superposition) movements and interactions</li>
</ul>

<h2 id="electromagnetic-waves">Electromagnetic Waves</h2>
<p>Now we encounter <strong>electromagnetic waves</strong> that don't need a medium!</p>
<ul>
<li>These waves show a mysterious <strong>dual nature</strong>:
<ul>
<li>Sometimes act as waves (interference, diffraction)</li>
<li>Sometimes act as particles (photons)</li>
</ul>
</li>
<li>This duality is fundamental to modern technology:
<ul>
<li>Solar panels</li>
<li>Digital cameras</li>
<li>Fiber optic communications</li>
</ul>
</li>
</ul>
</section>

<h2 id="evidence-for-light-as-a-wave">Evidence for Light as a Wave</h2>
<div style="display: flex; justify-content: space-between; gap: 20px;">
<div style="flex: 1;">
<p><img src="Double-slit.svg.png" alt="contain" /></p>
<p><img src="Young_gif.gif" alt="width: 15" /></p>
</div>
<div style="flex: 1;">
<p>Passing light through a double slit produced clear evidence of wave interference:</p>
<ul>
<li>It creates alternating bright and dark bands (interference pattern)</li>
<li>Bright bands occur where waves combine <strong>constructively</strong></li>
<li>Dark bands occur where waves cancel <strong>destructively</strong></li>
</ul>
<ul>
<li data-marpit-fragment="1">This pattern can only be explained if light behaves as a <strong>wave</strong>!</li>
</ul>
</div>
</div>
</section>

<h2 id="the-particle-nature-of-light">The Particle Nature of Light</h2>
<ul>
<li>
<p><strong>Newton vs. Huygens debate</strong> (1600s-1700s):</p>
<ul>
<li>Newton: light is particles (&quot;corpuscles&quot;)</li>
<li>Huygens: light is waves</li>
</ul>
</li>
<li>
<p>The <strong>photoelectric effect</strong> (observed late 1800s):</p>
<ul>
<li>Light shining on metal causes electron emission</li>
<li>But doesn't follow wave predictions!</li>
</ul>
</li>
<li>
<p><strong>Einstein's explanation</strong> (1905):</p>
<ul>
<li>Light consists of discrete packets (photons)</li>
<li>Each photon carries a specific amount of energy</li>
<li>Won Nobel Prize for this work in 1921</li>
</ul>
</li>
</ul>
</section>

<div style='column'>

<h2 id="wave-particle-duality">Wave-Particle Duality</h2>

<ul>
<li>Interference experiments → wave nature</li>
<li>Photoelectric effect → particle nature</li>
</ul>
</li>
</ul>

<h2 id="demonstrating-matter-waves">Demonstrating Matter Waves</h2>
<p><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Double-slit_experiment_results_electron.jpg/800px-Double-slit_experiment_results_electron.jpg" alt="" style="width:600px;" /></p>
<ul>
<li>Electrons fired through double slits create <strong>interference patterns</strong></li>
<li>These patterns only make sense if electrons are waves!</li>
<li>Confirmed by Davisson and Germer in 1927</li>
<li>Larger particles have smaller wavelengths:
<ul>
<li>Electron: λ ≈ 10^-10 m</li>
<li>Baseball: λ ≈ 10^-34 m (too small to detect)</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" data-style="inverse" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;--style:inverse;" data-marpit-pagination-total="37">
<h2 id="practical-applications-of-wave-particle-duality">Practical Applications of Wave-Particle Duality</h2>
<ul>
<li><strong>Spectroscopy</strong>: Analyzing light spectra to identify materials</li>
<li><strong>Solar cells</strong>: Converting photon energy into electrical energy</li>
<li><strong>Electron microscopes</strong>: Using electron waves to see tiny objects</li>
<li><strong>Quantum computing</strong>: Manipulating quantum states for computation</li>
<li><strong>Lasers</strong>: Coherent light based on quantum energy levels</li>
<li><strong>Fluorescent materials</strong>: Absorbing and re-emitting photons</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="2" data-paginate="true" data-theme="default" data-style="inverse" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;--style:inverse;" data-marpit-pagination-total="37">
<h2 id="the-double-slit-experiment-revisited">The Double-Slit Experiment Revisited</h2>
<ul>
<li data-marpit-fragment="1">Even single electrons or photons create an interference pattern over time
<ul>
<li>This means a single particle &quot;interferes with itself&quot;</li>
</ul>
</li>
<li data-marpit-fragment="2">The <strong>wave function</strong> describes the probability of finding the particle
<ul>
<li>Observation collapses this probability into a definite position</li>
<li>This is the strange reality of <strong>quantum mechanics</strong>!</li>
<li><img src="Young_gif-1.gif" alt="alt text" /></li>
</ul>
</li>
</ul>
</section>

<h2 id="detecting-light-from-brightness-to-photons">Detecting Light: From Brightness to Photons</h2>
<ul>
<li>
<p><strong>Classical detection</strong>: Measures average intensity</p>
<ul>
<li>Light meters in cameras</li>
<li>Solar irradiance measurements</li>
</ul>
</li>
<li>
<p><strong>Quantum detection</strong>: Counts individual photons</p>
<ul>
<li>Photomultiplier tubes</li>
<li>CCDs in digital cameras</li>
<li>Single-photon avalanche diodes</li>
</ul>
</li>
<li>
<p><strong>Detection limits</strong>:</p>
<ul>
<li>Human eye: ~5-10 photons</li>
<li>Modern detectors: single photon sensitivity</li>
</ul>
</li>
</ul>
</section>

<h2 id="resonant-absorption-of-em-waves">Resonant Absorption of EM Waves</h2>
<ul>
<li data-marpit-fragment="1">
<p><strong>Resonance</strong>: When EM wave frequency matches natural frequency of a system</p>
</li>
<li data-marpit-fragment="2">
<p>Different materials and molecules resonate at different frequencies:</p>
<ul>
<li data-marpit-fragment="3">Water molecules: Rotate at microwave frequencies (~2.45 GHz)</li>
<li data-marpit-fragment="4">Electrons in atoms: Oscillate at visible/UV frequencies</li>
<li data-marpit-fragment="5">Chemical bonds: Vibrate at infrared frequencies</li>
</ul>
</li>
</ul>
<ul>
<li><strong>Applications of resonant absorption</strong>:
<ul>
<li>Microwave cooking: Water molecules absorb 2.45 GHz radiation</li>
<li>MRI: Hydrogen nuclei absorb radio waves in magnetic field</li>
<li>Infrared spectroscopy: Identifies molecules by absorption patterns</li>
<li>Sunscreen: Absorbs harmful UV radiation</li>
</ul>
</li>
</ul>
</section>

<h2 id="connection-to-electric-charges">Connection to Electric Charges</h2>
<ul>
<li>
<p>All electromagnetic waves originate from <strong>accelerating charges</strong>:</p>
<ul>
<li>Radio waves: electrons oscillating in antennas</li>
<li>Light: electrons jumping between energy levels</li>
<li>X-rays: electrons hitting targets</li>
</ul>
</li>
<li>
<p>Static charges create electric fields</p>
</li>
<li>
<p>Moving charges create magnetic fields</p>
</li>
<li>
<p>Accelerating charges create electromagnetic waves</p>
</li>
<li>
<p>Next up: Understanding electric charges and their interactions</p>
</li>
</ul>

<p>Cooking explanation:</p>
<ul>
<li>Water molecules are polar (positive and negative ends)</li>
<li>The 2.45 GHz frequency is specifically chosen to match a rotational resonance frequency of water</li>
<li>As microwaves pass through food, water molecules rapidly rotate to align with oscillating electric field</li>
<li>This rotation causes molecular friction/collisions</li>
<li>Kinetic energy is transferred to surrounding molecules as heat</li>
<li>This resonant absorption is much more efficient than non-resonant frequencies, allowing targeted heating of water-containing foods</li>
</ul>
</section>
