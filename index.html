<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook</title>
    <link rel="stylesheet" href="./assets/css/notebook.css" onerror="handleMissingCSS('notebook.css')" />
    <link rel="text/css" href="./assets/css/style.css" onerror="handleMissingCSS('style.css')" />
    <link rel="icon" href="./assets/images/favicon.ico" onerror="handleMissingFavicon()" />
    <script>
        function handleMissingCSS(fileName) {
            console.error(`Failed to load CSS file: ${fileName}`);
        }
        function handleMissingFavicon() {
            console.warn('Favicon not found. Using default fallback.');
        }
    </script>
    <!-- MathJax for rendering LaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <h1>Notebook</h1>
    <div class="nav">
        <button id="prevBtn" disabled>Previous</button>
        <div class="file-info">
            File <span id="currentIndex">1</span> of <span id="totalFiles">?</span>
        </div>
        <button id="nextBtn">Next</button>
    </div>
    <div id="content">
        <p>Loading...</p>
    </div>
    <script src="./shared/script.js" onerror="handleMissingScript('script.js')"></script>
    <script>
        function handleMissingScript(fileName) {
            console.error(`Failed to load script file: ${fileName}`);
            document.getElementById('content').innerHTML = '<p>Error loading script. Some functionality may be unavailable.</p>';
        }
        document.addEventListener('DOMContentLoaded', () => {
            // Dynamically load the markdown file
            fetch('./index.md') // Adjust the file name as needed
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load file: index.md`);
                    }
                    return response.text();
                })
                .then(content => {
                    // Insert the content into the content div
                    document.getElementById('content').innerHTML = content;

                    // Render LaTeX using MathJax
                    MathJax.typeset();

                    // Dynamically apply the CSS for the loaded document
                    const documentCSS = document.createElement('link');
                    documentCSS.rel = 'stylesheet';
                    documentCSS.href = '/assets/css/documents.css'; // Path to the desired CSS file
                    documentCSS.onerror = () => console.error('Failed to load CSS file: /assets/css/documents.css');
                    document.head.appendChild(documentCSS);
                })
                .catch(error => {
                    console.error(error.message);
                    document.getElementById('content').innerHTML = '<p>Error loading content. Please check back later.</p>';
                });
        });
    </script>
</body>
</html>
