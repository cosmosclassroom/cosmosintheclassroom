<!-- This is a static HTML file for the Cosmos in the Classroom project. -->
<!-- It includes a navigation panel and some example content. -->
<!-- The file is structured with a head and body -->
 
<head>
<link rel="stylesheet" href="../assets/css/worksheets.css"> <!-- Ensure the path is correct -->
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>mermaid.initialize({startOnLoad:true});</script>
</head>
<body>

<!-- Updated navigation panel -->
<div class="navbar">
  <div class="nav-panel">
    <button onclick="navigatePage(-1)" class="nav-button">← Back</button>
    <button onclick="navigatePage(1)" class="nav-button">Forward →</button>
  </div>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const lastPage = localStorage.getItem("lastPage");
    if (lastPage) {
      document.getElementById("content-frame").src = lastPage;
      
    }
  });

  async function navigatePage(direction) {
    const response = await fetch('./statichtml.json');
    const pages = await response.json();
    const currentPath = document.getElementById('content-frame').src.split('/').pop();
    const currentIndex = pages.findIndex(page => currentPath.endsWith(page.url)); // Ensure correct matching
    let newIndex = currentIndex + direction;

    // Wrap around logic
    if (newIndex < 0) {
      newIndex = pages.length - 1; // Go to the last page
    } else if (newIndex >= pages.length) {
      newIndex = 0; // Go to the first page
    }

    const newPage = pages[newIndex].url;
    document.getElementById('content-frame').src = newPage;
    localStorage.setItem("lastPage", newPage); // Save the last page to localStorage
  }
  </script>
</div>

<section class="content" style="display: flex; border: 3rem black; justify-content: space-between; flex-direction: row;">
  <div>
    <h1>First Div</h1>
    <div class='content'>
      <h1>First Div Part 1<br>First Div Part 1
    </div>
    <div>First Div Part 2</div>
  </div>
  <div>
    <h1>Second Div</h1>
  </div>
</section>

<!-- Viewing port for rendering HTML pages -->
<div class="iframe-wrapper">
  <iframe id="content-frame" src="html1.html" style="width: 100%; height: auto;> </iframe>
</div>

<h1> This is text</h1>
<p> This is a paragraph. </p>
<p> This is another paragraph. </p>
<p> This is a third paragraph. </p> 
<p> This is a fourth paragraph. </p>
<a> This is a <link rel="alternate" href="rss.xml" type="application/rss+xml" title="RSS">

</body>
</html>
