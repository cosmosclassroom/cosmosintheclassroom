<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save Quiz Response</title>
    <script src="../scripts/submitQuiz.js"></script>
</head>
<body>
    <form id="quizForm" onsubmit="submitQuiz(event)">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" name="studentName" required><br><br>
        
        <label for="quizName">Quiz Name:</label>
        <input type="text" id="quizName" name="quizName" required><br><br>
        
        <label for="responses">Quiz Responses:</label>
        <textarea id="responses" name="responses" rows="10" cols="50" required></textarea><br><br>
        
        <input type="submit" value="Submit Quiz">
    </form>
</body>
</html>
