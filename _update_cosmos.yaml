name: Build and Deploy to cosmosintheclassroom.org

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Socrates (private)
      uses: actions/checkout@v3
      with:
        path: socrates

    - name: Checkout cosmosintheclassroom.org (public)
      uses: actions/checkout@v3
      with:
        repository: cosmosclassroom/cosmosintheclassroom.org
        path: public
        token: ${{ secrets.DEPLOY_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install markdown pyyaml pillow

    - name: Build site
      run: |
        python socrates/scripts/build_site.py --source socrates --destination public
        
    - name: Process and optimize assets
      run: |
        # This step would optimize images, minify CSS/JS, etc.
        python socrates/scripts/optimize_assets.py --source socrates/_assets --destination public/assets

    - name: Commit and push changes
      run: |
        cd public
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "Build from Socrates private repo"
        git push
