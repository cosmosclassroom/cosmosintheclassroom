title: Cosmos in the Classroom
baseurl: "/cosmosintheclassroom"
url: ""

# Build Settings
markdown: kramdown
permalink: pretty

# MathJax Configuration
kramdown:
  math_engine: katex
  syntax_highlighter: rouge
  input: GFM
  math_engine_opts:
    preview: true
    preview_as_code: true
  parse_block_html: true

# Plugins
plugins:
  - jekyll-paginate-v2

# Simplified defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      mathjax: true

# Minimal theme settings
theme: null

# Basic includes
include:
  - _pages
  - _slides
  - assets
  - assets/css

# Sass/SCSS configuration
sass:
  sass_dir: assets/css
  style: expanded

keep_files:
  - .marp.json
  - template.html
  - reveal.js
  - README.md

exclude:
  - vendor
  - "node_modules"
  - ".git"
  - ".github"
  - Gemfile
  - Gemfile.lock
