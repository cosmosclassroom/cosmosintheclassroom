title: Cosmos in the Classroom
baseurl: ""
url: "https://cosmosintheclassroom.github.io"

# Repository Configuration
repository: cosmosclassroom/cosmosintheclassroom
github_username: cosmosclassroom

# Build Settings
markdown: kramdown
permalink: pretty

# MathJax Configuration
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  math_engine_opts:
    preview: true
    preview_as_code: true
  parse_block_html: true

# Plugins
plugins:
  - jekyll-marp

# Simplified defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      mathjax: true
  -
    scope:
      path: "slides"
    values:
      layout: "slides"
      mathjax: true

# Minimal theme settings
theme: null

# Basic includes
include:
  - _includes
  - _layouts
  - _posts
  - _pages
  - assets
  - assets/css
  - assets/js
  - assets/reveal.js
  - assets/reveal.js/css
  - assets/reveal.js/js

# Sass/SCSS configuration
sass:
  sass_dir: assets/reveal.js/css
  style: expanded 

keep_files:
  - .marp.json
  - template.html
  - reveal.js
  - README.md

exclude:
  - vendor
  - node_modules
  - ".git"
  - ".github"
  - Gemfile
  - Gemfile.lock
  - /reveal.js/node_modules
  - /assets/reveal.js/node_modules
  - README.md
  - LICENSE
  - slides


# Pagination Settings
pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - Page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

autopages:
  enabled: true
