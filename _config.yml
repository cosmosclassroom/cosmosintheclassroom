title: Cosmos in the Classroom
baseurl: ""
url: "https://cosmosintheclassroom.github.io"


# Build Settings
markdown: kramdown
permalink: pretty

# MathJax Configuration
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  math_engine_opts:
    preview: true
    preview_as_code: true
  parse_block_html: true

# Plugins
plugins:
  - jekyll-paginate-v2

# Simplified defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      mathjax: true
  -
    scope: 
      path: "slides"
      type: "slides"
    values:
      layout: "slide"
      mathjax: true

# Minimal theme settings
theme: null

# Previous configurations remain the same...

# Updated defaults for slides
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      mathjax: true
  -
    scope: 
      path: "slides"      # Change this to match your actual directory
      type: "pages"       # Change to "pages" instead of "slides"
    values:
      layout: "slide"
      mathjax: true

# Keep your includes but be consistent with directories
include:
  - _includes
  - _layouts
  - _posts
  - _pages
  - slides            # Make sure this matches the directory you're using
  - assets
  - assets/css

# Remove this line from your exclude section
exclude:
  - vendor
  - "node_modules"
  - ".git"
  - ".github"
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .DS_Store
  - .gitignore
  # Remove this line: - _slides/*.md

# Sass/SCSS configuration
sass:
  sass_dir: assets/css
  style: expanded

keep_files:
  - .marp.json
  - template.html
  - reveal.js
  - README.md

## Reveal.js settings
reveal_path: assets/reveal.js
reveal_theme: black
reveal_transition: slide
reveal_transition_speed: default
reveal_controls: true
reveal_progress: true
reveal_history: true
reveal_center: true
reveal_slide_number: true
reveal_keyboard_shortcuts: true



### Pagination Settings
pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - Page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

autopages:
  enabled: true
