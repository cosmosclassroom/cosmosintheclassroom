title: Cosmos in the Classroom
baseurl: "/cosmosintheclassroom"
url: ""

# Build Settings
markdown: kramdown
permalink: pretty

# MathJax Configuration
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  math_engine_opts:
    preview: true
    preview_as_code: true
  parse_block_html: true

# Plugins

plugins:
  - jekyll-paginate-v2
  - jekyll-revealjs


collections:
  slides:
    output: true


reveal:
  theme: white
  transition: slide
  controls: true
  progress: true
  history: true
  center: true
  slideNumber: true
  overview: true
  touch: true
  loop: false
  fragments: true
  

# Simplified defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      mathjax: true

# Minimal theme settings
theme: null

# Basic includes
include:
  - _pages

exclude:
  - .marp.json
  - template.html
  - README.md
  - vendor
  - "node_modules"
  - ".git"
  - ".github"
  - Gemfile
  - Gemfile.lock
