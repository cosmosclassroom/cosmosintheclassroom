baseurl: ""
url: ""

# Build Settings
markdown: kramdown
permalink: pretty

# MathJax Configuration
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  math_engine_opts:
    preview: true
    preview_as_code: true


# Plugins

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-assets
  - jekyll-paginate-v2
  - jekyll-archives
  - jekyll-redirect-from
  - jekyll-revealjs

reveal:
  theme: white
  transition: slide
  controls: true
  progress: true
  history: true
  center: true
  slideNumber: true
  overview: true
  touch: true
  loop: false
  fragments: true
  

# Simplified defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      mathjax: true

# Minimal theme settings
theme: null

# Basic includes
include:
  - "*.md"
  - "**/*.md"
  - "*.marp.md"
  - ".marprc.yml"
  - "slides/**/*.md"

exclude:
  - "node_modules"
  - ".git"
  - ".github"
  - "README.md"
  - Gemfile
  - Gemfile.lock
  - vendor
