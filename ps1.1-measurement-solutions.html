<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Problem Set 1.1 — Solutions Viewer</title>
  <style>
    body{font-family: system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial; margin:0; background:#f7f7fb; color:#111}
    .wrap{max-width:900px;margin:3rem auto;padding:2rem;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(24,24,40,0.06)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    h1{font-size:1.25rem;margin:0}
    .controls{display:flex;gap:.5rem;align-items:center}
    button{background:#2563eb;color:#fff;border:0;padding:.5rem .75rem;border-radius:6px;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}
    .btn-ghost{background:#eef2ff;color:#2563eb}
    #content{min-height:260px;padding:1rem 0;font-size:1rem;line-height:1.5}
    .meta{color:#475569;font-size:.9rem;margin-bottom:.5rem}
    .progress{height:8px;background:#e6eefc;border-radius:99px;overflow:hidden}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);width:0%}
    footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;color:#475569;font-size:.9rem}
    pre{background:#0b1220;color:#dbeafe;padding:1rem;border-radius:6px;overflow:auto}
    .kb{font-weight:600}
  </style>
  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']]},
      options: {skipHtmlTags: ['script','noscript','style','textarea','pre']}
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Problem Set 1.1 — Solutions</h1>
      <div class="controls">
        <button id="prev" class="btn-ghost">◀ Prev</button>
        <button id="next">Next ▶</button>
      </div>
    </header>

    <div class="meta">Slide <span id="idx">1</span> / <span id="total">8</span></div>
    <div class="progress" aria-hidden>
      <i id="bar"></i>
    </div>

    <main id="content" role="main" aria-live="polite">
      <!-- dynamic content -->
    </main>

    <footer>
      <div>Use <span class="kb">←</span> and <span class="kb">→</span> to navigate</div>
      <div><button id="showAll" class="btn-ghost">Show All</button></div>
    </footer>
  </div>

  <script>
    const solutions = [
      `
      <h2>1. Cheetah's Speed</h2>
      <p><strong>Answer:</strong> 33.33 m/s</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$\\displaystyle\\frac{120.0\\ \\mathrm{km}}{1\\ \\mathrm{hr}} \\times \\frac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}} \\times \\frac{1\\ \\mathrm{hr}}{3600\\ \\mathrm{s}} = 33.333\\ldots\\ \\mathrm{m/s}$$</p>
      <p><strong>Sig figs:</strong> 120.0 has four significant figures, so report the answer to four significant figures (33.33 m/s).</p>
      </div>
      `,

      `
      <h2>2. Basketball Hoop Height</h2>
      <p><strong>Answer:</strong> 3.048 m</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$10.00\\ \\mathrm{ft} \\times \\frac{12\\ \\mathrm{in}}{1\\ \\mathrm{ft}} \\times \\frac{2.540\\ \\mathrm{cm}}{1.000\\ \\mathrm{in}} \\times \\frac{1\\ \\mathrm{m}}{100\\ \\mathrm{cm}} = 3.048\\ \\mathrm{m}$$</p>
      <p><strong>Sig figs:</strong> 10.00 ft and 2.540 cm both have four significant figures; report to four sig figs.</p>
      </div>
      `,

      `
      <h2>3. Marathon Distance</h2>
      <p><strong>Answer:</strong> 42.19 km</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$26.22\\,\\text{mi}\\times\\dfrac{1.609\\,\\text{km}}{1.000\\,\\text{mi}} = 42.19338\\,\\text{km}$$</p>
      <p><strong>Sig figs:</strong> Round to four significant figures → 42.19 km.</p>
      </div>
      `,

      `
      <h2>4. Area of Land</h2>
      <p><strong>Answer:</strong> 2.0 × 10<sup>2</sup> m<sup>2</sup> (200 m<sup>2</sup>, 2 sig figs)</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$\\text{Area} = 24.5\\ \\mathrm{m} \\times 8.2\\ \\mathrm{m} = 200.9\\ \\mathrm{m}^2$$</p>
      <p><strong>Rule:</strong> Multiply → match the fewest significant figures (8.2 has 2 sig figs) → report with 2 sig figs.</p>
      </div>
      `,

      `
      <h2>5. Total Displacement</h2>
      <p><strong>Answer:</strong> 123 m</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$15.88\\ \\mathrm{m} + 2.1\\ \\mathrm{m} + 105\\ \\mathrm{m} = 122.98\\ \\mathrm{m}$$</p>
      <p><strong>Rule:</strong> Addition → match the fewest decimal places (105 has 0 decimal places) → round to nearest whole number → 123 m.</p>
      </div>
      `,

      `
      <h2>6. Dividing Measurements</h2>
      <p><strong>Answer:</strong> 2.7 × 10<sup>2</sup> (270)</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$\\frac{150.0\\ \\mathrm{s}}{0.55\\ \\mathrm{s}} = 272.7272\\ldots$$</p>
      <p><strong>Rule:</strong> Division → match fewest sig figs (0.55 has 2 sig figs) → round to 2 sig figs → 2.7 × 10<sup>2</sup>.</p>
      </div>
      `,

      `
      <h2>7. Syene to Alexandria (Eratosthenes)</h2>
      <p><strong>Answer:</strong> 925 km</p>
      <div class="work">
      <p><strong>Work:</strong></p>
      <p>$$5.00 \\times 10^3\\ \\text{stadia} \\times \\frac{185\\ \\mathrm{m}}{1\\ \\text{stadium}} \\times \\frac{1\\ \\mathrm{km}}{1000\\ \\mathrm{m}} = 925\\ \\mathrm{km}$$</p>
      <p><strong>Sig figs:</strong> 5.00×10^3 and 185 each have 3 sig figs → report final answer with 3 sig figs.</p>
      </div>
      `,

      `
      <h2>8. Reflection</h2>
      <p>Reporting <em>925.1234 km</em> would be dishonest: the input values only justify three significant figures. Only report digits supported by measurements.</p>
      `
    ];

    const total = solutions.length;
    const idxEl = document.getElementById('idx');
    const totalEl = document.getElementById('total');
    const contentEl = document.getElementById('content');
    const barEl = document.getElementById('bar');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const showAllBtn = document.getElementById('showAll');

    let i = 0;
    totalEl.textContent = total;

    function render() {
      idxEl.textContent = i+1;
      contentEl.innerHTML = solutions[i];
      const pct = Math.round(((i+1)/total)*100);
      barEl.style.width = pct + '%';
      prevBtn.disabled = i === 0;
      nextBtn.disabled = i === total-1;
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetClear();
        MathJax.typesetPromise([contentEl]).catch(()=>{});
      }
    }

    prevBtn.addEventListener('click', ()=>{ if(i>0){ i--; render(); }});
    nextBtn.addEventListener('click', ()=>{ if(i<total-1){ i++; render(); }});

    document.addEventListener('keydown',(e)=>{
      if(e.key === 'ArrowRight') { nextBtn.click(); }
      if(e.key === 'ArrowLeft') { prevBtn.click(); }
    });

    showAllBtn.addEventListener('click', ()=>{
      contentEl.innerHTML = solutions.map((s,idx)=>`<section style="margin-bottom:1.25rem"><div class="meta">Slide ${idx+1}</div>${s}</section>`).join('');
      idxEl.textContent = 'all';
      barEl.style.width = '100%';
      prevBtn.disabled = true; nextBtn.disabled = true; showAllBtn.disabled = true;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
    });

    // initial render after MathJax loaded
    window.addEventListener('load', ()=>{
      render();
    });
  </script>
</body>
</html>
