<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <!-- import katex for math rendering --->
    {% if page.math != false %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    {% endif %}
    {% if page.stylesheet %}
    <link rel="stylesheet" href="{{ '/assets/css/' | append: page.stylesheet | append: '.css' | relative_url }}" />
    {% else %}
    <link rel="stylesheet" href="{{ '/assets/css/worksheets.css' | relative_url }}" />
    {% endif %}

</head>

<body>
    <header class="header">
        <container class="flex-container">
            <div class="content">

                {{ page.content | markdownify}} <!-- This will render the markdown content of the page -->

               
            </div>

            <!-- Initialize KaTeX rendering -->
            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    renderMathInElement(document.body, {
                        delimiters: [
                            { left: "$$", right: "$$", display: true },
                            { left: "$", right: "$", display: false },
                            { left: "\\[", right: "\\]", display: true },
                            { left: "\\(", right: "\\)", display: false }
                        ],
                        throwOnError: false
                    });
                });
            </script>
</body>

</html>
