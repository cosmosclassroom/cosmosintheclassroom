<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
    <title>{{ page.title }} | {{ site.title }}</title>
    
    {% if page.math != false %}
    <!-- KaTeX Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="text/javascript" async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    {% endif %}
    <!-- Conditional render: if specified css in markdown, use that stylesheet; else: use style.css-->
    {% if page.stylesheet %}
    <link rel="stylesheet" href="{{ '/assets/css/' | append: page.stylesheet | append: '.css' | relative_url }}" />
    {% else %}
    <link rel="stylesheet" href="{{ '/assets/css/worksheets.css' | relative_url }}" />
    {% endif %}

  
  </head>
  <body>
    <div class='nav'>
    
      <a href="/" class="button">Homepage</a>
      
      </div>
      
    <div class="navbar">
      </div>
    </div>
    <body>
      <div class="markdown-body">
        {{ content }}
      </div>  
  </body>
    {% if page.math != false %}
    <!-- Initialize KaTeX rendering -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });
        });
    </script>
    {% endif %}
  </body>
</html>
