<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ page.description | default: site.description }}">

  
  <link rel="stylesheet" href="{{ '/assets/css/reveal.css' | relative_url }}" />
  <!-- Import KaTeX styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <!-- Import KaTeX script -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- Import auto-render extension for KaTeX -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  {% if page.stylesheet %}
  <link rel="stylesheet" href="{{ '/assets/css/' | append: page.stylesheet | append: '.css' | relative_url }}" />
  {% else %}
  <link rel="stylesheet" href="{{ '/assets/css/worksheets.css' | relative_url }}" />
  {% endif %}
  
  <body>
    <div class='nav'>
    
      <a href="/" class="button">Homepage</a>
      
      </div>
      
    <div class="navbar">
      </div>
    </div>
    <body>
      <div class="markdown-body">
        {{ content }}
      </div>  
  </body>
    {% if page.math != false %}
    <!-- Initialize KaTeX rendering -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });
        });
    </script>
    {% endif %}
  </body>
</html>
