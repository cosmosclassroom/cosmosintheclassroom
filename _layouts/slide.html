<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>{{ page.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/reveal.js/dist/reveal.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/reveal.js/dist/theme/white.css' | relative_url }}">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      {{ content }}
    </div>
  </div>
  <script src="{{ '/reveal.js/dist/reveal.js' | relative_url }}"></script>
  <script>
    Reveal.initialize({
      width: 960,
      height: 700,
      margin: 0.1,
      hash: true,
      transition: 'slide'
    });
  </script>
</body>
</html>
