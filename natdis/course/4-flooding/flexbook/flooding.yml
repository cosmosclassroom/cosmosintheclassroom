flexbookGuide:
  - unitNumber: 2
    unitTitle: Tsunamis
    keyVocabulary:
      - term: Tsunami
        definition: >-
          A series of large ocean waves, typically caused by underwater
          earthquakes or volcanic eruptions.
      - term: Shoaling
        definition: >-
          The effect by which surface waves entering shallower water change in
          wave height.
      - term: Wavelength
        definition: >-
          The distance between corresponding points of two consecutive waves.
      - term: Early Warning System
        definition: >-
          An integrated system of hazard monitoring, forecasting, and prediction,
          disaster risk assessment, communication, and preparedness activities.
    keyReasoningSkills:
      - Calculating Wave Speed
      - Predicting Travel Times
      - Analyzing the Relationship Between Wavelength and Wave Height
      - 'Calculating Rates (e.g., walking speed)'
      - Using Map Scales to Determine Distance
      - Interpreting Timelines and Data Tables
    chapters:
      - chapterNumber: 1
        chapterTitle: 'The Scientist: Anatomy of a Wave'
        instructionalFlow:
          - type: reading
            title: 'From the Seafloor to the Shore: The Story of a Wave'
            content: >-
              This section investigates the immense power of tsunamis, using the
              2004 Indian Ocean event as our case study. We will explore the
              paradox of the tsunami: a wave that can cross an entire ocean
              unnoticed, only to unleash catastrophic energy upon reaching the
              coast.
          - type: activity_prompt
            title: 'Pause for Inquiry: Hexagon Lab'
            content: >-
              It is time to act as a scientist. Pause your reading and navigate to
              the Hexagon Lab to model how a tsunami travels and analyze the
              factors that determine its speed.
            linkedActivity: 'Hexagon Lab 2.1: Modeling Tsunami Travel'
          - type: reading
            title: Understanding Wave Dynamics
            content: >-
              This section delves into the mathematical principles that govern a
              tsunami's speed and power, preparing you for the upcoming problem set.
          - type: activity_prompt
            title: 'Pause for Practice: Problem Set'
            content: >-
              Apply what you have just learned. Pause your reading and complete
              the problem set to practice your calculations.
            linkedActivity: 'Problem Set 2.1: Wave Dynamics'
          - type: activity_prompt
            title: 'Pause for Reporting: Research Brief'
            content: >-
              Synthesize your findings. Pause here and complete the first entry
              of your Scientist's Report in your Research Brief.
            linkedActivity: 'Research Brief: Scientist''s Report - Chapter 1'
      - chapterNumber: 2
        chapterTitle: 'The Engineer: The Value of Time'
        instructionalFlow:
          - type: reading
            title: 'From Forecast to Warning: Engineering Systems That Save Lives'
            content: >-
              A scientific forecast is just data; a warning is a call to action.
              This section explores the engineering challenge of turning a
              prediction into a life-saving warning system under real-world
              constraints.
          - type: activity_prompt
            title: 'Pause for Design: Hexagon Lab'
            content: >-
              Step into the role of an engineer. Pause your reading and navigate
              to the Hexagon Lab to design a tsunami warning system within a
              strict budget, weighing the crucial trade-offs between cost,
              speed, and reliability.
            linkedActivity: 'Hexagon Lab 2.2: Designing a Warning System'
          - type: reading
            title: 'Analyzing Evacuation & Escape'
            content: >-
              A warning is only effective if people can get to safety. This
              section introduces the methods used to calculate safe evacuation
              distances and times, preparing you for the next problem set.
          - type: activity_prompt
            title: 'Pause for Practice: Problem Set'
            content: >-
              Apply your analytical skills. Pause your reading and complete the
              problem set on warning systems and evacuation.
            linkedActivity: 'Problem Set 2.2: Warning Systems & Evacuation'
          - type: activity_prompt
            title: 'Pause for Proposals: Research Brief'
            content: >-
              Synthesize your findings. Pause here and complete the first entry
              of your Engineer's Proposal in your Research Brief, which will form
              the technical foundation for your final policy recommendations.
            linkedActivity: 'Research Brief: Engineer''s Proposal - Chapter 3'