              typeof doc === 'object' && doc[content.type] || 
              typeof doc === 'string' && doc.includes(content.type + '/')
            );
            
            if (hasContent) {
              const option = document.createElement('option');
              option.value = this.value + content.type + '/';
              option.textContent = `${content.icon} ${content.title}`;
              contentSelect.appendChild(option);
            }
          });
          
          contentSelect.disabled = false;
        }
        
        // Enable Go button if there are options
        goButton.disabled = contentSelect.options.length <= 1;
      } else {
        // Use original course data navigation
        const selectedUnit = courseData.units.find(unit => unit.url === this.value);
        if (selectedUnit && selectedUnit.content_types && selectedUnit.content_types.length > 0) {
          selectedUnit.content_types.forEach(content => {
            const option = document.createElement('option');
            option.value = content.type;
            option.textContent = content.title;
            contentSelect.appendChild(option);
          });
          contentSelect.disabled = false;
        } else {
          goButton.disabled = false;
        }
      }
    }
  });

  // Function to populate items when a content type is selected
  contentSelect.addEventListener('change', function() {
    itemSelect.innerHTML = '<option value="">-- Choose Document --</option>';
    documentSelectGroup.style.display = 'none';
    goButton.disabled = true;
    
    if (useManifest && this.value) {
      // Extract the unit slug and content type from the selected value
      const pathParts = this.value.split('/').filter(part => part);
      const unitSlug = pathParts[pathParts.length - 2];
      const contentType = pathParts[pathParts.length - 1];
      
      const selectedUnit = manifestData.units.find(unit => unit.unitSlug === unitSlug);
      if (selectedUnit && selectedUnit.documents) {
        // Find all documents of this content type
        let documents = [];
        
        // Flatten the document structure to find all items of this content type
        selectedUnit.documents.forEach(doc => {
          if (typeof doc === 'object' && doc[contentType]) {
            // If it's an object with the content type as a key
            doc[contentType].forEach(item => {
              documents.push({
                url: this.value + item,
                title: item.split('/').pop().replace('.md', '').replace(/-/g, ' ')
              });
            });
          } else if (typeof doc === 'string' && doc.startsWith(contentType + '/')) {
            // If it's a string path starting with the content type
            documents.push({
              url: this.value + doc.substring(contentType.length + 1),
              title: doc.split('/').pop().replace('.md', '').replace(/-/g, ' ')
            });
          }
        });
        
        if (documents.length > 0) {
          documents.forEach(doc => {
            const option = document.createElement('option');
            option.value = doc.url;
            // Capitalize first letter of each word
            option.textContent = doc.title.replace(/\b\w/g, l => l.toUpperCase());
            itemSelect.appendChild(option);
          });
          documentSelectGroup.style.display = 'block';
        } else {
          goButton.disabled = false;
        }
      }
    } else {
      // Use original course data navigation
      const selectedUnit = courseData.units.find(unit => unit.url === unitSelect.value);
      if (selectedUnit && selectedUnit.files) {
        // Filter files by selected type and exclude assessments
        const files = selectedUnit.files.filter(f => f.type === contentSelect.value && !f.url.includes('/assessments/'));
        if (files.length > 0) {
          files.forEach(file => {
            const option = document.createElement('option');
            option.value = file.url;
            option.textContent = file.title || file.url.split('/').pop();
            itemSelect.appendChild(option);
          });
          documentSelectGroup.style.display = 'block';
          goButton.disabled = true;
        } else {
          goButton.disabled = !contentSelect.value;
        }
      } else {
        goButton.disabled = !contentSelect.value;
      }
    }
  });

  // Enable Go button when a document is selected
  itemSelect.addEventListener('change', function() {
    goButton.disabled = !this.value;
  });

  // Navigate to the selected page when the go button is clicked
  goButton.addEventListener('click', function() {
    let url = itemSelect.value || contentSelect.value || unitSelect.value;
    if (url) {
      window.location.href = url;
    }
  });
})();
</script>
