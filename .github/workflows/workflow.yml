name: Cosmos in the Classroom - CI/CD

on:
  push:
    branches: [ main, 'feature/**', 'hotfix/**' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily cleanup and validation at 6 AM UTC (classroom-friendly timing)
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '18'
  RUBY_VERSION: '3.1'

jobs:
  # Content Validation - Educational Quality Assurance
  content-validation:
    name: 'Content Quality & Structure Validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate physics content structure
        run: |
          echo "Validating physics directory structure..."
          # Check for required directories
          test -d "physics/honors/units" || echo "Missing: physics/honors/units"
          test -d "physics/standard/units" || echo "Missing: physics/standard/units"
          test -d "physics/shared/themes" || echo "Missing: physics/shared/themes"
          
          # Validate unit naming conventions (##_descriptive-name)
          find physics/honors/units -maxdepth 1 -type d -name "[0-9][0-9]_*" | wc -l
          find physics/standard/units -maxdepth 1 -type d -name "[0-9][0-9]_*" | wc -l
          
      - name: Check for broken links in physics content
        run: |
          echo "Scanning for broken internal links..."
          # Check markdown files for broken relative links
          find physics -name "*.md" -exec grep -l "\.\./" {} \; | head -10
          
      - name: Validate configuration files
        run: |
          echo "Validating JSON configuration files..."
          # Validate JSON syntax
          node -e "JSON.parse(require('fs').readFileSync('cosmos.config.json', 'utf8'))" || exit 1
          if [ -f "build.config.js" ]; then
            node -c build.config.js || exit 1
          fi
          
      - name: Check file organization compliance
        run: |
          echo "Checking for root directory cleanliness..."
          # Alert if too many loose files in root (should be organized per README)
          loose_files=$(find . -maxdepth 1 -type f -name "*.html" -o -name "*.json" | grep -v -E "(index\.html|package\.json|cosmos\.config\.json)" | wc -l)
          if [ "$loose_files" -gt 5 ]; then
            echo "Warning: $loose_files loose files in root directory. Consider running build-restructure.bat"
          fi

  # Jekyll Build & GitHub Pages
  jekyll-build:
    name: 'Jekyll Build & Deploy'
    runs-on: ubuntu-latest
    needs: content-validation
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: Build Jekyll site
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # CSS & Asset Optimization
  frontend-optimization:
    name: 'CSS & Frontend Asset Optimization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check CSS dependency resolution
        run: |
          echo "Analyzing CSS dependencies..."
          # Check for CSS path issues mentioned in MINUTES.md
          if [ -f "index.html" ]; then
            grep -n "\.css" index.html || echo "No CSS links found in index.html"
          fi
          
          # Validate TailwindCSS build if config exists
          if [ -f "tailwind.config.js" ]; then
            npx tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --dry-run
          fi
          
      - name: Optimize images for classroom bandwidth
        run: |
          echo "Checking for large images that might impact classroom loading..."
          find assets/images -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" | while read img; do
            size=$(stat -f%z "$img" 2>/dev/null || stat -c%s "$img" 2>/dev/null || echo "0")
            if [ "$size" -gt 500000 ]; then  # 500KB threshold for classroom bandwidth
              echo "Large image detected: $img ($size bytes)"
            fi
          done

  # Marp Slide Generation
  marp-slides:
    name: 'Generate Marp Presentations'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli
        
      - name: Generate HTML slides
        run: |
          echo "Building Marp presentations..."
          # Process slides in physics directories
          find physics -name "*.md" -path "*/slides/*" | while read slide; do
            echo "Processing: $slide"
            marp "$slide" --html --output "${slide%.md}.html" || echo "Failed to process $slide"
          done
          
      - name: Upload slide artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marp-slides
          path: physics/**/slides/*.html
          retention-days: 30

  # System Integration Testing
  integration-tests:
    name: 'Portal, Chunker, Socrates Integration Tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Test Portal system integration
        run: |
          echo "Testing Portal system..."
          # Check for portal entry points and key files
          test -f "src/portal/index.html" || echo "Missing: Portal entry point"
          test -d "src/portal/scripts" || echo "Missing: Portal scripts directory"
          
      - name: Test Chunker system integration
        run: |
          echo "Testing Chunker system..."
          # Validate 144-chunk system mentioned in README
          if [ -d "src/Chunker" ]; then
            echo "Chunker system found"
            # Test chunker configuration if available
            if [ -f "src/Chunker/chunker-config.json" ]; then
              node -e "const c=require('./src/Chunker/chunker-config.json'); console.log('Chunks:', Object.keys(c).length)"
            fi
          fi
          
      - name: Test cross-system localStorage compatibility
        run: |
          echo "Testing localStorage key naming consistency..."
          # Check for consistent naming patterns mentioned in README
          grep -r "localStorage" src/ | grep -E "(cosmos-|user)" | head -5
          
      - name: Validate universal header system
        run: |
          echo "Testing universal header implementation..."
          test -f "src/shared/components/header.html" -o -f "_includes/header.html" || echo "Missing: Universal header component"

  # Educational Content Analysis
  educational-quality:
    name: 'Educational Content Quality Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check learning objectives format
        run: |
          echo "Analyzing learning objectives in physics content..."
          # Look for learning objectives in physics content
          find physics -name "*.md" -exec grep -l "objectives\|Learning Objectives" {} \; | wc -l
          
      - name: Validate physics unit progression
        run: |
          echo "Checking physics unit sequence..."
          # Ensure units are properly numbered 01-10 as mentioned in README
          ls -la physics/honors/units/ | grep "^d" | grep -E "[0-9][0-9]_" | wc -l
          
      - name: Check for prerequisite documentation
        run: |
          echo "Scanning for prerequisite documentation..."
          find physics -name "*.md" -exec grep -l "prerequisite\|Prerequisites" {} \; | head -5
          
      - name: Validate problem set structure
        run: |
          echo "Checking problem set naming conventions..."
          find physics -name "ps*.md" | head -5

  # Security & Dependency Updates
  security-scan:
    name: 'Security & Dependency Scanning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run npm audit
        run: |
          if [ -f "package.json" ]; then
            npm audit --audit-level=moderate || echo "npm audit found issues"
          fi
          
      - name: Check for sensitive data exposure
        run: |
          echo "Scanning for potential sensitive data..."
          # Check for accidentally committed credentials or keys
          grep -r -i "password\|secret\|key" . --include="*.json" --include="*.js" --exclude-dir=node_modules | head -5 || echo "No sensitive patterns found"
          
      - name: Validate HTTPS links
        run: |
          echo "Checking for HTTP links that should be HTTPS..."
          find . -name "*.md" -o -name "*.html" | xargs grep -l "http://" | head -5 || echo "No HTTP links found"

  # Performance & Accessibility
  performance-audit:
    name: 'Performance & Accessibility Audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
        
      - name: Check HTML accessibility basics
        run: |
          echo "Basic accessibility validation..."
          # Check for alt attributes and semantic HTML
          find . -name "*.html" -exec grep -L "alt=" {} \; | head -5 || echo "All HTML files have alt attributes"
          
      - name: Validate mobile responsiveness indicators
        run: |
          echo "Checking for mobile responsiveness..."
          # Look for viewport meta tags and responsive CSS
          find . -name "*.html" -exec grep -l "viewport" {} \; | wc -l
          grep -r "mobile\|responsive\|@media" assets/css/ | wc -l || echo "0"

  # Cleanup & Organization (Daily)
  daily-cleanup:
    name: 'Daily Cleanup & Organization Check'
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate cleanup report
        run: |
          echo "=== Daily Cleanup Report ===" > cleanup-report.txt
          echo "Date: $(date)" >> cleanup-report.txt
          echo "" >> cleanup-report.txt
          
          echo "Root directory file count:" >> cleanup-report.txt
          ls -la | wc -l >> cleanup-report.txt
          
          echo "" >> cleanup-report.txt
          echo "Potential files for relocation:" >> cleanup-report.txt
          find . -maxdepth 1 -name "*.html" -o -name "*.json" | grep -v -E "(index\.html|package\.json|cosmos\.config\.json)" >> cleanup-report.txt
          
          echo "" >> cleanup-report.txt
          echo "Large files (>1MB):" >> cleanup-report.txt
          find . -size +1M -type f | head -10 >> cleanup-report.txt
          
      - name: Upload cleanup report
        uses: actions/upload-artifact@v4
        with:
          name: daily-cleanup-report
          path: cleanup-report.txt
          retention-days: 7

# Deploy to GitHub Pages
deploy-pages:
  name: 'Deploy to GitHub Pages'
  runs-on: ubuntu-latest
  needs: jekyll-build
  if: github.ref == 'refs/heads/main'
  permissions:
    pages: write
    id-token: write
  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
  steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4