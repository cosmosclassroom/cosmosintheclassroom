<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Portal | Cosmos in the Classroom</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/cosmos-theme.css">
    <link rel="stylesheet" href="./styles.css">
    <script src="/src/shared/components/universal-header.js"></script>
  </head>
  <body>
    <!-- Universal Header Component -->
    <div id="universalHeader"></div>

    <!-- Main Content -->
    <main class="main-content">
      <section class="portal-hero">
        <h1 class="portal-title">The Portal</h1>
        
        <!-- Personalized Greeting -->
        <div class="greeting" id="greeting"></div>
        
        <!-- Name Input Section (shown for new users) -->
        <div class="name-input-section" id="nameInputSection">
            <h3>Welcome to The Portal</h3>
            <p>What should I call you?</p>
            <div class="name-form">
                <input type="text" id="nameInput" class="name-input" placeholder="Your name..." maxlength="30">
                <button onclick="saveName()" class="name-submit">Enter</button>
            </div>
            <div class="name-options">
                <small>Stored locally in your browser</small>
            </div>
        </div>
        
        <p class="portal-subtitle">Access your courses, track progress, and continue your physics journey</p>
      </section>

        <!-- Courses Section (for course cards) -->
        <section id="courses-section" class="course-section">
          <h2 class="section-title">Your Courses</h2>
          <div id="course-list" class="course-grid">
            <div class="loading">Loading courses...</div>
          </div>
        </section>

        <!-- Units Section (hidden by default, shown when a course is loaded) -->
        <section id="units-section" class="units-section" style="display:none;">
          <h2 id="course-title" class="section-title"></h2>
          <div id="units-list" class="units-grid"></div>
        </section>

      <!-- Course Section -->

      <!-- Quick Access Section -->
      <section class="quick-access">
        <h2 class="section-title">Quick Access</h2>
        <div id="quick-access" class="course-grid">
          <div class="loading">Loading quick access...</div>
        </div>
      </section>
    </main>

    <footer>
      &copy; 2024 Cosmos in the Classroom. All rights reserved.
    </footer>

    <!-- Universal Data Logger - Load before main script -->
    <script src="./scripts/universal-data-logger.js"></script>
    
    <!-- Main Portal Script -->
    <script>
      // Course data and navigation management
      let courseData = null;
      let currentCourse = null;

      document.addEventListener('DOMContentLoaded', function() {
        // Wait a bit to ensure logger script is loaded
        setTimeout(() => {
          loadStudentName();
          loadCourses();
          setupNavigation();
          loadRecentActivity();
          loadQuickAccess();
        }, 100);
  loadPersonalization();
  loadCourses();
  setupNavigation();
  loadRecentActivity();
  loadQuickAccess();
  setupEventListeners();

      document.addEventListener('DOMContentLoaded', function() {
        loadPersonalization();
        loadCourses();
        setupNavigation();
        loadRecentActivity();
        loadQuickAccess();
        setupEventListeners();
      });

      // Personalization functions (matching homepage)
      function loadPersonalization() {
        const userName = localStorage.getItem('cosmos-userName');
        if (userName) {
          document.getElementById('nameInput').value = userName;
          updateGreeting(userName);
          document.getElementById('nameInputSection').style.display = 'none';
          document.getElementById('greeting').style.display = 'block';
        }
      }

      function saveName() {
        const nameInput = document.getElementById('nameInput');
        const name = nameInput.value.trim();
        
        if (name) {
          localStorage.setItem('cosmos-userName', name);
          localStorage.setItem('userId', name); // For logging
          updateGreeting(name);
          document.getElementById('nameInputSection').style.display = 'none';
          document.getElementById('greeting').style.display = 'block';
        }
      }

      function updateGreeting(name) {
        const hour = new Date().getHours();
        let timeGreeting;
        
        if (hour < 12) timeGreeting = 'Good morning';
        else if (hour < 17) timeGreeting = 'Good afternoon';
        else timeGreeting = 'Good evening';
        
        document.getElementById('greeting').textContent = `${timeGreeting}, ${name}!`;
      }

      function changeName() {
        document.getElementById('nameInputSection').style.display = 'block';
        document.getElementById('greeting').style.display = 'none';
        document.getElementById('nameInput').focus();
      }

      function setupEventListeners() {
        // Name input enter key
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            saveName();
          }
        });
      }

      // Quick Access function for coming soon features
      function showComingSoon() {
        alert('🚧 Coming Soon!\n\nThis feature is currently under development. Check back soon for updates!');
      }

      // Navigation dropdown toggle function
      function toggleNavDropdown() {
        const navMenu = document.getElementById('navMenu');
        const isVisible = navMenu.classList.contains('show');
        
        if (isVisible) {
          navMenu.classList.remove('show');
        } else {
          navMenu.classList.add('show');
        }
      }

      // Close navigation when clicking outside
      document.addEventListener('click', function(e) {
        const navDropdown = e.target.closest('.nav-dropdown');
        if (!navDropdown) {
          const navMenu = document.getElementById('navMenu');
          navMenu.classList.remove('show');
        }
      });

      function closePopup() {
        if (window.currentPopup) {
          document.body.removeChild(window.currentPopup);
          document.body.removeChild(window.currentOverlay);
          window.currentPopup = null;
          window.currentOverlay = null;
        }
      }

      // Safe logging function that checks if logEvent exists
      function safeLogEvent(eventType, data = {}) {
        if (typeof logEvent === 'function') {
          logEvent(eventType, data);
        } else {
          console.log('Logger not available, would log:', eventType, data);
        }
      }

      // Course loading and display functions
      // Course loading and management
      async function loadCourses() {
        try {
          const container = document.getElementById('course-list');
          
          // Use the dynamic course loading from portal-manager.js
          if (window.PortalManager && window.PortalManager.loadAllCourses) {
            await window.PortalManager.loadAllCourses(container);
          } else {
            // Fallback to direct function call if PortalManager isn't available
            await loadAllCourses(container);
          }
        } catch (error) {
          console.error('Error loading courses:', error);
          document.getElementById('course-list').innerHTML = '<div class="loading">Error loading courses</div>';
        }
      }

      function displayCourses(courses) {
        const container = document.getElementById('course-list');
        container.innerHTML = '';

        courses.forEach(course => {
          const progress = getProgress(course.id);
          const card = document.createElement('div');
          card.className = `course-card ${course.theme}`;
          
          // Add theme-specific styling
          const themeClass = course.theme === 'honors' ? 'honors-theme' : 'standard-theme';
          
          card.innerHTML = '<div class="course-title ' + themeClass + '">' + course.title + '</div>' +
            '<div class="course-desc">' + course.desc + '</div>' +
            '<div class="course-progress">' +
              '<div class="progress-bar">' +
                '<div class="progress-fill" style="width: ' + progress + '%"></div>' +
              </div>' +
              '<div class="progress-text">' + progress + '% Complete (' + getCompletedUnits(course.id) + ' of ' + getTotalUnits(course.id) + ' units)</div>' +
            '</div>' +
            '<div class="course-actions">' +
              '<button class="btn btn-' + course.theme + '" onclick="loadCourse(\'' + course.id + '\', \'' + course.dataFile + '\')">Enter Course</button>' +
              '<a href="' + course.portalLink + '" class="btn secondary">Direct Portal</a>' +
              '<button class="btn secondary" onclick="viewCourseInfo(\'' + course.id + '\')">Overview</button>' +
            '</div>';
          container.appendChild(card);
        });
      }

      async function loadCourse(courseId, dataFile) {
        try {
          const studentName = localStorage.getItem('cosmos-userName') || 'Anonymous';
          
          // Show course started notification
          const courseNames = {
            'hphysics': 'The Story of Physics (Honors)',
            'sphysics': 'Science Physics Integrated Curriculum (Standard)',
            'natdis': 'Natural Disasters: Science, Engineering, and Policy'
          };
          
          // Log course access
          safeLogEvent("course_access", {
            courseId: courseId,
            dataFile: dataFile,
            studentName: studentName
          });

          const response = await fetch(dataFile);
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          
          courseData = await response.json();
          currentCourse = courseId;
          
          displayCourseUnits();
          updateBreadcrumb(['Home', 'Portal', courseData.curriculumTitle]);
          
          // Hide other sections
          document.querySelector('.quick-access').style.display = 'none';
        } catch (error) {
          console.error('Error loading course data:', error);
          alert(`Failed to load course: ${error.message}`);
        }
      }

      function displayCourseUnits() {
        const container = document.getElementById('units-list');
        const courseTitle = document.getElementById('course-title');
        
        courseTitle.textContent = courseData.curriculumTitle;
        document.getElementById('courses-section').style.display = 'none';
        document.getElementById('units-section').style.display = 'block';
        
        container.innerHTML = '';

        // Group units by parts
        courseData.parts.forEach(part => {
          // Add part header
          const partHeader = document.createElement('div');
          partHeader.className = 'course-card';
          partHeader.style.backgroundColor = 'var(--nav-bg)';
          partHeader.innerHTML = `
            <div class="course-title">Part ${part.partNumber}: ${part.partTitle}</div>
            <div class="course-desc">${part.partSubtitle}</div>
          `;
          container.appendChild(partHeader);

          // Add units for this part
          part.units.forEach(unit => {
            const isCompleted = isUnitCompleted(currentCourse, unit.unitNumber);
            const unitData = getUnitQuarterlyData(unit.unitNumber);
            const card = document.createElement('div');
            card.className = 'course-card';
            card.innerHTML = '<div class="course-title">' +
                'Unit ' + unit.unitNumber + ': ' + unit.title + (isCompleted ? ' ✅' : '') +
              '</div>' +
              '<div class="course-desc"><strong>Core Idea:</strong> ' + unit.coreIdea + '</div>' +
              '<div class="course-desc"><strong>Key Skills:</strong> ' + unit.keySkills.join(', ') + '</div>' +
              '<div class="course-desc"><strong>Phenomenon:</strong> ' + unit.anchoringPhenomenon + '</div>' +
              (unitData ? '<div class="course-desc"><strong>Duration:</strong> ' + unitData.days + ' days</div>' : '') +
              '<div class="course-actions">' +
                '<button class="btn" onclick="enterUnit(' + unit.unitNumber + ')">Start Unit</button>' +
                '<button class="btn secondary" onclick="viewUnitDetails(' + unit.unitNumber + ')">Details</button>' +
                (isCompleted ?
                  '<button class="btn secondary" onclick="markUnitIncomplete(\'' + currentCourse + '\', ' + unit.unitNumber + ')">Mark Incomplete</button>' :
                  '<button class="btn secondary" onclick="markUnitComplete(\'' + currentCourse + '\', ' + unit.unitNumber + ')">Mark Complete</button>'
                ) +
              '</div>';
            container.appendChild(card);
          });
        });

        // Add back button
        const backCard = document.createElement('div');
        backCard.className = 'course-card';
        backCard.style.borderStyle = 'dashed';
        backCard.innerHTML = '<div class="course-actions">' +
            '<button class="btn secondary" onclick="backToCourses()">← Back to Courses</button>' +
          '</div>';
        container.appendChild(backCard);
      }

      function getUnitQuarterlyData(unitNumber) {
        if (!courseData || !courseData.unit_pacing_by_days) return null;
        return courseData.unit_pacing_by_days.find(unit => 
          unit.unit_name.includes(`Chapter ${unitNumber}`)
        );
      }

      function enterUnit(unitNumber) {
        const unit = findUnit(unitNumber);
        const studentName = localStorage.getItem('cosmos-userName') || 'Anonymous';
        
        // Log the unit start event
        safeLogEvent("unit_start", {
          courseId: currentCourse,
          unitNumber: unitNumber,
          unitTitle: unit ? unit.title : `Unit ${unitNumber}`,
          coreIdea: unit ? unit.coreIdea : null,
          anchoringPhenomenon: unit ? unit.anchoringPhenomenon : null,
          studentName: studentName
        });

        // For now, just mark as visited and show details
        markUnitVisited(currentCourse, unitNumber);
        viewUnitDetails(unitNumber);
        
        // TODO: Navigate to actual unit page when created
        // window.location.href = `/src/courses/${currentCourse}/unit${unitNumber}/`;
      }

      function markUnitComplete(courseId, unitNumber) {
        const unit = findUnit(unitNumber);
        const studentName = localStorage.getItem('cosmos-userName') || 'Anonymous';
        // Show completion popup
        showPopup('success', 'Unit Completed!', `${studentName} completed Unit ${unitNumber}: ${unit ? unit.title : 'Unknown Unit'}`);
        // Log unit completion
        safeLogEvent("unit_complete", {
          courseId: courseId,
          unitNumber: unitNumber,
          unitTitle: unit ? unit.title : `Unit ${unitNumber}`,
          studentName: studentName
        });

        let progress = JSON.parse(localStorage.getItem(`progress_${courseId}`) || '{"units":{}}');
        progress.units[unitNumber] = true;
        localStorage.setItem(`progress_${courseId}`, JSON.stringify(progress));
        displayCourseUnits(); // Refresh display
      }

      function markUnitIncomplete(courseId, unitNumber) {
        const unit = findUnit(unitNumber);
        const studentName = localStorage.getItem('cosmos-userName') || 'Anonymous';
        
        // Log unit marked incomplete
        logEvent("unit_incomplete", {
          courseId: courseId,
          unitNumber: unitNumber,
          unitTitle: unit ? unit.title : `Unit ${unitNumber}`,
          studentName: studentName
        });

        let progress = JSON.parse(localStorage.getItem(`progress_${courseId}`) || '{"units":{}}');
        progress.units[unitNumber] = false;
        localStorage.setItem(`progress_${courseId}`, JSON.stringify(progress));
        displayCourseUnits(); // Refresh display
      }

      function backToCourses() {
        document.getElementById('courses-section').style.display = 'block';
        document.getElementById('units-section').style.display = 'none';
        document.querySelector('.quick-access').style.display = 'block';
        updateBreadcrumb(['Home', 'Portal']);
      }

      function getUnitQuarterlyData(unitNumber) {
        if (!courseData || !courseData.unit_pacing_by_days) return null;
        return courseData.unit_pacing_by_days.find(unit => 
          unit.unit_name.includes(`Chapter ${unitNumber}`)
        );
      }

      function findUnit(unitNumber) {
        for (const part of courseData.parts) {
          const unit = part.units.find(u => u.unitNumber === unitNumber);
          if (unit) return unit;
        }
        return null;
      }

      function viewUnitDetails(unitNumber) {
        // Log unit details view
        const unit = findUnit(unitNumber);
        logEvent("unit_details_view", {
          courseId: currentCourse,
          unitNumber: unitNumber,
          unitTitle: unit ? unit.title : `Unit ${unitNumber}`
        });

        const quarterlyData = getUnitQuarterlyData(unitNumber);
        
        if (unit) {
          let details = `Unit ${unit.unitNumber}: ${unit.title}\n\n`;
          details += `Core Idea: ${unit.coreIdea}\n\n`;
          details += `Key Skills: ${unit.keySkills.join(', ')}\n\n`;
          details += `Anchoring Phenomenon: ${unit.anchoringPhenomenon}\n\n`;
          details += `Cross-cutting Concepts: ${unit.crosscuttingLenses.join(', ')}\n`;
          
          if (quarterlyData) {
            details += `\n--- Curriculum Details ---\n`;
            details += `Key Equations: ${quarterlyData.key_equations ? quarterlyData.key_equations.join(', ') : 'None listed'}\n`;
            details += `Problem: ${quarterlyData.anchoring_phenomenon ? quarterlyData.anchoring_phenomenon.problem_description : 'No problem description'}\n`;
          }
          
          alert(details);
        }
      }

      function viewCourseInfo(courseId) {
        if (courseId === 'hphysics') {
          alert('The Story of Physics (Honors)\n\nA comprehensive honors physics course exploring:\n• Part I: The Rules of the Game\n• Part II: The Great Unification\n• Part III: The Unseen World\n\n180 instructional days, 10 core units across 4 quarters.');
        } else if (courseId === 'sphysics') {
          alert('Science Physics Integrated Curriculum (Standard)\n\nAn integrated physics curriculum exploring:\n• Part I: Energy and Earth Systems\n• Part II: Motion and Collisions\n• Part III: Waves and Electromagnetic Radiation\n\n181 instructional days, 5 core units on 8-drop-2 schedule.');
        } else if (courseId === 'natdis') {
          alert('Natural Disasters: Science, Engineering, and Policy\n\nAn elective course exploring natural hazards through multiple perspectives:\n• ND1: Earthquakes - Earth\'s Engine\n• ND2: Severe Weather - When the Sky Attacks\n• ND3: Fire and Water - Wildfires and Floods\n• ND4: Community Resilience - Building Back Better\n\nSemester course, 4 thematic units with Scientist-Engineer-Policymaker roles.');
        }
      }

      // Progress tracking functions
      function getProgress(courseId) {
        const saved = localStorage.getItem(`progress_${courseId}`);
        if (!saved) return 0;
        const progress = JSON.parse(saved);
        const totalUnits = getTotalUnits(courseId);
        const completedUnits = Object.keys(progress.units || {}).filter(unit => progress.units[unit]).length;
        return totalUnits > 0 ? Math.round((completedUnits / totalUnits) * 100) : 0;
      }

      function isUnitCompleted(courseId, unitNumber) {
        const saved = localStorage.getItem(`progress_${courseId}`);
        if (!saved) return false;
        const progress = JSON.parse(saved);
        return progress.units && progress.units[unitNumber];
      }

      function markUnitComplete(courseId, unitNumber) {
        const unit = findUnit(unitNumber);
        const studentName = localStorage.getItem('studentName') || 'Anonymous';
        
        // Show completion popup
        showPopup('success', 'Unit Completed!', `${studentName} completed Unit ${unitNumber}: ${unit ? unit.title : 'Unknown Unit'}`);
        
        // Log unit completion
        safeLogEvent("unit_complete", {
          courseId: courseId,
          unitNumber: unitNumber,
          unitTitle: unit ? unit.title : `Unit ${unitNumber}`,
          studentName: studentName
        });

        let progress = JSON.parse(localStorage.getItem(`progress_${courseId}`) || '{"units":{}}');
        progress.units[unitNumber] = true;
        localStorage.setItem(`progress_${courseId}`, JSON.stringify(progress));
        displayCourseUnits(); // Refresh display
      }

      function markUnitIncomplete(courseId, unitNumber) {
        const unit = findUnit(unitNumber);
        const studentName = localStorage.getItem('studentName') || 'Anonymous';
        
        // Show incomplete popup
        showPopup('warning', 'Unit Marked Incomplete', `${studentName} marked Unit ${unitNumber} as incomplete: ${unit ? unit.title : 'Unknown Unit'}`);
        
        // Log unit marked incomplete
        safeLogEvent("unit_incomplete", {
          courseId: courseId,
          unitNumber: unitNumber,
          unitTitle: unit ? unit.title : `Unit ${unitNumber}`,
          studentName: studentName
        });

        let progress = JSON.parse(localStorage.getItem(`progress_${courseId}`) || '{"units":{}}');
        progress.units[unitNumber] = false;
        localStorage.setItem(`progress_${courseId}`, JSON.stringify(progress));
        displayCourseUnits(); // Refresh display
      }

      function markUnitVisited(courseId, unitNumber) {
        let progress = JSON.parse(localStorage.getItem(`progress_${courseId}`) || '{"units":{},"visited":{}}');
        if (!progress.visited) progress.visited = {};
        progress.visited[unitNumber] = new Date().toISOString();
        localStorage.setItem(`progress_${courseId}`, JSON.stringify(progress));
      }

      function getCompletedUnits(courseId) {
        const saved = localStorage.getItem(`progress_${courseId}`);
        if (!saved) return 0;
        const progress = JSON.parse(saved);
        return Object.keys(progress.units || {}).filter(unit => progress.units[unit]).length;
      }

      function getTotalUnits(courseId) {
        if (courseId === 'hphysics') return 10;
        if (courseId === 'sphysics') return 5;
        if (courseId === 'natdis') return 4;
        return 0;
      }

      function loadRecentActivity() {
        // Placeholder for future implementation
      }

      function loadQuickAccess() {
        // Quick access grid is now in HTML, no dynamic loading needed
      }

      function updateBreadcrumb(items) {
        // Breadcrumb functionality for when we implement course navigation
        console.log('Breadcrumb:', items.join(' > '));
      }

      function setupNavigation() {
        // Handle browser back/forward for future course navigation
        window.addEventListener('popstate', function(event) {
          if (event.state && event.state.course) {
            loadCourse(event.state.course.id, event.state.course.dataFile);
          } else {
            backToCourses();
          }
        });
      }

      // Load universal header
      async function loadUniversalHeader() {
        try {
          const response = await fetch('/src/shared/components/universal-header.html');
          if (response.ok) {
            const headerHtml = await response.text();
            document.getElementById('universalHeader').innerHTML = headerHtml;
          }
        } catch (error) {
          console.error('Failed to load universal header:', error);
        }
      }

      // Initialize everything when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        loadUniversalHeader();
        loadCourses();
      });
    </script>
  </body>
</html>
