<!DOCTYPE html>
<html>
<head>
    <title>Hexagon Lab P1.1 - Blackout Data</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1, h2 { color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        .plot { margin-bottom: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hexagon Lab P1.1: Analyzing the Texas Blackout Data</h1>
        <p>Use the following charts and data table to investigate the causes of the February 2021 Texas power crisis. Your objective is to identify patterns and correlations to determine the potential causes of the large-scale power outage.</p>

        <div id="supplyDemandPlot" class="plot"></div>
        <div id="tempDemandPlot" class="plot"></div>

        <h2>Raw Data Table</h2>
        <div id="dataTable"></div>
    </div>

    <script>
        // Mock Dataset Generation
        const startDate = new Date('2021-02-13T00:00:00Z');
        const data = [];
        let temp = 35;
        let gasSupply = 45;
        let windSupply = 15;

        for (let i = 0; i < 168; i++) { // 7 days of hourly data
            const timestamp = new Date(startDate.getTime() + i * 60 * 60 * 1000);
            
            // Simulate temperature drop
            if (i > 24 && i < 120) temp -= 0.3 + Math.random() * 0.2;
            else if (i >= 120) temp += 0.4 + Math.random() * 0.1;
            
            // Simulate demand increase with cold
            const demand = 60 - (temp * 1.5) + Math.random() * 3;

            // Simulate supply drop due to cold
            if (i > 48 && i < 110) {
                gasSupply *= (0.98 - Math.random() * 0.02);
                windSupply *= (0.95 - Math.random() * 0.03); // Wind turbines freezing
            } else if (i >= 110) {
                 gasSupply *= (1.01 + Math.random() * 0.01);
                 windSupply *= (1.02 + Math.random() * 0.02);
            }
            gasSupply = Math.max(20, gasSupply);
            windSupply = Math.max(2, windSupply);

            const solarSupply = Math.max(0, Math.sin((i - 6) * Math.PI / 12) * 8); // Simple day/night cycle for solar

            data.push({
                Timestamp: timestamp.toISOString().slice(0, 16).replace('T', ' '),
                EnergyDemand_GW: parseFloat(demand.toFixed(2)),
                Supply_Gas_GW: parseFloat(gasSupply.toFixed(2)),
                Supply_Wind_GW: parseFloat(windSupply.toFixed(2)),
                Supply_Solar_GW: parseFloat(solarSupply.toFixed(2)),
                Temperature_F: parseFloat(temp.toFixed(2))
            });
        }

        // Plotly Chart 1: Supply vs Demand
        const timestamps = data.map(d => d.Timestamp);
        const demand = data.map(d => d.EnergyDemand_GW);
        const gas = data.map(d => d.Supply_Gas_GW);
        const wind = data.map(d => d.Supply_Wind_GW);
        const solar = data.map(d => d.Supply_Solar_GW);

        const traceDemand = { x: timestamps, y: demand, name: 'Total Demand', type: 'scatter', line: { color: 'red', width: 4 } };
        const traceGas = { x: timestamps, y: gas, name: 'Gas Supply', stackgroup: 'one', line: { color: '#4682B4' } };
        const traceWind = { x: timestamps, y: wind, name: 'Wind Supply', stackgroup: 'one', line: { color: '#6495ED' } };
        const traceSolar = { x: timestamps, y: solar, name: 'Solar Supply', stackgroup: 'one', line: { color: '#FFD700' } };

        const layout1 = {
            title: 'Energy Supply vs. Demand During the Crisis',
            xaxis: { title: 'Date and Time' },
            yaxis: { title: 'Power (GW)' },
            legend: { x: 1, xanchor: 'right', y: 1 }
        };
        Plotly.newPlot('supplyDemandPlot', [traceDemand, traceGas, traceWind, traceSolar], layout1);

        // Plotly Chart 2: Temperature vs Demand
        const temps = data.map(d => d.Temperature_F);
        const traceTemp = { x: timestamps, y: temps, name: 'Temperature', type: 'scatter', line: { color: 'blue' }, yaxis: 'y2' };
        
        const layout2 = {
            title: 'Temperature and Energy Demand Correlation',
            xaxis: { title: 'Date and Time' },
            yaxis: { title: 'Energy Demand (GW)', titlefont: { color: 'red' }, tickfont: { color: 'red' } },
            yaxis2: { title: 'Temperature (°F)', titlefont: { color: 'blue' }, tickfont: { color: 'blue' }, overlaying: 'y', side: 'right' },
            legend: { x: 1, xanchor: 'right', y: 1.15 }
        };
        Plotly.newPlot('tempDemandPlot', [{ x: timestamps, y: demand, name: 'Demand', type: 'scatter', line: { color: 'red' } }, traceTemp], layout2);

        // Data Table
        let tableHTML = '<table><tr><th>Timestamp</th><th>Demand (GW)</th><th>Gas (GW)</th><th>Wind (GW)</th><th>Solar (GW)</th><th>Temp (°F)</th></tr>';
        data.forEach(row => {
            tableHTML += `<tr><td>${row.Timestamp}</td><td>${row.EnergyDemand_GW}</td><td>${row.Supply_Gas_GW}</td><td>${row.Supply_Wind_GW}</td><td>${row.Supply_Solar_GW}</td><td>${row.Temperature_F}</td></tr>`;
        });
        tableHTML += '</table>';
        document.getElementById('dataTable').innerHTML = tableHTML;
    </script>
</body>
</html>
