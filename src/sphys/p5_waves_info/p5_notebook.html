<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Waves Notebook</title>
    <!-- Corrected CSS Imports -->
    <link rel="stylesheet" href="../../assets/css/notebook.css" onerror="handleMissingCSS('notebook.css')" />
    <link rel="stylesheet" href="../../assets/css/style.css" onerror="handleMissingCSS('style.css')" />
    <!-- KaTeX Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="text/javascript" async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    <!-- Include Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Handle missing CSS files
        function handleMissingCSS(fileName) {
            console.warn(`Failed to load CSS file: ${fileName}`);
        }

        // Initialize the markdown files to be loaded by the JavaScript
        const markdownFiles = [
            'p5l4_wave_variables.md',
            'p5l7_1_sim_EM_polarity.md',
            'p5l7_2_consensus_model_polarity.md',
            'p5l7_3_metal_oven_reading.md',
            'p5l10.md',
            'p5l10_data-amplitude-frequency-duality.md',
            'p5l10_model-particle-reading.md',
            'p5l10_model-wave-reading.md',
            'p5l10_reading-amplitude-frequency-evidence.md',
            'p5l10_wave-particle-duality.md'
        ];

        // Function to strip YAML front matter
        function stripYAMLFrontMatter(markdownText) {
            // Match YAML front matter enclosed by "---" at the start of the file
            return markdownText.replace(/^(---\s*[\s\S]*?\s*---\s*)/, '');
        }

        // Function to load and render a markdown file
        function loadMarkdownFile(index) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<p>Loading...</p>';

            // Update navigation UI
            document.getElementById('currentIndex').textContent = index + 1;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === markdownFiles.length - 1;

            // Fetch the markdown file
            fetch(markdownFiles[index])
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load file: ${markdownFiles[index]}`);
                    }
                    return response.text();
                })
                .then(markdownText => {
                    // Strip YAML front matter
                    const cleanedMarkdown = stripYAMLFrontMatter(markdownText);

                    // Parse and render markdown
                    contentDiv.innerHTML = marked.parse(cleanedMarkdown);

                    // Render LaTeX after Markdown is parsed
                    renderMathInElement(contentDiv, {
                        delimiters: [
                            { left: "$$", right: "$$", display: true },
                            { left: "$", right: "$", display: false }
                        ]
                    });
                })
                .catch(error => {
                    contentDiv.innerHTML = `
                        <div class="load-error">
                            ${error.message}<br>
                            Make sure the file exists in the correct location.
                        </div>
                    `;
                    console.error(error);
                });
        }

        // Initialize the current file index
        let currentFileIndex = 0;

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('totalFiles').textContent = markdownFiles.length;
            loadMarkdownFile(currentFileIndex);

            // Set up event listeners for navigation buttons
            document.getElementById('prevBtn').addEventListener('click', navigatePrevious);
            document.getElementById('nextBtn').addEventListener('click', navigateNext);
        });

        // Navigation functions
        function navigatePrevious() {
            if (currentFileIndex > 0) {
                currentFileIndex--;
                loadMarkdownFile(currentFileIndex);
            }
        }

        function navigateNext() {
            if (currentFileIndex < markdownFiles.length - 1) {
                currentFileIndex++;
                loadMarkdownFile(currentFileIndex);
            }
        }
    </script>
</head>
<!-- BEGIN BODY CONTENT -->
<body>
    <h1>Student Science Notebook</h1>
    <h2>P5 Waves and Information</h2>
    <div class="nav" style="border: 1px solid #1f0d0d; padding: 10px; margin-bottom: 20px;
        background-color: #f9f9f9; border-radius: 5px;"
        display: flex; flex-direction: column; align-items: center;
        justify-content: center;>
        <div class='dropdown'>

        </div>
        </menu>
        <h3>Navigation</h3>
            <div class="nav-buttons"
            style="display: flex; justify-content: space-between; width: 100%; max-width: 80%">
        <button id="prevBtn" disabled>Previous</button>
        <div class="file-info">
            File <span id="currentIndex">1</span> of <span id="totalFiles">?</span>
        </div>
        <button id="nextBtn">Next</button>
    </div>
    </div>
    
    <div id="content">
        <p>Loading...</p>
    </div>
    
    <script>
        // apply CSS stylesheet /assets/css/style.css to the content div
        const styleSheet = document.createElement('link');
        styleSheet.rel = 'stylesheet';
        styleSheet.type = 'text/css';
        styleSheet.href = '../../assets/css/style.css';
        document.getElementById('content').appendChild(styleSheet); // Append the stylesheet to the content div
    </script>
    <script src="script.js"></script>
</body>
</html>
