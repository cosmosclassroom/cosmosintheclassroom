<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Waves Notebook</title>
    <!-- Corrected CSS Imports -->
    <link rel="stylesheet" href="/cosmosintheclassroom/src/assets/css/notebook.css" />
    <link rel="stylesheet" href="/cosmosintheclassroom/src/assets/css/style.css" />
    <!-- KaTeX Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <h1>Student Science Notebook</h1>
    <h2>P5 Waves and Information</h2>
    <div class="nav">
        <button id="prevBtn" disabled>Previous</button>
        <div class="file-info">
            File <span id="currentIndex">1</span> of <span id="totalFiles">?</span>
        </div>
        <button id="nextBtn">Next</button>
    </div>
    <div id="content">
        <p>Loading...</p>
    </div>
    <script>
        let htmlFiles = [];
        let currentFileIndex = 0;

        document.addEventListener('DOMContentLoaded', function() {
            fetch('p5_notebook.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load p5_notebook.json');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.htmlFiles && Array.isArray(data.htmlFiles)) {
                        htmlFiles = data.htmlFiles;
                        document.getElementById('totalFiles').textContent = htmlFiles.length;
                        loadHtmlFile(currentFileIndex);
                    } else {
                        throw new Error('Invalid or missing "htmlFiles" property in p5_notebook.json');
                    }
                })
                .catch(error => {
                    console.error('Error loading p5_notebook.json:', error);
                    document.getElementById('content').innerHTML = `<div class="load-error">${error.message}</div>`;
                });

            document.getElementById('prevBtn').addEventListener('click', navigatePrevious);
            document.getElementById('nextBtn').addEventListener('click', navigateNext);
        });

        function loadHtmlFile(index) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<p>Loading...</p>';

            if (htmlFiles[index]) {
                fetch(htmlFiles[index])
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to load file: ${htmlFiles[index]}`);
                        }
                        return response.text();
                    })
                    .then(htmlText => {
                        contentDiv.innerHTML = htmlText;
                    })
                    .catch(error => {
                        contentDiv.innerHTML = `<div class="load-error">${error.message}</div>`;
                        console.error(error);
                    });
            } else {
                contentDiv.innerHTML = `<div class="load-error">Invalid file index: ${index}</div>`;
            }
        }

        function navigatePrevious() {
            if (currentFileIndex > 0) {
                currentFileIndex--;
                loadHtmlFile(currentFileIndex);
            }
        }

        function navigateNext() {
            if (currentFileIndex < htmlFiles.length - 1) {
                currentFileIndex++;
                loadHtmlFile(currentFileIndex);
            }
        }
    </script>
</body>
</html>
