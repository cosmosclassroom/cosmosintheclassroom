<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Background -->
  <rect width="1000" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="bold">Evolution of Automobile Safety and Fatality Rates (1900-2025)</text>
  
  <!-- X-axis (years) -->
  <line x1="100" y1="500" x2="900" y2="500" stroke="black" stroke-width="2"/>
  <text x="500" y="540" text-anchor="middle" font-family="Times New Roman" font-size="16">Year</text>
  
  <!-- X-axis labels -->
  <text x="100" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">1900</text>
  <text x="220" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">1920</text>
  <text x="340" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">1940</text>
  <text x="460" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">1960</text>
  <text x="580" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">1980</text>
  <text x="700" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">2000</text>
  <text x="820" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">2020</text>
  <text x="900" y="525" text-anchor="middle" font-family="Times New Roman" font-size="14">2025</text>
  
  <!-- Left Y-axis (fatality rate) -->
  <line x1="100" y1="100" x2="100" y2="500" stroke="black" stroke-width="2"/>
  <text x="50" y="300" text-anchor="middle" font-family="Times New Roman" font-size="16" transform="rotate(-90, 50, 300)">Fatalities per 100M Vehicle Miles</text>
  
  <!-- Left Y-axis labels -->
  <text x="90" y="100" text-anchor="end" font-family="Times New Roman" font-size="14">20</text>
  <text x="90" y="180" text-anchor="end" font-family="Times New Roman" font-size="14">15</text>
  <text x="90" y="260" text-anchor="end" font-family="Times New Roman" font-size="14">10</text>
  <text x="90" y="340" text-anchor="end" font-family="Times New Roman" font-size="14">5</text>
  <text x="90" y="420" text-anchor="end" font-family="Times New Roman" font-size="14">2.5</text>
  <text x="90" y="500" text-anchor="end" font-family="Times New Roman" font-size="14">0</text>
  
  <!-- Fatality rate curve -->
  <path d="M100,500 L160,160 L220,150 L280,220 L340,300 L400,340 L460,360 L520,380 L580,410 L640,430 L700,455 L760,470 L820,475 L900,472" 
        fill="none" stroke="black" stroke-width="3"/>
  
  <!-- Data points on the curve -->
  <circle cx="160" cy="160" r="5" fill="black"/>
  <circle cx="220" cy="150" r="5" fill="black"/>
  <circle cx="280" cy="220" r="5" fill="black"/>
  <circle cx="340" cy="300" r="5" fill="black"/>
  <circle cx="400" cy="340" r="5" fill="black"/>
  <circle cx="460" cy="360" r="5" fill="black"/>
  <circle cx="520" cy="380" r="5" fill="black"/>
  <circle cx="580" cy="410" r="5" fill="black"/>
  <circle cx="640" cy="430" r="5" fill="black"/>
  <circle cx="700" cy="455" r="5" fill="black"/>
  <circle cx="760" cy="470" r="5" fill="black"/>
  <circle cx="820" cy="475" r="5" fill="black"/>
  <circle cx="900" cy="472" r="5" fill="black"/>
  
  <!-- Key safety innovations timeline with staggered heights to prevent overlapping -->
  
  <!-- Row 1 (highest) -->
  <!-- Four-wheel hydraulic brakes (1922) -->
  <line x1="220" y1="500" x2="220" y2="120" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="220" cy="120" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="225" y="124" font-family="Times New Roman" font-size="11" fill="black">Four-wheel hydraulic brakes (1922)</text>
  
  <!-- Three-point seat belts (1959) -->
  <line x1="455" y1="500" x2="455" y2="120" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="455" cy="120" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="460" y="124" font-family="Times New Roman" font-size="11" fill="black">Three-point seat belts (1959)</text>
  
  <!-- Antilock braking systems (1978) -->
  <line x1="560" y1="500" x2="560" y2="120" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="560" cy="120" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="565" y="124" font-family="Times New Roman" font-size="11" fill="black">Antilock braking systems (1978)</text>
  
  <!-- Electronic stability control (2000s) -->
  <line x1="700" y1="500" x2="700" y2="120" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="700" cy="120" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="705" y="124" font-family="Times New Roman" font-size="11" fill="black">Electronic stability control (2000s)</text>
  
  <!-- Row 2 -->
  <!-- Laminated safety glass (1930s) -->
  <line x1="280" y1="500" x2="280" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="280" cy="150" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="285" y="154" font-family="Times New Roman" font-size="11" fill="black">Laminated safety glass (1930s)</text>
  
  <!-- Head restraints (1969) -->
  <line x1="520" y1="500" x2="520" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="520" cy="150" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="525" y="154" font-family="Times New Roman" font-size="11" fill="black">Head restraints (1969)</text>
  
  <!-- Passenger airbags (1990s) -->
  <line x1="640" y1="500" x2="640" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="640" cy="150" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="645" y="154" font-family="Times New Roman" font-size="11" fill="black">Passenger airbags (1990s)</text>
  
  <!-- Automatic emergency braking (2020s) -->
  <line x1="820" y1="500" x2="820" y2="150" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="820" cy="150" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="825" y="154" font-family="Times New Roman" font-size="11" fill="black">Automatic emergency braking (2020s)</text>
  
  <!-- Row 3 -->
  <!-- Padded dashboards (1947) -->
  <line x1="340" y1="500" x2="340" y2="180" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="340" cy="180" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="345" y="184" font-family="Times New Roman" font-size="11" fill="black">Padded dashboards (1947)</text>
  
  <!-- Crumple zones (1962) -->
  <line x1="480" y1="500" x2="480" y2="180" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="480" cy="180" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="485" y="184" font-family="Times New Roman" font-size="11" fill="black">Crumple zones (1962)</text>
  
  <!-- Driver airbags (1984) -->
  <line x1="600" y1="500" x2="600" y2="180" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="600" cy="180" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="605" y="184" font-family="Times New Roman" font-size="11" fill="black">Driver airbags (1984)</text>
  
  <!-- Blind spot detection (2010s) -->
  <line x1="760" y1="500" x2="760" y2="180" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="760" cy="180" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="765" y="184" font-family="Times New Roman" font-size="11" fill="black">Blind spot detection (2010s)</text>
  
  <!-- Row 4 -->
  <!-- Disc brakes standard (1965) -->
  <line x1="500" y1="500" x2="500" y2="210" stroke="black" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="500" cy="210" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="505" y="214" font-family="Times New Roman" font-size="11" fill="black">Disc brakes standard (1965)</text>
  
  <!-- Legend -->
  <rect x="730" y="60" width="150" height="50" fill="white" stroke="black" stroke-width="1"/>
  <line x1="750" y1="75" x2="780" y2="75" stroke="black" stroke-width="2"/>
  <text x="785" y="80" font-family="Times New Roman" font-size="14">Fatality Rate</text>
  <circle cx="765" cy="95" r="4" fill="white" stroke="black" stroke-width="1"/>
  <text x="785" y="100" font-family="Times New Roman" font-size="14">Safety Innovation</text>
</svg>
