<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #content {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            min-height: 300px;
        }
        .nav-buttons {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #45a049;
        }
        .file-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .load-error {
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Markdown Viewer</h1>
    
    <div class="nav-buttons">
        <button id="prevBtn" disabled>Previous</button>
        <div class="file-info">
            File <span id="currentIndex">1</span> of <span id="totalFiles">?</span>
        </div>
        <button id="nextBtn">Next</button>
    </div>
    
    <div id="content">
        <p>Loading...</p>
    </div>
    
    <script>
        // Base URL for markdown files - relative to current HTML file
        const baseUrl = '../src/sphys/p5_waves_info/';  // Go up one level from 'src', then into sphys
        
        // Configuration: List your markdown files here with proper paths
        const markdownFiles = [
            'p5l4_wave_variables/index.html',
            'p5l6_1_sim_EM_polarity/index.html',
            'p5l7_2_consensus_model_polarity/index.html'
        ];

        // Helper function to construct proper URL for local file access
        function getFileUrl(filename) {
            // For local development, use relative paths
            const path = baseUrl + filename;
            console.log('Resolving path:', {
                current: window.location.pathname,
                relative: path,
                absolute: new URL(path, window.location.href).href
            });
            return path;
        }

        let currentFileIndex = 0;
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('totalFiles').textContent = markdownFiles.length;
            loadMarkdownFile(currentFileIndex);
            
            // Set up event listeners for navigation buttons
            document.getElementById('prevBtn').addEventListener('click', navigatePrevious);
            document.getElementById('nextBtn').addEventListener('click', navigateNext);
        });

        // Add keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') navigatePrevious();
            if (event.key === 'ArrowRight') navigateNext();
        });

        // Function to load and render a markdown file
        function loadMarkdownFile(index) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<p>Loading...</p>';
            
            // Update navigation UI
            document.getElementById('currentIndex').textContent = index + 1;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === markdownFiles.length - 1;
            
            const fileUrl = getFileUrl(markdownFiles[index]);
            console.log('Attempting to load:', fileUrl); // Debug info
            
            fetch(fileUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.text();
                })
                .then(markdownText => {
                    contentDiv.innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    contentDiv.innerHTML = `
                        <div class="load-error">
                            Error loading file: ${error.message}<br>
                            File: ${markdownFiles[index]}<br>
                            Full URL attempted: ${fileUrl}<br>
                            Base URL: ${baseUrl}<br>
                            <br>
                            Check that:<br>
                            1. File exists at: ${baseUrl}${markdownFiles[index]}<br>
                            2. Server is running and configured correctly<br>
                            3. File permissions allow access
                        </div>
                    `;
                    console.error('File loading error:', {
                        error,
                        fileUrl,
                        baseUrl,
                        filename: markdownFiles[index]
                    });
                });
        }

        // Navigation functions
        function navigatePrevious() {
            if (currentFileIndex > 0) {
                currentFileIndex--;
                loadMarkdownFile(currentFileIndex);
            }
        }
        
        function navigateNext() {
            if (currentFileIndex < markdownFiles.length - 1) {
                currentFileIndex++;
                loadMarkdownFile(currentFileIndex);
            }
        }
    </script>
</body>
</html>
