<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Disasters Weekly Schedule</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --text-color: #2c3e50;
            --background-light: #ecf0f1;
            --scientist-color: #2ecc71;
            --engineer-color: #e74c3c;
            --policy-color: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .week-container {
            display: grid;
            gap: 1rem;
            padding: 2rem;
        }

        .week-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .week-header {
            background-color: var(--secondary-color);
            color: white;
            padding: 1rem;
        }

        .activity {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            border-radius: 4px;
            border-left: 4px solid;
        }

        .scientist {
            background-color: rgba(46, 204, 113, 0.1);
            border-left-color: var(--scientist-color);
        }

        .engineer {
            background-color: rgba(231, 76, 60, 0.1);
            border-left-color: var(--engineer-color);
        }

        .policy {
            background-color: rgba(243, 156, 18, 0.1);
            border-left-color: var(--policy-color);
        }

        .unit-indicator {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background-color: var(--accent-color);
            color: white;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }

        .navigation {
            padding: 1rem;
            background-color: var(--background-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-button {
            padding: 0.5rem 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .nav-button:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Natural Disasters Weekly Schedule</h1>
        <div class="navigation">
            <button class="nav-button" onclick="window.location.href='index.html'">Back to Course Overview</button>
            <span>School Year 2025-2026</span>
        </div>
    </div>

    <div class="week-container" id="weeks">
        <!-- Weeks will be dynamically populated here -->
    </div>

    <script>
        async function loadWeeklySchedule() {
            try {
                const response = await fetch('_data/agenda.json');
                const data = await response.json();
                const weeksContainer = document.getElementById('weeks');
                
                // Calculate total chunks and weeks
                const totalChunks = data.units.reduce((sum, unit) => sum + unit.totalChunks, 0);
                const chunksPerWeek = 12; // Assuming 12 chunks per week
                const totalWeeks = Math.ceil(totalChunks / chunksPerWeek);

                let currentChunk = 0;
                let currentUnit = 0;
                let currentPhase = 'scientist';

                for (let week = 1; week <= totalWeeks; week++) {
                    const weekCard = document.createElement('div');
                    weekCard.className = 'week-card';

                    const activities = [];
                    const unit = data.units[currentUnit];
                    
                    if (unit) {
                        const sequence = unit.instructionalSequence[currentPhase];
                        if (sequence) {
                            sequence.forEach(activity => {
                                if (currentChunk < totalChunks) {
                                    activities.push({
                                        type: currentPhase,
                                        name: activity,
                                        unit: `Unit ${unit.unitNumber}`
                                    });
                                    currentChunk++;
                                }
                            });
                        }

                        // Move to next phase or unit if current phase is complete
                        if (currentChunk % (unit.totalChunks / 3) === 0) {
                            if (currentPhase === 'scientist') currentPhase = 'engineer';
                            else if (currentPhase === 'engineer') currentPhase = 'policymaker';
                            else {
                                currentPhase = 'scientist';
                                currentUnit++;
                            }
                        }
                    }

                    weekCard.innerHTML = `
                        <div class="week-header">
                            <h2>Week ${week}</h2>
                        </div>
                        ${activities.map(activity => `
                            <div class="activity ${activity.type}">
                                <span class="unit-indicator">${activity.unit}</span>
                                ${activity.name}
                            </div>
                        `).join('')}
                    `;

                    weeksContainer.appendChild(weekCard);
                }

            } catch (error) {
                console.error('Error loading weekly schedule:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadWeeklySchedule);
    </script>
</body>
</html>
