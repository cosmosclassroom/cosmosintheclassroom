<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        header { background: #2d3e50; color: #fff; padding: 1rem; text-align: center; }
        .container { max-width: 1200px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { margin-top: 2rem; }
        .summary { display: flex; gap: 2rem; margin-bottom: 2rem; }
        .card { background: #e9ecef; padding: 1rem 2rem; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f7fafc; }
        .section { margin-bottom: 2rem; }
        .accom-class { margin-bottom: 1.5rem; }
        .accom-class h3 { margin: 0 0 .25rem; }
        .student-block { margin: .75rem 0 .75rem 1rem; }
        .student-block h4 { margin: 0 0 .25rem; font-size: 1rem; }
        .tag { display:inline-block; background:#eef2f7; padding:2px 6px; margin:0 4px 4px 0; border-radius:4px; font-size:.7rem; letter-spacing:.5px; text-transform:uppercase; }
        details { background:#fafbfc; border:1px solid #e2e6ea; border-radius:6px; padding:.5rem .75rem; margin:.5rem 0; }
        details summary { cursor:pointer; font-weight:600; }
        ul.accom, ul.mods { margin:.25rem 0 .5rem 1.25rem; padding:0; }
        ul.accom li, ul.mods li { margin:.15rem 0; }
        .split-accom { display:flex; flex-direction:column; gap:2rem; }
        @media (min-width: 1100px) {
            .split-accom { flex-direction:row; align-items:flex-start; }
            .split-accom > div { flex:1; }
        }
        .subsection-title { margin-top:0; }
    </style>
</head>
<body>
    <header>
        <h1>Teacher Dashboard</h1>
    </header>
    <div class="container">
        <div class="summary" id="summaryCards">
            <!-- Summary cards will be injected here -->
        </div>
        <div class="section" id="rostersSection">
            <h2>Rosters</h2>
            <div id="rostersTables">
                <!-- Rosters tables will be injected here -->
            </div>
        </div>
        <div class="section" id="spedSection">
            <h2>SPED Accommodations</h2>
            <div class="split-accom">
                <div>
                    <h3 class="subsection-title">By Class</h3>
                    <div id="accommodationsByClass"><!-- injected --></div>
                </div>
                <div>
                    <h3 class="subsection-title">By Student (A–Z)</h3>
                    <div id="accommodationsByStudent"><!-- injected --></div>
                </div>
            </div>
        </div>
    </div>
    <script>
    // Helper to fetch JSON files
    async function fetchJSON(path) {
        try {
            const response = await fetch(path);
            if (!response.ok) throw new Error('HTTP ' + response.status + ' for ' + path);
            return await response.json();
        } catch (e) {
            console.warn('fetchJSON error:', e.message);
            return null;
        }
    }

    // Adjusted summary to treat summary.json as array
    async function loadSummary() {
        // Example: count students in all rosters
        const rosterFiles = [
            '../Rosters/25-26-1.json',
            '../Rosters/25-26-2.json'
        ];
        let totalStudents = 0;
        for (const file of rosterFiles) {
            const data = await fetchJSON(file);
            if (data && Array.isArray(data)) totalStudents += data.length;
        }
        const spedData = await fetchJSON('./summary.json');
        const spedCount = Array.isArray(spedData)
            ? spedData.length
            : (spedData && Array.isArray(spedData.students) ? spedData.students.length : 0);
        document.getElementById('summaryCards').innerHTML = `
            <div class="card"><strong>Total Students:</strong><br>${totalStudents}</div>
            <div class="card"><strong>SPED Students:</strong><br>${spedCount}</div>
        `;
    }

    // Load and display rosters
    async function loadRosters() {
        const rosterFiles = [
            '../Rosters/25-26-1.json',
            '../Rosters/25-26-2.json'
        ];
        let html = '';
        for (const file of rosterFiles) {
            const data = await fetchJSON(file);
            if (data && Array.isArray(data)) {
                html += `<h3>${file.split('/').pop()}</h3>`;
                html += '<table><tr>';
                // Table headers from first object keys
                const headers = Object.keys(data[0] || {});
                for (const h of headers) html += `<th>${h}</th>`;
                html += '</tr>';
                for (const row of data) {
                    html += '<tr>';
                    for (const h of headers) html += `<td>${row[h]}</td>`;
                    html += '</tr>';
                }
                html += '</table>';
            }
        }
        document.getElementById('rostersTables').innerHTML = html;
    }

    // New: load accommodations grouped by class and by student
    async function loadAccommodations() {
        const data = await fetchJSON('./summary.json');
        if (!Array.isArray(data) || !data.length) {
            const msg = data === null
                ? 'Failed to load summary.json (check relative path).'
                : 'No data.';
            document.getElementById('accommodationsByClass').innerHTML = `<p>${msg}</p>`;
            document.getElementById('accommodationsByStudent').innerHTML = `<p>${msg}</p>`;
            return;
        }

        // Helper to build a class key and label
        function classKey(s) {
            const cp = s.class_placement || {};
            if (cp.course_number && cp.period) return `${cp.course_number}|${cp.period}`;
            if (cp.course_number) return cp.course_number;
            if (cp.course && cp.period) return `${cp.course}|${cp.period}`;
            return 'UNPLACED';
        }
        function classLabel(s) {
            const cp = s.class_placement || {};
            if (cp.course_number || cp.course) {
                return `${cp.course || 'Unknown Course'} (${cp.course_number || '—'}) Period ${cp.period || '—'} Grade ${cp.grade || '—'}`;
            }
            return 'Unplaced / Not in Roster';
        }

        // Group by class
        const classes = {};
        for (const student of data) {
            const key = classKey(student);
            if (!classes[key]) classes[key] = { label: classLabel(student), students: [] };
            classes[key].students.push(student);
        }

        // Sort classes: unplaced last
        const classEntries = Object.entries(classes)
            .sort((a,b) => {
                if (a[0] === 'UNPLACED') return 1;
                if (b[0] === 'UNPLACED') return -1;
                return a[1].label.localeCompare(b[1].label, 'en', { numeric:true });
            });

        // Render by class
        let byClassHTML = '';
        for (const [, cls] of classEntries) {
            // Sort students within class
            cls.students.sort((a,b) => a.student_name.localeCompare(b.student_name));
            byClassHTML += `<div class="accom-class">
                <h3>${cls.label}</h3>
                ${cls.students.map(stu => renderStudentDetails(stu, true)).join('')}
            </div>`;
        }
        document.getElementById('accommodationsByClass').innerHTML = byClassHTML;

        // Render by student (alphabetical)
        const studentsSorted = [...data].sort((a,b) => a.student_name.localeCompare(b.student_name));
        document.getElementById('accommodationsByStudent').innerHTML =
            studentsSorted.map(stu => renderStudentDetails(stu, false)).join('');
    }

    // Escape basic HTML
    function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    // Render a student's accommodations (and modifications if present)
    function renderStudentDetails(stu, compact) {
        const cp = stu.class_placement || {};
        const placement = (cp.course || cp.course_number || cp.grade || cp.period)
            ? `<span class="tag">${esc(cp.course || '')}</span>
               ${cp.course_number ? `<span class="tag">${esc(cp.course_number)}</span>`:''}
               ${cp.period ? `<span class="tag">P${esc(cp.period)}</span>`:''}
               ${cp.grade ? `<span class="tag">Gr ${esc(cp.grade)}</span>`:''}`
            : `<span class="tag">Unplaced</span>`;
        const accom = Array.isArray(stu.accommodations) ? stu.accommodations.map(a => `<li>${esc(a)}</li>`).join('') : '';
        const mods = Array.isArray(stu.modifications) ? stu.modifications.map(m => `<li>${esc(m)}</li>`).join('') : '';
        const summaryLine = `${esc(stu.student_name)} ${compact ? '' : placement}`;
        return `<details class="student-block">
            <summary>${summaryLine}${compact ? ' ' + placement : ''}</summary>
            ${!compact ? `<div>${placement}</div>` : ''}
            ${accom ? `<strong>Accommodations:</strong><ul class="accom">${accom}</ul>` : '<em>No accommodations listed.</em>'}
            ${mods ? `<strong>Modifications:</strong><ul class="mods">${mods}</ul>` : ''}
        </details>`;
    }

    // Initialize dashboard (replace old loadSPED call)
    loadSummary();
    loadRosters();
    loadAccommodations();
    </script>
</body>
</html>
