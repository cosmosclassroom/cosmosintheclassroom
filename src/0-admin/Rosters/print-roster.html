<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Printable Rosters</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', Times, serif; margin: 20px; background: #f8f7f3; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5em; }
    h2 { margin-top: 40px; font-size: 1.1rem; color: #2F3E46; text-align: center; }
    table { border-collapse: collapse; margin-bottom: 30px; background: #fff; margin-left: auto; margin-right: auto; }
    th, td { border: 1px solid #333; padding: 7px 14px; text-align: left; font-size: 1rem; }
    th { background: #e9e7df; }
    .roster-page { page-break-after: always; max-width: 900px; margin: 0 auto 40px auto; box-shadow: 0 2px 8px #0001; border-radius: 8px; padding: 18px 24px; }
    .nowrap { white-space: nowrap; width: 1%; }
    .num-col { width: 36px; min-width: 36px; max-width: 36px; text-align: right; }
    .attendance-cell, .attendance-head { width: 38px; min-width: 38px; max-width: 38px; text-align: center; }
    @media print {
      html, body { height: 100%; width: 100%; margin: 0; padding: 0; background: #fff; }
      body { margin: 0; }
      .roster-page { max-width: 100vw; width: auto; margin: 0; box-shadow: none; border-radius: 0; padding: 0 0 0 0; }
      h1 { margin: 0 0 1em 0; text-align: center; }
      h2 { margin: 18px 0 10px 0; font-size: 1rem; }
      table { margin: 0 auto 0 auto; font-size: 0.85rem; }
      th, td { font-size: 0.85rem; padding: 4px 7px; }
      .attendance-cell, .attendance-head { width: 32px; min-width: 32px; max-width: 32px; }
      .num-col { width: 28px; min-width: 28px; max-width: 28px; }
      .nowrap { font-size: 0.95em; }
    }
  </style>
</head>
<body>
  <h1>Class Rosters</h1>
  <div id="rosters"></div>
  <script>
    const rosterPath = "rosters-2025.json";
    const attendanceCols = 8;

    fetch(rosterPath)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('rosters');
        data.forEach(cls => {
          const classDiv = document.createElement('div');
          classDiv.className = 'roster-page';
          classDiv.innerHTML = `
            <h2>${cls.Course}</h2>
            <table>
              <thead>
                <tr>
                  <th class="num-col">#</th>
                  <th class="nowrap">Last Name</th>
                  <th class="nowrap">First Name</th>
                  ${Array.from({length: attendanceCols}).map((_,i) => `<th class="attendance-head"></th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${cls.Students.map((s, i) => `
                  <tr>
                    <td class="num-col">${i + 1}</td>
                    <td class="nowrap">${s["Last Name"]}</td>
                    <td class="nowrap">${s["First Name"]}</td>
                    ${Array.from({length: attendanceCols}).map(() => `<td class="attendance-cell"></td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
          container.appendChild(classDiv);
        });
      })
      .catch(err => {
        document.getElementById('rosters').innerHTML = "<p>Error loading roster file.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
