<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Standard Physics Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-family: 'Inter', Arial, sans-serif; 
      margin: 0; 
      padding: 20px; 
      background-color: #f9f9f6;
      color: #333;
    }
    h1 { 
      color: #2c3e50; 
      text-align: center;
      margin-bottom: 2rem;
    }
    .course-part { 
      margin: 2rem 0; 
      padding: 1.5rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .units-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
      gap: 1rem; 
      margin-top: 1rem;
    }
    .unit-card { 
      border: 1px solid #e0e0e0; 
      padding: 1rem; 
      border-radius: 0.5rem;
      background: #fafafa;
    }
    .unit-card h3 { 
      margin-top: 0; 
      color: #2c3e50;
    }
    .unit-actions { 
      margin-top: 1rem; 
    }
    .unit-actions button { 
      background: #9333ea; 
      color: white; 
      border: none; 
      padding: 0.5rem 1rem; 
      border-radius: 0.25rem; 
      margin-right: 0.5rem;
      cursor: pointer;
    }
    .unit-actions button:hover { 
      background: #7c3aed; 
    }
    .course-overview {
      background: #f3e8ff;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
      border-left: 4px solid #9333ea;
    }
    .quarterly-breakdown {
      margin-top: 3rem;
    }
    .quarter-card {
      background: white;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 0.5rem;
      border-left: 4px solid #9333ea;
    }
    .nav-header {
      background: #2c3e50;
      color: white;
      padding: 1rem;
      margin: -20px -20px 20px -20px;
      text-align: center;
    }
    .nav-header a {
      color: #a855f7;
      text-decoration: none;
      font-weight: 500;
      margin: 0 1rem;
    }
    .nav-header a:hover {
      text-decoration: underline;
    }
    .schedule-info {
      background: #fef3c7;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      border-left: 4px solid #f59e0b;
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <a href="../../index.html">← Back to Main Portal</a> | 
    <a href="../../../hphysics/portal.html">🎓 Honors Physics</a> |
    <a href="../../../index.html">🏠 Home</a>
  </div>
  
  <main>
    <h1 id="course-title">Loading course...</h1>
    <div id="units-container">Loading course data...</div>
  </main>

  <script src="../../scripts/portal-manager.js"></script>
  <script>
    // Load standard physics course when page loads
    document.addEventListener('DOMContentLoaded', function() {
      loadCourse('./osephysics3.json');
    });

    function startUnit(unitNumber) {
      alert(`Starting Unit P.${unitNumber}. This would navigate to the unit content page.`);
      // TODO: Navigate to actual unit page
      // window.location.href = `./units/unit${unitNumber}/index.html`;
    }

    function viewUnitDetails(unitNumber) {
      alert(`Viewing details for Unit P.${unitNumber}. This would show expanded unit information.`);
      // TODO: Show detailed unit information modal or page
    }
  </script>
</body>
</html>

</body>
</html>
