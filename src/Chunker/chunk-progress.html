<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunk Progress Tracker - BHS Adaptive Chunker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f2e8 0%, #e8dcc0 100%);
        }
        .chunk-completed {
            background: linear-gradient(135deg, #10B981 0%, #065F46 100%);
            color: white;
        }
        .chunk-current {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: white;
            animation: pulse 2s infinite;
        }
        .chunk-upcoming {
            background-color: #f3f4f6;
            border: 2px dashed #d1d5db;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
        
        /* Toggle Switch Styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #2196F3;
        }
        
        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b" style="border-color: #e8dcc0;">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Chunk Progress Tracker</h1>
                    <p class="text-gray-600">Newton's First Law Introduction</p>
                </div>
                <div class="text-right">
                    <div class="text-sm text-gray-500">Physics Period 1</div>
                    <div class="text-lg font-semibold text-gray-800">Day 2 of 3</div>
                </div>
                <!-- Data Management Buttons -->
                <div class="flex space-x-2">

                    </button>
                    <button id="save-progress" class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">

    <!-- Progress Overview -->

                    <h2 class="text-xl font-bold text-gray-800">Unit Progress</h2>
                    <div class="flex items-center space-x-4">
                        <span id="progress-text" class="text-sm text-gray-600">4 of 8 chunks completed</span>
                        <div id="save-status" class="text-xs text-green-600 opacity-0 transition-opacity">
                            ✓ Auto-saved
                        </div>
                    </div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-6 overflow-hidden">
                    <div id="progress-bar" class="progress-bar h-full bg-gradient-to-r from-green-400 to-green-600" style="width: 50%"></div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-gray-500">
                    <span>Started Aug 26</span>
                    <span id="projected-end">Projected completion: Aug 28</span>
                </div>
            </div>

            <!-- Today's Chunks -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8" style="border: 1px solid #e8dcc0;">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Today's Schedule - Wednesday, Aug 27</h3>
                <div id="todays-chunks" class="space-y-4">
                    <!-- Chunks will be dynamically inserted here -->
                </div>
                <div class="mt-6 flex justify-center space-x-4">
                    <button id="prev-chunk" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 disabled:opacity-50">
                        ← Previous Chunk
                    </button>
                    <button id="complete-chunk" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                        Complete Current Chunk
                    </button>
                    <button id="next-chunk" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50">
                        Next Chunk →
                    </button>
                </div>
                <div class="mt-4 flex justify-center">
                    <button id="test-time-shortage" class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 text-sm">
                        🧪 Test Time Shortage (Demo)
                    </button>
                </div>
            </div>

            <!-- Full Unit Overview -->
            <div class="bg-white rounded-lg shadow-lg p-6" style="border: 1px solid #e8dcc0;">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Complete Unit Overview</h3>
                <div id="all-chunks" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- All chunks will be displayed here -->
                </div>
            </div>
        </div>
    </section>

    <script>
        // Sample lesson data - this would eventually come from JSON files
        const lessonData = {

            title: "Newton's First Law Introduction",

            chunks: [

                    completed: false,

                },

                    duration: 15,

                    duration: 15,
                    completed: false,
                    flexibility: "slippery", // Can move to homework or next day

                },
                // Day 3 chunks
                {
                    id: 8,
                    day: 3,
                    type: "assessment",
                    title: "Mini Quiz",
                    description: "Short formative assessment on Newton's First Law",
                    duration: 15,
                    completed: false,
                    flexibility: "sticky", // Assessment must happen as planned
                    stickiness: "high", // Cannot move without disrupting sequence
                    priority: "critical",
                    prerequisites: [6] // Needs Newton's First Law concept
                }
            ]
        };

        let currentChunkIndex = 4; // Currently on chunk 5 (0-indexed)

        // Chunker Engine Settings
        const chunkerSettings = {
            // Time Management
            adminTimeReserve: true,              // Reserve 15min for admin tasks
            adminTimeAmount: 15,                 // Minutes to reserve
            
            // Flexibility Rules
            allowHomeworkTransfer: true,         // Can move practice chunks to homework
            allowChunkSplitting: false,          // Can break chunks across days
            strictPrerequisites: true,           // Enforce prerequisite order
            
            // Disruption Handling
            autoAdjustOnTimeShortage: true,      // Automatically suggest adjustments
            prioritizeSticky: true,              // Protect sticky chunks first
            allowSkippingOptional: true,         // Can skip optional chunks
            
            // Assessment Protection
            protectAssessments: true,            // Never move assessment chunks
            assessmentBuffer: 5,                 // Extra minutes before assessments
            
            // Period-Specific
            allowCrossPeriodAdjustments: false,  // Can move chunks between periods
            differentPeriodPacing: false,        // Different pacing per period
            
            // Emergency Modes
            emergencyMode: false,                // Relaxes all constraints
            substituteFriendly: false,           // Simplifies for substitute teachers
            
            // Notification Preferences
            warnOnMajorAdjustments: true,        // Alert for big changes
            showPedagogicalImpact: true,         // Display learning impact warnings
            
            // Planning Horizon
            planningDaysAhead: 3,                // How many days to plan ahead
            adaptivePacing: true,                // Adjust future based on current progress
            
            // Student-Facing
            shareProgressWithStudents: false,    // Students can see chunk progress
            allowStudentTimeRequests: false     // Students can request more time on chunks
        };

        function getChunkStatus(chunk) {
            if (chunk.completed) return 'completed';
            if (chunk.current) return 'current';
            return 'upcoming';
        }

        function getChunkStatusClass(status) {
            switch(status) {
                case 'completed': return 'chunk-completed';
                case 'current': return 'chunk-current';
                case 'upcoming': return 'chunk-upcoming';
                default: return 'chunk-upcoming';
            }
        }

        function getChunkIcon(type, status, chunk) {
            const typeIcons = {
                warmup: '🏃',
                concept: '💡',
                demo: '🧪',
                practice: '📝',
                review: '🔄',
                assessment: '📊'
            };
            
            if (status === 'completed') return '✅';
            if (status === 'current') return '⏳';
            
            // Add stickiness indicators
            const baseIcon = typeIcons[type] || '📚';
            const stickinessIndicator = getStickinessIndicator(chunk);
            
            return baseIcon + stickinessIndicator;
        }

        function getStickinessIndicator(chunk) {
            if (!chunk.flexibility) return '';
            
            switch(chunk.flexibility) {
                case 'sticky': return '🔒'; // Locked in place
                case 'slippery': return '💧'; // Can slide around
                default: return '';
            }
        }

        function getStickinessColor(chunk) {
            if (!chunk.flexibility) return '';
            
            switch(chunk.flexibility) {
                case 'sticky': return 'border-l-4 border-red-500'; // Red border for sticky
                case 'slippery': return 'border-l-4 border-blue-300'; // Blue border for slippery
                default: return '';
            }
        }

        function getPriorityBadge(chunk) {
            const priorities = {
                'critical': '<span class="px-2 py-1 bg-red-100 text-red-800 text-xs rounded-full">Critical</span>',
                'important': '<span class="px-2 py-1 bg-orange-100 text-orange-800 text-xs rounded-full">Important</span>',
                'medium': '<span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full">Medium</span>',
                'optional': '<span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full">Optional</span>'
            };
            return priorities[chunk.priority] || '';
        }

        function getFlexibilityBadge(chunk) {
            const flexBadges = {
                'sticky': '<span class="px-2 py-1 bg-red-50 text-red-700 text-xs rounded border border-red-200">🔒 Sticky</span>',
                'slippery': '<span class="px-2 py-1 bg-blue-50 text-blue-700 text-xs rounded border border-blue-200">💧 Slippery</span>'
            };
            return flexBadges[chunk.flexibility] || '';
        }

        function getStickyRelationships(chunk) {
            if (!chunk.stickyWith || chunk.stickyWith.length === 0) return '';
            
            const relatedChunks = chunk.stickyWith.map(id => {
                const relatedChunk = lessonData.chunks.find(c => c.id === id);
                return relatedChunk ? relatedChunk.title : `Chunk ${id}`;
            }).join(', ');
            
            return `<div class="text-xs mt-1 text-red-600">🔗 Must stay with: ${relatedChunks}</div>`;
        }

        // ==========================================
        // TIME ADJUSTMENT ENGINE
        // ==========================================

        function handleTimeShortage(minutesLost) {
            console.log(`⚠️ Time shortage detected: ${minutesLost} minutes lost`);
            
            const adjustmentPlan = calculateTimeAdjustments(minutesLost);
            displayAdjustmentOptions(adjustmentPlan);
        }

        function calculateTimeAdjustments(minutesLost) {
            const upcomingChunks = lessonData.chunks.filter(c => !c.completed && !c.current);
            
            // Sort by flexibility (slippery first) and priority (optional first)
            const adjustableChunks = upcomingChunks
                .filter(c => c.flexibility === 'slippery' || c.priority === 'optional')
                .sort((a, b) => {
                    // Prioritize adjustments: optional > slippery > important
                    const priorityOrder = { 'optional': 0, 'medium': 1, 'important': 2, 'critical': 3 };
                    const flexOrder = { 'slippery': 0, 'sticky': 1 };
                    
                    return (priorityOrder[a.priority] - priorityOrder[b.priority]) || 
                           (flexOrder[a.flexibility] - flexOrder[b.flexibility]);
                });

            const adjustmentOptions = [];
            let timeRecovered = 0;

            for (const chunk of adjustableChunks) {
                if (timeRecovered >= minutesLost) break;

                const option = {
                    chunk: chunk,
                    action: '',
                    timeImpact: 0,
                    pedagogicalImpact: ''
                };

                if (chunk.priority === 'optional') {
                    option.action = 'skip';
                    option.timeImpact = chunk.duration;
                    option.pedagogicalImpact = 'Low - optional content can be reviewed later';
                } else if (chunk.flexibility === 'slippery' && chunk.type === 'practice') {
                    option.action = 'move_to_homework';
                    option.timeImpact = chunk.duration;
                    option.pedagogicalImpact = 'Medium - students practice at home instead';
                } else if (chunk.flexibility === 'slippery' && chunk.type === 'review') {
                    option.action = 'shorten';
                    option.timeImpact = Math.min(chunk.duration / 2, minutesLost - timeRecovered);
                    option.pedagogicalImpact = 'Low - brief review still maintains continuity';
                }

                if (option.timeImpact > 0) {
                    adjustmentOptions.push(option);
                    timeRecovered += option.timeImpact;
                }
            }

            return {
                minutesNeeded: minutesLost,
                minutesRecoverable: timeRecovered,
                adjustments: adjustmentOptions,
                feasible: timeRecovered >= minutesLost
            };
        }

        function displayAdjustmentOptions(plan) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            
            const feasibilityClass = plan.feasible ? 'border-green-500' : 'border-red-500';
            const feasibilityText = plan.feasible ? '✅ Recoverable' : '⚠️ Partial Recovery';
            
            modal.innerHTML = `
                <div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
                    <div class="border-l-4 ${feasibilityClass} pl-4 mb-6">
                        <h3 class="text-lg font-bold">Time Adjustment Options</h3>
                        <p class="text-sm text-gray-600">Need to recover: ${plan.minutesNeeded} minutes</p>
                        <p class="text-sm font-medium">${feasibilityText}: ${plan.minutesRecoverable} minutes</p>
                    </div>
                    
                    <div class="space-y-3 mb-6">
                        ${plan.adjustments.map((adj, index) => `
                            <div class="border rounded-lg p-3">
                                <div class="flex items-center justify-between mb-2">
                                    <label class="flex items-center space-x-2">
                                        <input type="checkbox" id="adj-${index}" checked>
                                        <span class="font-medium">${adj.chunk.title}</span>
                                    </label>
                                    <span class="text-sm bg-blue-100 text-blue-800 px-2 py-1 rounded">
                                        ${adj.action.replace('_', ' ')} (+${adj.timeImpact}min)
                                    </span>
                                </div>
                                <p class="text-sm text-gray-600">${adj.pedagogicalImpact}</p>
                                <div class="flex space-x-2 mt-1">
                                    ${getFlexibilityBadge(adj.chunk)}
                                    ${getPriorityBadge(adj.chunk)}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="flex space-x-3">
                        <button id="apply-adjustments" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            Apply Selected Adjustments
                        </button>
                        <button id="manual-adjust" class="flex-1 bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700">
                            Manual Override
                        </button>
                        <button id="cancel-adjustments" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                            Cancel
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Event listeners
            document.getElementById('apply-adjustments').onclick = () => {
                applySelectedAdjustments(plan.adjustments);
                document.body.removeChild(modal);
            };
            
            document.getElementById('cancel-adjustments').onclick = () => {
                document.body.removeChild(modal);
            };
            
            document.getElementById('manual-adjust').onclick = () => {
                document.body.removeChild(modal);
                showManualAdjustmentInterface();
            };
        }

        function applySelectedAdjustments(adjustments) {
            adjustments.forEach((adj, index) => {
                const checkbox = document.getElementById(`adj-${index}`);
                if (checkbox && checkbox.checked) {
                    switch(adj.action) {
                        case 'skip':
                            adj.chunk.skipped = true;
                            adj.chunk.skipReason = 'Time shortage - moved to optional review';
                            break;
                        case 'move_to_homework':
                            adj.chunk.movedToHomework = true;
                            adj.chunk.duration = 0; // Remove from class time
                            break;
                        case 'shorten':
                            adj.chunk.duration -= adj.timeImpact;
                            adj.chunk.shortened = true;
                            adj.chunk.originalDuration = adj.chunk.duration + adj.timeImpact;
                            break;
                    }
                }
            });
            
            updateDisplay();
            console.log('✅ Time adjustments applied successfully');
        }

        function showManualAdjustmentInterface() {
            // Future: Allow teachers to manually drag/drop chunks, adjust durations
            alert('Manual adjustment interface - coming soon!\n\nFor now, use the automatic suggestions or modify individual chunks.');
        }

        // Test function to simulate time shortage
        function simulateTimeShortage() {
            handleTimeShortage(20); // Simulate losing 20 minutes
        }

        // ==========================================
        // CHUNKER SETTINGS INTERFACE
        // ==========================================

        function showChunkerSettings() {

            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            modal.innerHTML = `

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Time Management -->
                        <div class="space-y-4">

                            <div class="flex items-center justify-between">

                                    <label class="font-medium">Admin Time Reserve</label>
                                    <p class="text-sm text-gray-600">Always reserve time for admin tasks</p>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="adminTimeReserve" ${chunkerSettings.adminTimeReserve ? 'checked' : ''}>
                                    <span class="slider"></span>

                                <label class="font-medium">Admin Time (minutes)</label>
                                <input type="number" id="adminTimeAmount" value="${chunkerSettings.adminTimeAmount}" 
                                       class="w-16 px-2 py-1 border rounded" min="0" max="30">
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <div>
                                    <label class="font-medium">Assessment Buffer</label>
                                    <p class="text-sm text-gray-600">Extra time before assessments</p>
                                </div>
                                <input type="number" id="assessmentBuffer" value="${chunkerSettings.assessmentBuffer}" 
                                       class="w-16 px-2 py-1 border rounded" min="0" max="15">
                            </div>
                        </div>

                        <!-- Flexibility Rules -->
                        <div class="space-y-4">
                            <h4 class="font-semibold text-gray-800 border-b pb-2">🔄 Flexibility Rules</h4>
                            
                            <div class="flex items-center justify-between">
                                <div>
                                    <label class="font-medium">Homework Transfer</label>
                                    <p class="text-sm text-gray-600">Move practice chunks to homework</p>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="allowHomeworkTransfer" ${chunkerSettings.allowHomeworkTransfer ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="flex items-center justify-between">

                                    <p class="text-sm text-gray-600">Allow splitting chunks across days</p>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="allowChunkSplitting" ${chunkerSettings.allowChunkSplitting ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <div>
                                    <label class="font-medium">Skip Optional</label>
                                    <p class="text-sm text-gray-600">Can skip optional chunks when needed</p>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="allowSkippingOptional" ${chunkerSettings.allowSkippingOptional ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>

                        <!-- Auto-Adjustment -->
                        <div class="space-y-4">
                            <h4 class="font-semibold text-gray-800 border-b pb-2">🤖 Auto-Adjustment</h4>
                            
                            <div class="flex items-center justify-between">
                                <div>
                                    <label class="font-medium">Auto-Adjust Time</label>
                                    <p class="text-sm text-gray-600">Suggest adjustments for time shortages</p>
                                </div>
                                <label class="switch">
                                    <input type="checkbox" id="autoAdjustOnTimeShortage" ${chunkerSettings.autoAdjustOnTimeShortage ? 'checked' : ''}>
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="flex items-center justify-between">
                                <div>
                                    <label class="font-medium">Protect Assessments</label>

        function updateProgress() {
            const completedChunks = lessonData.chunks.filter(c => c.completed).length;
            const totalChunks = lessonData.chunks.length;
            const progressPercent = (completedChunks / totalChunks) * 100;
            
            document.getElementById('progress-bar').style.width = progressPercent + '%';
            document.getElementById('progress-text').textContent = `${completedChunks} of ${totalChunks} chunks completed`;

        function completeCurrentChunk() {
            const currentChunk = lessonData.chunks[currentChunkIndex];
            currentChunk.completed = true;
            currentChunk.current = false;
            
            // Move to next chunk if available
            if (currentChunkIndex < lessonData.chunks.length - 1) {
                currentChunkIndex++;
                lessonData.chunks[currentChunkIndex].current = true;
            }
            
            updateDisplay();
        }

        function updateDisplay() {
            renderTodaysChunks();
            renderAllChunks();
            updateProgress();
            
            // Update button states
            document.getElementById('prev-chunk').disabled = currentChunkIndex === 0;
            document.getElementById('next-chunk').disabled = currentChunkIndex >= lessonData.chunks.length - 1;
        }

        // Event listeners
        document.getElementById('complete-chunk').addEventListener('click', completeCurrentChunk);

        document.getElementById('prev-chunk').addEventListener('click', () => {
            if (currentChunkIndex > 0) {
                lessonData.chunks[currentChunkIndex].current = false;
                currentChunkIndex--;
                lessonData.chunks[currentChunkIndex].current = true;
                lessonData.chunks[currentChunkIndex].completed = false;
                updateDisplay();
            }
        });

        document.getElementById('next-chunk').addEventListener('click', () => {
            if (currentChunkIndex < lessonData.chunks.length - 1) {
                lessonData.chunks[currentChunkIndex].current = false;
                lessonData.chunks[currentChunkIndex].completed = true;
                currentChunkIndex++;
                lessonData.chunks[currentChunkIndex].current = true;
                updateDisplay();
            }
        });

        document.getElementById('test-time-shortage').addEventListener('click', () => {
            simulateTimeShortage();
        });

        // Storage Functions
        function saveToLocalStorage() {
            const saveData = {

        function loadFromLocalStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.lessonData && data.currentChunkIndex !== undefined) {
                        // Merge saved data
                        lessonData.chunks = data.lessonData.chunks;
                        currentChunkIndex = data.currentChunkIndex;
                        
                        console.log(`Loaded progress from ${new Date(data.timestamp).toLocaleString()}`);
                        return true;
                    }
                } catch (e) {
                    console.error('Error loading saved data:', e);
                }
            }
            return false;
        }

        // Import Functions
        function importData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    if (imported.lesson && imported.lesson.chunks) {
                        // Validate the import
                        if (confirm(`Import "${imported.metadata?.title || 'Unknown'}" lesson data? This will replace your current progress.`)) {
                            lessonData.chunks = imported.lesson.chunks;
                            lessonData.title = imported.lesson.title || lessonData.title;
                            lessonData.id = imported.lesson.id || lessonData.id;
                            
                            // Set progress
                            if (imported.progress && imported.progress.currentChunkIndex !== undefined) {
                                currentChunkIndex = imported.progress.currentChunkIndex;
                            } else {
                                // If importing a template, start from beginning
                                currentChunkIndex = 0;
                                lessonData.chunks.forEach((chunk, index) => {
                                    chunk.completed = false;
                                    chunk.current = index === 0;
                                });
                            }
                            
                            updateDisplay();
                            saveToLocalStorage();
                            
                            console.log('Data imported successfully');
                            alert('Lesson data imported successfully!');
                        }
                    } else {
                        alert('Invalid file format. Please select a valid chunk progress file.');
                    }
                } catch (error) {
                    console.error('Import error:', error);
                    alert('Error importing file. Please check the file format.');
                }
            };
            reader.readAsText(file);
        }

        // Helper functions for AI context generation
        function extractLearningObjective(chunk) {
            const objectives = {
                'warmup': 'Activate prior knowledge and prepare for new learning',
                'concept': `Understand and define ${chunk.title.toLowerCase()}`,
                'demo': `Observe and analyze ${chunk.title.toLowerCase()} demonstration`,
                'practice': `Apply ${chunk.title.toLowerCase()} concepts to problems`,
                'review': `Consolidate understanding of ${chunk.title.toLowerCase()}`,
                'assessment': `Demonstrate mastery of ${chunk.title.toLowerCase()}`
            };
            return objectives[chunk.type] || `Learn about ${chunk.title}`;
        }

        function extractConcepts(chunk) {
            const conceptMap = {
                'Motion Review': ['kinematics', 'velocity', 'acceleration'],
                'What is Inertia?': ['inertia', 'tendency', 'motion', 'rest'],
                'Tablecloth Demo': ['inertia', 'force', 'acceleration', 'demonstration'],
                'Guided Examples': ['problem_solving', 'application', 'analysis'],
                'Yesterday\'s Recap': ['review', 'reinforcement', 'connection'],
                'Newton\'s First Law': ['newton_first_law', 'net_force', 'equilibrium'],
                'Problem Solving': ['application', 'mathematical_analysis', 'real_world'],
                'Mini Quiz': ['assessment', 'evaluation', 'understanding_check']
            };
            return conceptMap[chunk.title] || ['general_physics'];
        }

        function extractVocabulary(chunk) {
            const vocabMap = {
                'Motion Review': ['velocity', 'acceleration', 'displacement'],
                'What is Inertia?': ['inertia', 'tendency', 'motion', 'rest', 'state'],
                'Tablecloth Demo': ['inertia', 'force', 'friction', 'demonstration'],
                'Newton\'s First Law': ['law', 'net force', 'equilibrium', 'balanced', 'unbalanced'],
                'Problem Solving': ['analysis', 'solution', 'given', 'find', 'answer']
            };
            return vocabMap[chunk.title] || [];
        }

        function getCurrentDay() {
            return lessonData.chunks.find(c => c.current)?.day || 1;
        }

        function getChunkTypeDistribution() {
            const types = {};
            lessonData.chunks.forEach(chunk => {
                types[chunk.type] = (types[chunk.type] || 0) + 1;
            });
            return types;
        }

        function getConceptualFlow() {
            return lessonData.chunks.map(chunk => ({
                sequence: chunk.id,
                concept: chunk.title,
                type: chunk.type,
                buildsOn: chunk.id > 1 ? lessonData.chunks[chunk.id - 2].title : null
            }));
        }

        function generateRemediationPrompts() {
            const strugglingAreas = lessonData.chunks
                .filter(c => c.type === 'concept' || c.type === 'practice')
                .map(c => c.title);
            
            return {
                prompt: `Create remediation materials for students struggling with: ${strugglingAreas.join(', ')}`,
                focus: "Visual explanations, simpler analogies, step-by-step breakdowns",
                format: "Interactive demonstrations, guided practice, concept maps"
            };

        function generateExtensionPrompts() {
            const masteredConcepts = lessonData.chunks
                .filter(c => c.completed && (c.type === 'concept' || c.type === 'demo'))
                .map(c => c.title);
            
            return {
                prompt: `Create extension activities for students who have mastered: ${masteredConcepts.join(', ')}`,
                focus: "Real-world applications, complex scenarios, cross-curricular connections",
                format: "Research projects, advanced problems, design challenges"
            };
        }

        function generatePracticePrompts() {
            const practiceNeeds = lessonData.chunks
                .filter(c => c.type === 'concept')
                .map(c => c.title);
            
            return {
                prompt: `Create practice problems and activities for: ${practiceNeeds.join(', ')}`,
                focus: "Varied difficulty levels, real-world contexts, common misconceptions",
                format: "Problem sets, interactive simulations, peer discussions"
            };

        function generateAssessmentPrompts() {
            const assessableObjectives = lessonData.chunks
                .filter(c => c.completed)
                .map(c => extractLearningObjective(c));
            
            return {
                prompt: `Create formative assessments for: ${assessableObjectives.join(', ')}`,
                focus: "Quick checks, misconception detection, progress monitoring",
                format: "Exit tickets, concept maps, peer explanations"
            };
        }

            return [
                "What are the most effective ways to teach inertia concepts?",
                "How can demonstrations enhance understanding of Newton's First Law?",
                "What misconceptions do students commonly have about force and motion?",
                "How can we scaffold from everyday examples to formal physics concepts?"
            ];
        }

        function identifyConceptualDifficulties() {

                {
                    concept: "Inertia as tendency",
                    difficulty: "Students think objects 'want' to stop rather than continue",
                    evidence: "Common student questions about why things slow down"
                },
                {
                    concept: "Net force vs individual forces",
                    difficulty: "Confusion between forces acting and net effect",
                    evidence: "Difficulty with equilibrium scenarios"
                }
            ];

        // Event Listeners
        document.getElementById('save-progress').addEventListener('click', saveToLocalStorage);
        document.getElementById('export-data').addEventListener('click', showExportMenu);
        document.getElementById('settings-btn').addEventListener('click', showChunkerSettings);
        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                importData(file);
                e.target.value = ''; // Reset file input
            }
        });

        // Auto-save functionality
        let autoSaveTimer;
        function scheduleAutoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveToLocalStorage();
            }, AUTO_SAVE_INTERVAL);
        }

        // Override the completeCurrentChunk function to include auto-save
        const originalCompleteCurrentChunk = completeCurrentChunk;
        completeCurrentChunk = function() {
            originalCompleteCurrentChunk();
            scheduleAutoSave();
        };

        // Load saved data on startup
        if (loadFromLocalStorage()) {
            updateDisplay();
        }

        // Schedule initial auto-save
        scheduleAutoSave();
    </script>
