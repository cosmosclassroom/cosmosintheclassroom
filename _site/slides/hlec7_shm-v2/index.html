<h1 id="8-harmonics-and-waves">8 Harmonics and Waves</h1>

<p>How can regular, repeating motion be described with waves?</p>

<hr />

<h2 id="contents">Contents</h2>

<ul>
  <li>Simple Harmonic Motion and Springs</li>
  <li>Simple Pendula</li>
  <li>Energy in Harmonic Oscillators</li>
  <li>Sine functions</li>
  <li>Wave Motions</li>
</ul>

<hr />

<h2 id="harmonics">Harmonics</h2>

<ul>
  <li>
    <p>Many objects <strong>oscillate</strong> - an object on the end of a spring, a pendulum, a tuning fork, electrons in atoms and molecules, and the molecules themselves.</p>
  </li>
  <li>
    <p>When an object vibrates or oscillates back and forth, over the same path, each oscillation taking the same amount of time, the motion is periodic.</p>
  </li>
</ul>

<div class="dict">

  <ul>
    <li><strong>Oscillate</strong> - to move in a repeating motion; retracing a fixed path</li>
  </ul>

</div>

<hr />

<h2 id="simple-harmonic-motion">Simple Harmonic Motion</h2>

<p>An oscillating or vibrating object undergoes <strong>simple harmonic motion (SHM)</strong> if the <strong>restoring</strong> force is proportional to the (negative of) its displacement (Hooke’s Law):</p>

<div class="formula">

  <p>[F \propto -k \cdot x]</p>

  <center>

*where $k$ is the spring constant and $x$ is displacement*

</center>
</div>

<p>Hooke’s Law accurately describes springs, but other oscillating solids as well.</p>

<hr />

<h1 id="restoring-force">Restoring Force</h1>

<p>The restoring force always acts to return the system to its equilibrium position:</p>

<ul>
  <li>In a <strong>spring</strong>: The force that pulls/pushes back to the rest position</li>
  <li>In a <strong>pendulum</strong>: The gravitational force component that swings back to center</li>
</ul>

<p><img src="/slides/img/9_waves-optics/8_waves_3.png" alt="bg left 80%" /></p>

<hr />

<h2 id="properties-of-oscillations">Properties of Oscillations</h2>

<p>Oscillations can be described by three properties:</p>

<div class="dict">

  <ul>
    <li><strong>Amplitude (A)</strong> - the maximum displacement from equilibrium</li>
  </ul>

</div>
<div class="trm">

  <ul>
    <li><strong>Period ($T$)</strong> - the time required to complete one full cycle</li>
  </ul>

</div>
<div class="trm">

  <ul>
    <li><strong>Frequency ($f$)</strong> - the number of cycles per second</li>
  </ul>

</div>
<p>&lt;/div&gt;</p>

<center>

$f = \frac{1}{T}$ or $T = \frac{1}{f}$

</center>

<hr />

<h2 id="time-in-harmonic-motion">Time in Harmonic Motion</h2>

<p>The unit of frequency is the Hz or $s^{-1}$ and represents the number of cycles that occur each second.</p>

<div class="column">
  <div>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;ul&gt;
  &lt;li&gt;&lt;strong&gt;Period ($T$)&lt;/strong&gt; - the time required to complete one full cycle&lt;/li&gt;
  &lt;li&gt;&lt;strong&gt;Frequency ($f$)&lt;/strong&gt; - the number of cycles per second&lt;/li&gt;
&lt;/ul&gt;

&lt;div&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_11.png" alt="bg left contain" /&gt;&lt;/p&gt;

&lt;/div&gt;

&lt;hr /&gt;

&lt;h2 id="frequency-and-period"&gt;Frequency and Period&lt;/h2&gt;

&lt;p&gt;The period of oscillation for a mass $m$ on the end of a spring with spring constant $k$ is:&lt;/p&gt;
</code></pre></div>    </div>

    <p>[T = 2 \pi \sqrt{\frac{m}{k}}]</p>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;p&gt;$T$ is the period of time for the mass to complete one cycle of movement.&lt;/p&gt;

&lt;hr /&gt;

&lt;h2 id="frequency-and-period-1"&gt;Frequency and Period&lt;/h2&gt;

&lt;div class="column"&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_5.png" alt="left" /&gt;&lt;/p&gt;

&lt;/div&gt;
&lt;div&gt;

  &lt;p&gt;Strange though it seems, the period is not dependent on amplitude.&lt;/p&gt;
</code></pre></div>    </div>

    <p>[T = 2\pi\sqrt{\frac{m}{k}}]</p>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>  &lt;p&gt;Displacing a spring farther increases its velocity, and therefore the period is kept constant.&lt;/p&gt;
</code></pre></div>    </div>

    <p>[E = \frac{1}{2}m \cdot \vec{v}^2 = \frac{1}{2}k\cdot x^2]</p>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>  &lt;p&gt;This is partly explained by the &lt;strong&gt;conservation of mechanical energy&lt;/strong&gt;, which is generally at work in simple harmonic motion&lt;/p&gt;

&lt;/div&gt;

&lt;hr /&gt;

&lt;h2 id="transformation-in-shm"&gt;Transformation in SHM&lt;/h2&gt;

&lt;p&gt;During simple harmonic motion, the total energy of the system is conserved but it is continually changing from kinetic to potential (and back).&lt;/p&gt;

&lt;p&gt;&lt;img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExejUydmNkZnZvbjl1MGFwdGxneWN1MGFpZHl3cjdlN3BjbWR1MzZ2MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/KG4S4T3n2qEqgxBEuV/giphy.gif" alt="bg 75% left" /&gt;&lt;/p&gt;

&lt;hr /&gt;

&lt;h2 id="simple-pendulum"&gt;Simple Pendulum&lt;/h2&gt;

&lt;p&gt;When friction is present, the motion is damped.&lt;/p&gt;

&lt;p&gt;The maximum displacement of the pendulum decreases with time, mechanical energy is eventually transformed into thermal energy (friction).&lt;/p&gt;

&lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_9.png" alt="bg 50% left contain" /&gt;&lt;/p&gt;

&lt;hr /&gt;

&lt;h2 id="simple-pendulum-1"&gt;Simple Pendulum&lt;/h2&gt;

&lt;p&gt;A simple pendulum with length $l$ approximates SHM if the amplitude is small and friction is negligible (when displacement angles are below $15^\circ$).&lt;/p&gt;

&lt;p&gt;For small amplitudes, its period of a pendulum is given by:&lt;/p&gt;
</code></pre></div>    </div>

    <p>[T = 2\pi \sqrt{\frac{l}{a_g}}]</p>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;blockquote&gt;
  &lt;p&gt;where l is the length of the pendulum and $a_g$ is the acceleration due to gravity on the parent body.&lt;/p&gt;
&lt;/blockquote&gt;

&lt;p&gt;Note that the period depends only on length, not the mass or “bob”.&lt;/p&gt;

&lt;hr /&gt;

&lt;p&gt;This is the length of the pendulum.&lt;/p&gt;

&lt;hr /&gt;

&lt;h2 id="wave-motions"&gt;Wave Motions&lt;/h2&gt;

&lt;p&gt;A wave is the motion of a &lt;strong&gt;disturbance&lt;/strong&gt;.&lt;/p&gt;

&lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_12.png" alt="auto drop-shadow" /&gt;&lt;/p&gt;

&lt;hr /&gt;

&lt;p&gt;Most waves require a medium, or material through which the disturbance travels.&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;Waves that require a medium are called &lt;strong&gt;mechanical waves&lt;/strong&gt;.&lt;/li&gt;
  &lt;li&gt;Waves that do not require a medium are &lt;strong&gt;electromagnetic waves&lt;/strong&gt;.&lt;/li&gt;
&lt;/ul&gt;

&lt;hr /&gt;

&lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_13.gif" alt="alt text" /&gt;&lt;/p&gt;

&lt;h2 id="section"&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_15.gif" alt="alt text" /&gt;&lt;/h2&gt;

&lt;h2 id="particles-in-waves"&gt;Particles in Waves&lt;/h2&gt;
&lt;div class="column"&gt;
  &lt;div&gt;

    &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_14-1.gif" alt="bg left center" /&gt;&lt;/p&gt;

  &lt;/div&gt;

  &lt;p&gt;Particles in the medium oscillate, tracing a returning path but not traveling with the wave.&lt;/p&gt;

  &lt;p&gt;As the wave passes, particles return to their original positions.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_14-1.gif" alt="bg left center" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="particles-in-waves-1"&gt;Particles in Waves&lt;/h2&gt;

  &lt;p&gt;Particles in the medium oscillate, tracing a returning path but not &lt;strong&gt;traveling with&lt;/strong&gt; the wave.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_13.gif" alt="contain left" /&gt;&lt;/p&gt;

  &lt;h2 id="section-1"&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_14.gif" alt="alt text" /&gt;&lt;/h2&gt;

  &lt;h2 id="transverse-and-longitudinal-waves"&gt;Transverse and Longitudinal Waves&lt;/h2&gt;

  &lt;ul&gt;
    &lt;li&gt;
      &lt;p&gt;&lt;strong&gt;Transverse waves&lt;/strong&gt; are waves where the particles move perpendicular to the wave. Example: dropping a pebble in a pond moves the water up and down, but the waves radiate outward laterally (to the sides).&lt;/p&gt;
    &lt;/li&gt;
    &lt;li&gt;
      &lt;p&gt;&lt;strong&gt;Longitudinal waves&lt;/strong&gt; are waves that travel parallel to the wave motion. Example: compressing and releasing a spring.&lt;/p&gt;
    &lt;/li&gt;
  &lt;/ul&gt;

  &lt;hr /&gt;

  &lt;h2 id="creating-waves"&gt;Creating Waves&lt;/h2&gt;

  &lt;p&gt;&lt;strong&gt;Vibrating&lt;/strong&gt; objects act as sources of waves that travel outward from the source.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_15.gif" alt="center" /&gt;&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;Examples include waves in water or a string or cord.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_16.png" alt="center 50%" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;p&gt;&amp;lt;img url(&amp;lt;&amp;gt;”https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmpxZmJjd3FicjlhZmcyem9vdzJqN3lmMXNrMnZ4ZnZvYWZxZjI1dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/F5rQlfTXqCJ8c/giphy.gif”&amp;gt;)&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="wave-motions-1"&gt;Wave Motions&lt;/h2&gt;

  &lt;p&gt;The rate at which waves transfer energy depends on the amplitude at which the particles in the medium vibrate.&lt;/p&gt;

  &lt;p&gt;For mechanical waves, the energy transferred is proportional to the square of the amplitude.&lt;/p&gt;

  &lt;p&gt;When the amplitude of a wave is doubled, its energy increases by a factor of four.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="creating-waves-1"&gt;Creating Waves&lt;/h2&gt;

  &lt;p&gt;A pulse is a single wave traveling through a medium. &lt;img src="images/8_waves_shm/spring longitudinal visual.jpg" alt="Wave Pulse" /&gt; &lt;img src="/slides/img/9_waves-optics/8_waves_17.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="creating-waves-2"&gt;Creating Waves&lt;/h2&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_18.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="creating-waves-3"&gt;Creating Waves&lt;/h2&gt;

  &lt;p&gt;Sine waves describe particles vibrating within harmonic motion.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_19.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Wavelength ($\lambda$)&lt;/strong&gt; - the distance a wave travels in one cycle or the distance between crests or troughs on a wave.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;The trigonometric function $y = \sin x$ produces the curve when plotted.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="modeling-waves"&gt;Modeling Waves&lt;/h2&gt;

  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Crest&lt;/strong&gt; - the highest point above the equilibrium position.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_20.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Trough&lt;/strong&gt; - the lowest point below the equilibrium position.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;hr /&gt;

  &lt;h2 id="moving-waves"&gt;Moving Waves&lt;/h2&gt;

  &lt;p&gt;A traveling wave can be represented mathematically.&lt;/p&gt;

  &lt;p&gt;The velocity of a wave is its wavelength divided by its period.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="interacting-waves"&gt;Interacting Waves&lt;/h2&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_21.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;The waves interact to form an interference pattern.&lt;/p&gt;

  &lt;p&gt;As waves move outward from their respective sources, they pass through one another.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="colliding-waves"&gt;Colliding Waves&lt;/h2&gt;

  &lt;p&gt;When waves come together, they do not collide as particles.&lt;/p&gt;

  &lt;p&gt;Because mechanical waves are not matter, only its displacement, two waves can occupy the same space at the same time.&lt;/p&gt;

  &lt;p&gt;Superposition is the combination of two overlapping waves at once.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="colliding-waves-1"&gt;Colliding Waves&lt;/h2&gt;

  &lt;p&gt;At each point in the wave, the displacements of the particles due to each wave are added.&lt;/p&gt;

  &lt;p&gt;The resulting sum is the displacement of the resultant wave.&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;Displacements in the same direction produce constructive interference.&lt;/li&gt;
    &lt;li&gt;Displacements in opposite directions produce destructive interference.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;hr /&gt;

  &lt;h2 id="colliding-waves-2"&gt;Colliding Waves&lt;/h2&gt;

  &lt;p&gt;Displacements in the same direction produce constructive interference.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_22.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_23.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="colliding-waves-3"&gt;Colliding Waves&lt;/h2&gt;

  &lt;p&gt;Displacements in opposite directions produce destructive interference.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_24.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_25.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;Resultant displacement at each point is zero; pulses cancel each other out.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="after-collision"&gt;After collision&lt;/h2&gt;

  &lt;p&gt;After the two pulses pass through each other, each pulse has the same shape it did before the waves met, and is still traveling in the same direction.&lt;/p&gt;

  &lt;p&gt;This is true for sound waves, water waves, light waves, and many others.&lt;/p&gt;

  &lt;p&gt;Waves maintain their own characteristics after interference.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="after-collision-1"&gt;After collision&lt;/h2&gt;

  &lt;p&gt;&lt;img src="img/9_waves-optics/8_waves_26.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_27.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;Constructive&lt;/li&gt;
    &lt;li&gt;Destructive&lt;/li&gt;
  &lt;/ul&gt;

  &lt;hr /&gt;

  &lt;h2 id="reflection"&gt;Reflection&lt;/h2&gt;

  &lt;p&gt;When a pulse reaches a boundary, two changes can occur:&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;If it is a free boundary, the wave reflects, changing direction and maintaining its amplitude and orientation.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_28.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="reflection-1"&gt;Reflection&lt;/h2&gt;

  &lt;p&gt;When a pulse reaches a boundary, two changes can occur:&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;If it is a fixed boundary, the wave reflects, changing direction and is also inverted.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_29.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="standing-waves"&gt;Standing Waves&lt;/h2&gt;

  &lt;p&gt;If a medium is vibrated at exactly the right frequency, a standing wave can be formed.&lt;/p&gt;

  &lt;p&gt;A standing wave is a wave that appears to stand motionless due to alternating regions of constructive and destructive interference.&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Nodes&lt;/strong&gt; are points of complete destructive interference (displacement = 0).&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Antinodes&lt;/strong&gt; are points of largest amplitude, caused by perfectly aligned constructive interference.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;hr /&gt;

  &lt;h2 id="standing-waves-1"&gt;Standing Waves&lt;/h2&gt;

  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Nodes&lt;/strong&gt; are points of complete destructive interference (displacement = 0).&lt;/li&gt;
    &lt;li&gt;&lt;strong&gt;Antinodes&lt;/strong&gt; are points of largest amplitude, caused by perfectly aligned constructive interference.&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_30.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;Only certain frequencies (and therefore wavelengths) produce standing waves.&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="standing-waves-2"&gt;Standing Waves&lt;/h2&gt;

  &lt;p&gt;Only certain frequencies (and therefore wavelengths) produce standing waves.&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_31.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;p&gt;For any given wave of period $T$, four standing waves can exist:&lt;/p&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_32.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="the-scales-of-things"&gt;The Scales of Things&lt;/h2&gt;

  &lt;p&gt;Different types of waves have vastly different scales:&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;Radio waves: Kilometers long&lt;/li&gt;
    &lt;li&gt;Visible light: 400-700 nanometers&lt;/li&gt;
    &lt;li&gt;X-rays: Less than 10 nanometers&lt;/li&gt;
    &lt;li&gt;Sound waves in air: Centimeters to meters&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;img src="/slides/img/9_waves-optics/8_waves_33.png" alt="bg left contain" /&gt;&lt;/p&gt;

  &lt;hr /&gt;

  &lt;h2 id="key-equations-summary"&gt;Key Equations Summary&lt;/h2&gt;

  &lt;p&gt;&lt;strong&gt;Simple Harmonic Motion:&lt;/strong&gt;&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Hooke’s Law: $F = -kx$&lt;/li&gt;
    &lt;li&gt;Spring Period: $T = 2\pi\sqrt{\frac{m}{k}}$&lt;/li&gt;
    &lt;li&gt;Pendulum Period: $T = 2\pi\sqrt{\frac{l}{g}}$&lt;/li&gt;
  &lt;/ul&gt;

  &lt;p&gt;&lt;strong&gt;Waves:&lt;/strong&gt;&lt;/p&gt;
  &lt;ul&gt;
    &lt;li&gt;Wave Speed: $v = \frac{\lambda}{T}$ or $v = f\lambda$&lt;/li&gt;
    &lt;li&gt;Frequency-Period Relationship: $f = \frac{1}{T}$&lt;/li&gt;
    &lt;li&gt;Wave Energy: $E \propto A^2$&lt;/li&gt;
  &lt;/ul&gt;

  &lt;hr /&gt;

  &lt;h2 id="example-1--a-pendulum-clock"&gt;Example 1 | A pendulum clock&lt;/h2&gt;

  &lt;p&gt;A pendulum clock is being designed to have a period of exactly 1.0 s. How long should the pendulum be?&lt;/p&gt;

  &lt;hr /&gt;
