<h1 id="curious-phenomena">Curious phenomena</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_0.jpg" alt="bg left 70%" /></p>

<p>The ancients knew that certain materials had  <strong>attractive</strong>  properties</p>

<p><strong>Amber</strong> \, rubbed with fur\, would cause very light objects to  <strong>stick</strong>   <strong>to</strong>   <strong>it</strong></p>

<p>__Lodestones __ exert magnetic attraction to iron</p>

<p>Greek for amber is  <em>“elektron”</em> \, for which electricity has become named</p>

<p>Thales</p>

<p>626 - 545 BCE</p>

<hr />

<h1 id="thats-a-very-big-magnet">That’s… a very big magnet</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_1.png" alt="bg left 70%" /></p>

<p>Englishman William Gilbert was the first to coin the term “ <em>electric</em> ”\, referring to the Greek</p>

<p>Compared electricity to  <strong>magnetism</strong> \, exploring their differences and determining that  <strong>Earth</strong>  was a giant magnet</p>

<p>Explored why magnets always work\, but electricity must be prepared (thought it was  <em>effluvium</em> )</p>

<p>William Gilbert</p>

<p>1544 - 1603 CE</p>

<hr />

<h1 id="franklins-contributions-the-law-of-charges">Franklin’s Contributions: The Law of Charges</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_3.png" alt="bg left 70%" /></p>

<p><strong>Charges</strong>  ( <em>q</em> ) exist in two forms: positives and negatives</p>

<p><strong>Like</strong>  charges repel;  __opposite __ charges attract</p>

<p>Charge is  <strong>conserved</strong> ; the net amount of electric charge produced in any (natural) process is zero</p>

<hr />

<h1 id="charges-in-atoms">Charges in Atoms</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_4.png" alt="bg left 70%" /></p>

<p>In their default state\, atoms are electrically  <strong>neutral</strong></p>

<p>The number of protons is  <strong>balanced</strong>  by the number of electrons</p>

<p>Electrons are easily  <strong>transferred</strong>  between some atoms</p>

<hr />

<h1 id="materials-and-charge">Materials and Charge</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_5.png" alt="bg left 70%" /></p>

<p>When one atom has a greater affinity for electrons\, it can “ <strong>steal</strong> ” them from another</p>

<p>The buildup of electrons on one material and absence on the other results in  <strong>unequal</strong>  charges</p>

<p>The interaction between positive and negative charges results in an  <strong>attractive</strong>   <strong>force</strong></p>

<hr />

<h1 id="quantum-charge">“Quantum” charge</h1>

<p>Careful experiments in the 19th and 20th centuries showed that charge is  <strong>quantized</strong></p>

<p><strong>Charge</strong>  always exists in pairs and is always in multiples of a fundamental unit of charge</p>

<p>This fundamental unit is symbolized by the letter  _e _ and represents the precise charge of a single particle</p>

<hr />

<h1 id="the-elementary-charge">The elementary charge</h1>

<p>A  <strong>proton</strong>  is said to carry a charge of + <em>e</em>  and an  <strong>electron</strong>  is said to carry a charge of - <em>e</em></p>

<p>The value of  _e _ has been determined  <strong>experimentally</strong>  to be</p>

<p>1.602176 x 10-19 C\, or Coulombs</p>

<p>We approximate this value\, called  <em>elementary charge</em> \, as  <strong>1.6 x 10</strong>  <strong>-19  __  __C</strong></p>

<hr />

<h1 id="conductors-transfer-charge">Conductors transfer charge</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_7.png" alt="bg left 70%" /></p>

<p>Materials in which charge flows freely are called  <strong>conductors</strong></p>

<p><em>Examples: metals\, some liquids</em></p>

<p>Conductors  <strong>distribute</strong>  charge through the material (and into others\, if able)</p>

<hr />

<h1 id="insulators-do-not-transfer-charge">Insulators do not transfer charge</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_8.png" alt="bg left 70%" /></p>

<p>Materials through which charge does not flow are called  <strong>insulators</strong></p>

<p><em>Examples: glass\, rubber\, silk\, plastic</em></p>

<p>Insulators keep charges  <strong>local</strong></p>

<hr />

<h1 id="semi--and-superconductors">Semi- and superconductors</h1>

<p><strong>Semiconductors</strong>  are materials which transfer charge at intermediate rates\, depending on their chemical composition</p>

<p><strong>Superconductors</strong>  are materials which transfer charge indefinitely when kept at very low temperatures</p>

<hr />

<h1 id="charge-can-transfer-by-contact">Charge can transfer by contact</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_9.png" alt="bg left 70%" /></p>

<p><strong>Insulators</strong>  can be charged by contact and the charges hold because the material does not transfer it readily to anything else</p>

<p><strong>Conductors</strong>  require being handled with an insulator to charge\, otherwise they just transfer the charge to the human body (which is a conductor)</p>

<hr />

<h1 id="ground">Ground</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_10.png" alt="bg left 70%" /></p>

<p>Connecting a conductor to the Earth\, called  <em>grounding</em> \, is a way of  <strong>redirecting</strong>  excess charge into a basically infinite  <em>sink</em>  for electrons</p>

<p>Grounding is done in both  <strong>electrostatics</strong>  and  <strong>electric</strong>   <strong>currents</strong>  to protect people and devices from unexpected/unwanted flows of charge</p>

<hr />

<h1 id="charge-by-induction">Charge by induction</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_11.png" alt="bg left 70%" /></p>

<p>One charged\, insulating sphere imbalances the charge in another</p>

<p>A ground is attached to the second sphere\, allowing the electrons to leave the sphere and travel to earth</p>

<p>The ground is removed\, leaving an excess of positive charge in the second sphere</p>

<hr />

<h1 id="me-bourgeois-no-no">Me? Bourgeois? No, no</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_12.png" alt="bg left 70%" /></p>

<p>Military commander until the French Revolution</p>

<p>Was called to systematize measures after Revolution</p>

<p>Discovered the  <strong>inverse</strong>   <strong>square</strong>  relationship between the  <strong>distances</strong>  of charges</p>

<p>Soon thereafter discovered a similar property of the magnetic force</p>

<p>Charles Augustin de Coulomb</p>

<p>1736 - 1806 CE</p>

<hr />

<h1 id="the-electric-force">The Electric Force</h1>

<p>Coulomb observed that two charged objects near each other experience  <strong>acceleration</strong></p>

<p>This acceleration is said to be due to the  <strong>Electric Force</strong></p>

<p>Coulomb observed that:</p>

<p>The  <strong>closer</strong>  two objects are together\, the  <strong>greater</strong>  is the force between them</p>

<p>The  <strong>stronger</strong>  the charge of the two objects\, the  <strong>greater</strong>  is the force between them</p>

<hr />

<h1 id="measuring-the-force">Measuring the force</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_13.png" alt="bg left 70%" /></p>

<p>Coulomb carefully  <strong>measured</strong>  the attractive force using a torsion balance</p>

<p>Two charges are  <strong>separated</strong> \, one an insulating rod suspended by silk</p>

<p>The attraction of the two is measured when the rod  <strong>twists</strong> \, and a reflected light wave measures the  <strong>angle</strong>  of the  <strong>displacement</strong></p>

<hr />

<h1 id="coulombs-law">Coulomb’s Law</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_14.png" alt="bg left 70%" /></p>

<p><strong>Coulomb’s Law</strong>  describes the relationship between the electric force\, charges\, and distances between the charges</p>

<p>The force is proportionate to the  <strong>charges</strong>  and inversely proportional to the  <strong>square</strong>  of the  <strong>distance</strong>  between them</p>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_15.png" alt="" /></p>

<hr />

<h1 id="coulombs-constant">Coulomb’s Constant</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_16.png" alt="bg left 70%" /></p>

<p>Coulomb found a  <em>constant of proportionality</em>  relating the force strength to the charges and distances</p>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_17.png" alt="" /></p>

<p>We can estimate this as:</p>

<hr />

<h1 id="coulombs-law-and-newtons-gravitation">Coulomb’s Law and Newton’s Gravitation</h1>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_18.png" alt="bg left 70%" /></p>

<p>Universal Constant</p>

<p>Product of Quantities</p>

<p>Inverse square (distances)</p>

<p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_19.png" alt="" /></p>

<p>The electric force can be attractive or repulsive;</p>

<p>Gravity is  <em>only ever attractive</em></p>

<hr />

    <h1 id="electric-fields">Electric Fields</h1>

    <p><img src="/img/0%20Lecture%20_%2010%20Electrostatics_24.png" alt="bg left 50%" /></p>

    <p>The fact that induction works without actually touching the two charged spheres together indicates that the electric force is a  <strong>field force</strong></p>

    <p>The balloon-on-hair demonstration shows that the electric force is  <strong>much</strong>   <strong>stronger</strong>  than the gravitational force</p>

    <p>The concept of a field helps explain how  <strong>forces __ can be exerted on objects at a  __distance</strong></p>

    <p>Even Newton was hesitant about this concept in his maths</p>

    <p>Electric fields can be thought as regions of  <strong>space</strong>  around a charged object</p>

    <p>When another charged object  <strong>enters</strong>  the field\,  <strong>forces</strong>  of an electrical nature arise</p>

    <p>The electric field strength can be calculated using a test charge\,  <em>q</em>  <em>0</em>  placed near a second object with larger charge\,  <em>Q</em></p>

    <p>Large test charges could redistribute charge in the source\, causing measurement errors</p>

    <p>Test charges are assumed to be  <strong>positive</strong>  and relatively small in charge</p>

    <hr />

    <p>The electric  <strong>field strength __ can be calculated using a  __test charge</strong> \,  <em>q</em>  <em>0</em>  placed near a second object with larger charge\,  <em>Q</em></p>
