<h1 id="11-electrodynamics">11 Electrodynamics</h1>
<p>High School Physics</p>

<hr />

<h2 id="electromagnetism-fundamentals">Electromagnetism Fundamentals</h2>

<ul>
  <li><strong>Light</strong>: range of electromagnetic radiation visible to the human eye</li>
  <li><strong>Electromagnetic Spectrum</strong>: range of all wavelengths/frequencies of electromagnetic radiation</li>
  <li><strong>Electromagnetic Radiation</strong>: waves produced by synchronization of oscillations between electric and magnetic fields
    <ul>
      <li>Caused by the movement (oscillations) of charged particles</li>
      <li>EM waves vary depending on frequency and wavelength</li>
      <li>Composed of oscillating, perpendicular electric and magnetic fields</li>
    </ul>
  </li>
  <li>All EM waves move at the speed of light
    <ul>
      <li>In a vacuum, c = 3.00 x 10^8 m/s</li>
    </ul>
  </li>
  <li>Wave directions of travel can be approximated as rays</li>
</ul>

<hr />

<h2 id="electric-potential--voltage-fundamentals">Electric Potential &amp; Voltage: Fundamentals</h2>

<ul>
  <li>When a force is applied to move an object, <strong>work</strong> is done on that object</li>
  <li>Work being done equals a <strong>change</strong> in the <strong>energy</strong> of the object</li>
  <li><strong>Electric Potential</strong>: energy that a charged object has because of its shape and position in an electric field</li>
  <li>Electric potential energy (PE_electric) in a uniform field depends on:
    <ul>
      <li>The charge (<em>q</em>)</li>
      <li>Strength of the field (<em>E</em>)</li>
      <li>Displacement (<em>d</em>)</li>
    </ul>
  </li>
</ul>

<p>[PE_{electric}=\,-q\cdot \overrightarrow{E}\cdot d]</p>

<p>[\text{electric}\;\text{potential}\;=\,\frac{\text{electric}\;\text{potential}\;\text{energy}}{\text{charge}}]</p>

<hr />

<h2 id="electric-potential--displacement">Electric Potential &amp; Displacement</h2>

<ul>
  <li>The displacement, <em>d</em>, is generally chosen as movement in the direction of the field</li>
  <li>Potential difference: measure of potential energy at two different locations in a field
    <ul>
      <li>Represents energy a particle would gain or lose by traveling between positions</li>
    </ul>
  </li>
  <li>The amount of <strong>work</strong> done by a field to move a charge equals the negative of the change in potential energy</li>
</ul>

<p>[W\,=\,\overrightarrow{F}\cdot d=\,q\cdot E\cdot d]</p>

<p>[\text{work}\;=\text{force}\;\times\text{displacement}\;\text{=}\;\text{charge}\;\times\text{field}\;\text{strength}\;\times\text{displacement}]</p>

<hr />

<h2 id="electric-potential-concepts">Electric Potential Concepts</h2>

<ul>
  <li>An electric potential <em>exists at some point in an electric field whether or not there is another charge at that point</em></li>
  <li>The negative sign indicates that electrical potential energy:
    <ul>
      <li><strong>Increases</strong> if the charge is <strong>negative</strong></li>
      <li><strong>Decreases</strong> if the charge is <strong>positive</strong></li>
    </ul>
  </li>
  <li>When electric force does positive work on a charge:
    <ul>
      <li>Kinetic energy increases</li>
      <li>Potential energy decreases</li>
    </ul>
  </li>
  <li><strong>Electric potential <em>(V)</em></strong> is the amount of potential energy per unit charge</li>
  <li>Unit: <em>Joule</em> per Coulomb = Volt (V)</li>
</ul>

<hr />

<h2 id="understanding-potential-difference">Understanding Potential Difference</h2>

<p>[\Delta V\,=\,\frac{\Delta PE}{q}]</p>

<p>[\text{electric}\;\text{potential}\;\text{=}\;\frac{\text{potential}\;\text{electrical}\;\text{energy}}{\text{charge}}]</p>

<ul>
  <li>The charge in this case is the charge creating the field, not the test charge</li>
  <li>SI unit for potential difference: <strong>volt (V)</strong>
    <ul>
      <li>1 volt = 1 joule per coulomb</li>
    </ul>
  </li>
</ul>

<p>[1\,\text{Volt}\,=\,\frac{1\,Joule}{1\,Coulomb}]</p>

<p>[\text{Voltage}\;\text{=}\;\frac{\text{Energy}\;\text{(J)}}{\text{Charge}\;\text{(C)}}]</p>

<hr />

<h2 id="voltage-and-electric-field-relationship">Voltage and Electric Field Relationship</h2>

<ul>
  <li>V (regular) stands for volts, the unit of potential</li>
  <li><em>V</em> (italics) stands for voltage, the electric potential itself</li>
  <li>As a charge of 1 C (1.6x10^-19 electrons) moves through a potential difference of 1 V, the charge gains 1 Joule of energy</li>
</ul>

<p>[\Delta V=-E\cdot d]</p>

<p>[\text{potential}\;\text{difference}\;\text{=}\;\left(\text{magnitude}\;\text{of}\;\text{electric}\;\text{field}\right)\times\left(\text{displacement}\right)]</p>

<p><em>d is displacement parallel to the field</em></p>

<hr />

<!-- _class: title -->
<h2 id="the-history-of-batteries">The History of Batteries</h2>

<hr />

<h2 id="luigi-galvanis-discoveries">Luigi Galvani’s Discoveries</h2>

<ul>
  <li>Around 1791, Luigi Galvani found that frog legs could twitch if:
    <ul>
      <li>Static electricity was applied to them</li>
      <li>They were injected with mixtures of metals</li>
    </ul>
  </li>
  <li>Galvani assumed that the metals acted like conductors for the frog’s “life force”</li>
</ul>

<hr />

<h2 id="alessandro-voltas-contributions">Alessandro Volta’s Contributions</h2>

<ul>
  <li>Volta was skeptical of Galvani’s explanation</li>
  <li>He predicted that metals were the source of electricity, and frog tissues merely conducted it</li>
  <li>He demonstrated that frog legs are sensitive instruments for detecting <em>electromotive force</em> (voltage)</li>
  <li>To test his hypothesis, Volta created the first battery:
    <ul>
      <li>Placed discs of zinc and silver in columns</li>
      <li>Separated them by cloth/paper soaked in salt or acid</li>
      <li>These “piles” or “batteries” produced much larger potential difference than static electricity</li>
      <li>The voltage was strong enough to create sparks</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="how-batteries-work">How Batteries Work</h2>

<ul>
  <li>An <strong>electric battery</strong> transforms chemical energy into electric energy</li>
  <li>Structure:
    <ul>
      <li>Two <strong>electrodes</strong> made of different materials</li>
      <li>Immersed in a solution or paste (<strong>electrolyte</strong>)</li>
      <li>This assembly is called a <strong>cell</strong> (batteries have one or more cells)</li>
    </ul>
  </li>
  <li>Operation:
    <ul>
      <li>Electrolyte dissolves one electrode, releasing electrons and positive ions</li>
      <li>Solution attracts electrons from other electrode, creating positive charge</li>
      <li>When connected by a conductor, continuous flow of electrons occurs</li>
      <li>Voltage depends on electrode materials and their reaction with the acid</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="battery-connections">Battery Connections</h2>

<ul>
  <li>Multiple cells can be connected in series:
    <ul>
      <li>Connect positive terminal of one to negative terminal of another</li>
      <li>Combined voltage is the algebraic sum of individual cell voltages</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="voltage-the-driving-force">Voltage: The Driving Force</h2>

<ul>
  <li>Also known as electric potential difference</li>
  <li>Measures electric potential energy per unit charge between two points in a circuit</li>
  <li>Acts as the “push” that drives electric charge through a conductor</li>
  <li>Provides the energy needed for charges to move or flow (similar to water pressure)</li>
  <li>Measured in <strong>volts (V)</strong></li>
</ul>

<p>[1\,\text{V}=1\frac{\,\text{J}}{\text{C}}]</p>

<p>[\text{voltage}\;\text{=}\;\frac{\text{energy}}{\text{charge}}]</p>

<hr />

<h2 id="electric-current-fundamentals">Electric Current Fundamentals</h2>

<ul>
  <li><strong>Electric current</strong> (<em>I</em>): the <strong>rate</strong> of <strong>flow</strong> of electric charge through a <strong>conductor</strong> in a <strong>circuit</strong></li>
  <li>Measured in <strong>amperes (A)</strong></li>
</ul>

<p>[1\,A\,=\,1\,\frac{\,C}{s}]</p>

<p>[\text{amperage}\;\text{=}\;\frac{\text{charge}}{\text{time}}]</p>

<ul>
  <li>The flow of charge through a conductor resembles water flowing through a pipe</li>
  <li>Conventional current direction: positive charge flow (historical convention)
    <ul>
      <li>Positive conventional current flows from high to low potential</li>
      <li>In a wire, electrons actually flow in the opposite direction</li>
    </ul>
  </li>
</ul>

<hr />

<!-- _class: title -->
<h2 id="ohms-law">Ohm’s Law</h2>

<hr />

<h2 id="resistance-concepts">Resistance Concepts</h2>

<ul>
  <li><strong>Resistance</strong> (R): measures how much a material opposes current flow</li>
  <li>Measured in <strong>ohms (Ω)</strong></li>
  <li>Analogous to a narrow pipe restricting water flow or a thumb over a hose</li>
  <li>Resistance of a device is defined by Ohm’s Law:</li>
</ul>

<p>[V\,=\,IR]</p>

<p>[\text{voltage}\;\text{=}\;\text{current}\,\times\,\text{resistance}]</p>

<ul>
  <li>Resistance in a circuit depends on:
    <ul>
      <li>Length of conductor</li>
      <li>Cross-sectional area</li>
      <li>Temperature</li>
      <li>Material properties</li>
    </ul>
  </li>
</ul>

<hr />

<!-- _class: title -->
<h2 id="electric-power">Electric Power</h2>

<hr />

<h2 id="power-calculations">Power Calculations</h2>

<ul>
  <li>Electrical power: rate at which electrical energy is converted to another form
    <ul>
      <li>Heat, light, motion, etc.</li>
    </ul>
  </li>
  <li>Measured in watts (W)</li>
  <li>Calculation methods:</li>
</ul>

<p>(P\,=\,IV)
(\text{power}\;\text{=}\;\text{current}\;\times\text{voltage}\;)</p>

<ul>
  <li>From Ohm’s Law:</li>
</ul>

<p>(P\,=\,I^{2}\cdot R)
(\text{power}\;\text{=}\;\text{current}^{2\,}\times \text{resistance}\;)</p>

<p>(P\,=\,\frac{V^{2}}{R})
(\text{power}\;\text{=}\;\frac{\text{voltage}^{2}}{\text{resistance}\;})</p>

<hr />

<h2 id="historical-context">Historical Context</h2>

<ul>
  <li><strong>Luigi Galvani (1737–1798)</strong>
    <ul>
      <li>Italian physician and physicist</li>
      <li>Pioneered bioelectricity research</li>
      <li>Discovered frog muscle twitching with metal contact</li>
      <li>Proposed “animal electricity”</li>
    </ul>
  </li>
  <li><strong>Alessandro Volta (1745–1827)</strong>
    <ul>
      <li>Italian physicist</li>
      <li>Challenged Galvani’s theory</li>
      <li>Showed metals were the electricity source</li>
      <li>Invented voltaic pile (first chemical battery)</li>
    </ul>
  </li>
  <li><strong>Georg Simon Ohm (1789–1854)</strong>
    <ul>
      <li>German physicist</li>
      <li>Formulated Ohm’s Law relating voltage, current, and resistance</li>
      <li>Foundation for understanding electric current behavior</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="energy-in-batteries">Energy in Batteries</h2>

<ul>
  <li>Energy stored in a battery:
    <ul>
      <li>Formula: $E = Q \cdot V$</li>
      <li>$Q$ = total charge stored</li>
      <li>$V$ = potential difference provided</li>
      <li>Measured in joules (J)</li>
    </ul>
  </li>
  <li>Electric potential energy (PEE):
    <ul>
      <li>Energy associated with charge position in electric field</li>
      <li>Measured in joules (J)</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="current-and-charge-relationships">Current and Charge Relationships</h2>

<ul>
  <li>Electric current is the flow of electric charge</li>
  <li>Total charge passing through a circuit:
    <ul>
      <li>$Q = I \cdot t$</li>
      <li>$I$ = current</li>
      <li>$t$ = time</li>
      <li>Charge measured in coulombs (C)</li>
    </ul>
  </li>
  <li>Voltage drop across a resistor:
    <ul>
      <li>Using Ohm’s Law: $V = I \cdot R$</li>
      <li>$V$ = voltage drop</li>
      <li>$I$ = current</li>
      <li>$R$ = resistance</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="resistors-and-their-function">Resistors and Their Function</h2>

<ul>
  <li><strong>Resistors</strong>: passive components introducing resistance into circuits</li>
  <li><strong>Ohm’s Law</strong>: current is proportional to voltage and inversely proportional to resistance</li>
  <li>
    <p>Resistance calculation: $R = V / I$</p>
  </li>
  <li>Functions of resistors:
    <ul>
      <li>Regulate/limit electric current flow</li>
      <li>Control amount of current passing through</li>
      <li>Reduce current flow</li>
      <li>Divide voltage</li>
      <li>Provide specific voltage drop</li>
      <li>Common applications: LED brightness control, amplifier gain setting, transistor biasing</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="electrical-power-and-appliances">Electrical Power and Appliances</h2>

<ul>
  <li><strong>Electrical power</strong>: rate of energy transfer/conversion</li>
  <li>Formula: $P = V \cdot I$</li>
  <li>
    <p>Measured in watts (W)</p>
  </li>
  <li>Common energy conversions in appliances:
    <ul>
      <li>Light bulbs: Electrical → light + heat</li>
      <li>Heaters: Electrical → heat</li>
      <li>Motors: Electrical → mechanical (rotation, movement)</li>
    </ul>
  </li>
  <li>Power consumption depends on voltage and current requirements</li>
  <li>Higher power ratings = more energy required to operate</li>
</ul>

<hr />

<h2 id="power-consumption-calculations">Power Consumption Calculations</h2>

<ul>
  <li>To determine power consumed:
    <ul>
      <li>Multiply voltage across device by current flowing through it</li>
      <li>$P = V \cdot I$</li>
    </ul>
  </li>
  <li>Understanding these principles provides foundation for:
    <ul>
      <li>Electric potential energy</li>
      <li>Voltage</li>
      <li>Current</li>
      <li>Resistance</li>
      <li>Power in high school physics</li>
    </ul>
  </li>
</ul>

<hr />
