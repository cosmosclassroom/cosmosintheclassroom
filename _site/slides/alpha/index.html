<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alpha</title>
  <link rel="stylesheet" href="/assets/reveal.js/css/reveal.css">
  <link rel="stylesheet" href="/assets/reveal.js/css/theme/black.css">
  <style>
    /* Marp slide styles */
    section {
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 2em;
    }
    h1, h2, h3 {
      margin: 0.5em 0;
    }
    p {
      margin: 1em 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML"></script>
  <script>
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    });
  </script>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <hr />

<h1 id="marp">Marp</h1>

<h2 id="this-is-h2-in-marp">This is H2 in Marp</h2>

<p>This is body text in the first slide</p>

<hr />

<h1 id="second-slide">Second Slide</h1>

<h2 id="second-header-on-second-slide">Second Header on Second Slide</h2>

<p>Second slide’s body text in /slides/alpha.md</p>

    </div>
  </div>
  <script src="/assets/reveal.js/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      hash: true, // Enable URL hash for navigation
      slideNumber: true, // Show slide numbers
      controls: true, // Show navigation controls
      progress: true, // Show progress bar
      transition: 'slide', // Slide transition effect
      math: {
        mathjax: 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js',
        config: 'TeX-AMS_HTML-full'
      }
    });
  </script>
</body>
</html>
