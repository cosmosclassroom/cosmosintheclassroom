<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Slide</title>
  <link rel="stylesheet" href="/assets/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="/assets/reveal.js/dist/theme/black.css" id="theme">
  <link rel="stylesheet" href="/assets/reveal.js/plugin/highlight/monokai.css">
  
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <h1 id="h1">H1</h1>

<h2 id="h2">H2</h2>

<p>Text</p>

<hr />

<h1 id="h1-again">H1 Again</h1>

<h2 id="h2-1">H2</h2>

<p>This is more text and $latex$</p>

<hr />

    </div>
  </div>
  
  <script src="/assets/reveal.js/dist/reveal.js"></script>
  <script src="/assets/reveal.js/plugin/markdown/markdown.js"></script>
  <script src="/assets/reveal.js/plugin/highlight/highlight.js"></script>
  <script src="/assets/reveal.js/plugin/math/math.js"></script>
  <script src="/assets/reveal.js/plugin/notes/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      controls: true,
      progress: true,
      history: true,
      center: true,
      slideNumber: true,
      transition: 'slide',
      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath ]
    });
  </script>
</body>
</html>
