<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <link rel="stylesheet" href="/assets/reveal.js/css/reveal.css">
  <link rel="stylesheet" href="/assets/reveal.js/css/theme/black.css">
  <style>
    /* Marp slide styles */
    section {
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 2em;
    }
    h1, h2, h3 {
      margin: 0.5em 0;
    }
    p {
      margin: 1em 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML"></script>
  <script>
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    });
  </script>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <hr />

<h2 id="heading-2">Heading 2</h2>

<p>This is the text</p>

<ul>
  <li>this text is added as a fragment</li>
  <li>so is this one</li>
</ul>

<hr />

<h1 id="heading-1">Heading 1</h1>
<p>This is the second slide’s text</p>

<p>$This is inline latex$</p>

\[\text{this is doubled latex} \, f = m \cdot a_g\]

<hr />

<p>Here is more text</p>

<hr />

<h1 id="there-is-another-header-here">There is another header here</h1>

<h2 id="and-a-subheader-for-flavor">And a subheader for flavor</h2>

<p><img src="#and-a-subheader-for-flavor" alt="Link" /></p>

    </div>
  </div>
  <script src="/assets/reveal.js/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      hash: true, // Enable URL hash for navigation
      slideNumber: true, // Show slide numbers
      controls: true, // Show navigation controls
      progress: true, // Show progress bar
      transition: 'slide', // Slide transition effect
      math: {
        mathjax: 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js',
        config: 'TeX-AMS_HTML-full'
      }
    });
  </script>
</body>
</html>
