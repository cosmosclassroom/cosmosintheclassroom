<h2 id="introduction-to-electrostatics">Introduction to Electrostatics</h2>

<ul>
  <li><strong>Electric charge</strong>: a fundamental property of matter</li>
  <li>Historical understanding:
    <ul>
      <li>Ancient Greeks noticed amber attracting objects when rubbed</li>
      <li>“Electron” comes from Greek word for amber (ήλεκτρον)</li>
      <li>Benjamin Franklin proposed positive and negative charges (1700s)</li>
    </ul>
  </li>
</ul>

<div class="important-info">

  <ul>
    <li>Two types of charge: <strong>positive</strong> (+) and <strong>negative</strong> (-)</li>
    <li>Charge is <strong>conserved</strong>: cannot be created or destroyed, only transferred</li>
    <li>SI unit: <strong>coulomb</strong> (C) - a very large amount of charge!</li>
  </ul>

</div>

<hr />

<h2 id="properties-of-electric-charge">Properties of Electric Charge</h2>

<div class="important-info">

  <ul>
    <li><strong>Quantization</strong>: Charge comes in discrete “packets”
      <ul>
        <li>Elementary charge: $e = 1.602 \times 10^{-19}$ C</li>
        <li>All charges are multiples of $e$: $q = ne$ where $n$ is an integer</li>
      </ul>
    </li>
    <li>
      <p><strong>Conservation</strong>: Total charge in an isolated system remains constant</p>
    </li>
    <li><strong>Attraction &amp; Repulsion</strong>:
      <ul>
        <li>Like charges repel: (+)(+) or (-)(-)</li>
        <li>Unlike charges attract: (+)(-)</li>
      </ul>
    </li>
  </ul>

</div>

<ul>
  <li><strong>Charging methods</strong>: friction, contact, induction</li>
</ul>

<hr />

<h2 id="charging-methods-demonstrated">Charging Methods Demonstrated</h2>

<p><img src="img/8_em-wave-particle/charging_methods.jpg" alt="width:800px" /></p>

<ul>
  <li><strong>Friction</strong>: Transfer of electrons by rubbing materials (balloon on hair)</li>
  <li><strong>Contact</strong>: Charge flows when objects touch (charging a metal sphere)</li>
  <li><strong>Induction</strong>: Separation of charge without contact (charged rod near metal)</li>
</ul>

<hr />

<h2 id="conductors-vs-insulators">Conductors vs. Insulators</h2>

<table>
  <thead>
    <tr>
      <th>Property</th>
      <th>Conductors</th>
      <th>Insulators</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Electron mobility</td>
      <td>High</td>
      <td>Low</td>
    </tr>
    <tr>
      <td>Examples</td>
      <td>Metals, graphite</td>
      <td>Plastic, rubber, glass</td>
    </tr>
    <tr>
      <td>Charge distribution</td>
      <td>Spreads over surface</td>
      <td>Stays localized</td>
    </tr>
    <tr>
      <td>Electron configuration</td>
      <td>Many free electrons</td>
      <td>Tightly bound electrons</td>
    </tr>
  </tbody>
</table>

<p><img src="img/8_em-wave-particle/conductor_insulator.png" alt="width:500px" /></p>

<hr />

<h2 id="conductors-vs-insulators-applications">Conductors vs. Insulators: Applications</h2>

<p><img src="img/8_em-wave-particle/conductor_applications.jpg" alt="width:700px" /></p>

<ul>
  <li><strong>Conductors</strong>:
    <ul>
      <li>Wiring in electronics</li>
      <li>Lightning rods</li>
      <li>Electrostatic shielding (Faraday cages)</li>
    </ul>
  </li>
  <li><strong>Insulators</strong>:
    <ul>
      <li>Rubber gloves for electrical work</li>
      <li>Plastic coatings on wires</li>
      <li>Electrostatic charge storage</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="coulombs-law">Coulomb’s Law</h2>

<div class="important-info">

  <ul>
    <li>Describes force between two charged particles</li>
    <li>
      <p>Mathematical form: $F = k \frac{q_1 q_2}{r^2}$</p>
    </li>
    <li>Where:
      <ul>
        <li>$F$ = electric force (newtons, N)</li>
        <li>$k$ = Coulomb constant = $8.99 \times 10^9$ N·m²/C²</li>
        <li>$q_1, q_2$ = charges (coulombs, C)</li>
        <li>$r$ = distance between charges (meters, m)</li>
      </ul>
    </li>
    <li><strong>Vector nature</strong>: Force acts along line joining charges</li>
    <li>Similar to Newton’s gravitational law: $F = G \frac{m_1 m_2}{r^2}$</li>
  </ul>

</div>

<hr />

<h2 id="coulombs-law-force-direction">Coulomb’s Law: Force Direction</h2>

<p><img src="img/8_em-wave-particle/coulomb_force_direction.png" alt="width:700px" /></p>

<div class="important-info">

  <ul>
    <li>Force direction depends on charge signs:
      <ul>
        <li>Like charges: Force is repulsive (away from each other)</li>
        <li>Unlike charges: Force is attractive (toward each other)</li>
      </ul>
    </li>
    <li><strong>Remember</strong>: The force acts along the line joining the charges</li>
    <li>Each charge experiences equal and opposite force (Newton’s 3rd Law)</li>
  </ul>

</div>

<hr />

<h2 id="working-with-coulombs-law-example">Working with Coulomb’s Law: Example</h2>

<p><strong>Problem</strong>: Two charges, $q_1 = +3.0 \times 10^{-6}$ C and $q_2 = -2.0 \times 10^{-6}$ C, are 0.15 m apart. Find the electric force.</p>

<div class="important-info">

  <p><strong>Solution</strong>:</p>
  <ol>
    <li>Identify what you know:
      <ul>
        <li>$q_1 = +3.0 \times 10^{-6}$ C</li>
        <li>$q_2 = -2.0 \times 10^{-6}$ C</li>
        <li>$r = 0.15$ m</li>
        <li>$k = 8.99 \times 10^9$ N·m²/C²</li>
      </ul>
    </li>
    <li>
      <p>Apply Coulomb’s Law:
$F = k \frac{q_1 q_2}{r^2} = 8.99 \times 10^9 \cdot \frac{(3.0 \times 10^{-6})(-2.0 \times 10^{-6})}{(0.15)^2}$</p>
    </li>
    <li>Calculate: $F = -2.4 \times 10^{-1}$ N (negative means attractive)</li>
  </ol>

</div>

<hr />

<h2 id="multiple-charge-interactions">Multiple Charge Interactions</h2>

<div class="important-info">

  <ul>
    <li>When multiple charges are present, find the <strong>net force</strong> using:
      <ol>
        <li>Calculate force from each charge separately</li>
        <li>Remember each force is a <strong>vector</strong></li>
        <li>Add all forces <strong>vectorially</strong> (using components)</li>
      </ol>
    </li>
    <li>This is called the <strong>Principle of Superposition</strong></li>
    <li>Net force: $\vec{F}_{net} = \vec{F}_1 + \vec{F}_2 + \vec{F}_3 + …$</li>
  </ul>

</div>

<hr />

<h2 id="principle-of-superposition-example">Principle of Superposition: Example</h2>

<p><img src="img/8_em-wave-particle/superposition_example.png" alt="width:500px" /></p>

<div class="important-info">

  <p><strong>Problem</strong>: Three charges form a right triangle. Find the net force on $q_3$.</p>

  <p><strong>Solution</strong>:</p>
  <ol>
    <li>Find force from $q_1$ on $q_3$: $\vec{F}_{13}$</li>
    <li>Find force from $q_2$ on $q_3$: $\vec{F}_{23}$</li>
    <li>Add vectorially: $\vec{F}<em>{net} = \vec{F}</em>{13} + \vec{F}_{23}$
      <ul>
        <li>Use components: $F_x = F_{13x} + F_{23x}$ and $F_y = F_{13y} + F_{23y}$</li>
        <li>Find magnitude: $F_{net} = \sqrt{F_x^2 + F_y^2}$</li>
        <li>Find direction: $\theta = \tan^{-1}(\frac{F_y}{F_x})$</li>
      </ul>
    </li>
  </ol>

</div>

<hr />

<h2 id="equilibrium-positions">Equilibrium Positions</h2>

<div class="important-info">

  <ul>
    <li><strong>Equilibrium</strong>: Position where net force on a charge is zero</li>
    <li>For two charges:
      <ul>
        <li>Like charges: No equilibrium position exists</li>
        <li>Unlike charges: Equilibrium exists only at the position of one charge</li>
      </ul>
    </li>
    <li>For three or more charges:
      <ul>
        <li>Equilibrium positions can exist at specific locations</li>
        <li>Finding them requires solving: $\vec{F}_{net} = \vec{0}$</li>
      </ul>
    </li>
  </ul>

</div>

<hr />

<h2 id="electric-fields">Electric Fields</h2>

<div class="important-info">

  <ul>
    <li><strong>Electric field</strong>: A region where electric charges experience force</li>
    <li>Defined as force per unit charge: $\vec{E} = \frac{\vec{F}}{q}$</li>
    <li>Field from a point charge: $\vec{E} = k \frac{Q}{r^2} \hat{r}$
      <ul>
        <li>$Q$ = source charge</li>
        <li>$\hat{r}$ = unit vector pointing away from the charge</li>
        <li>$r$ = distance from charge</li>
      </ul>
    </li>
    <li>SI unit: newtons per coulomb (N/C) or volts per meter (V/m)</li>
    <li>Electric fields exist even in “empty” space!</li>
  </ul>

</div>

<hr />

<h2 id="electric-field-visualization">Electric Field Visualization</h2>

<p><img src="img/8_em-wave-particle/field_lines.png" alt="width:700px" /></p>

<div class="important-info">

  <ul>
    <li>Field lines show direction a positive test charge would move</li>
    <li>Lines point away from positive charges</li>
    <li>Lines point toward negative charges</li>
    <li>Line density indicates field strength</li>
    <li>Lines never cross</li>
  </ul>

</div>

<hr />

<h2 id="electric-field-properties">Electric Field Properties</h2>

<div class="important-info">

  <ul>
    <li>Field strength decreases with squared distance: $E \propto \frac{1}{r^2}$</li>
    <li>Field direction:
      <ul>
        <li>Away from positive charges</li>
        <li>Toward negative charges</li>
      </ul>
    </li>
    <li>Superposition applies:
      <ul>
        <li>$\vec{E}_{net} = \vec{E}_1 + \vec{E}_2 + \vec{E}_3 + …$</li>
        <li>Calculate each field separately, then add vectorially</li>
      </ul>
    </li>
  </ul>

</div>

<hr />

<h2 id="electric-fields-from-charge-distributions">Electric Fields from Charge Distributions</h2>

<p><img src="img/8_em-wave-particle/charge_distributions.jpg" alt="width:500px" /></p>

<div class="important-info">

  <table>
    <thead>
      <tr>
        <th>Configuration</th>
        <th>Electric Field</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Point charge</td>
        <td>$E = k\frac{Q}{r^2}$</td>
      </tr>
      <tr>
        <td>Infinite line of charge</td>
        <td>$E = \frac{2k\lambda}{r}$</td>
      </tr>
      <tr>
        <td>Infinite plane</td>
        <td>$E = \frac{\sigma}{2\varepsilon_0}$ (constant)</td>
      </tr>
      <tr>
        <td>Inside conducting sphere</td>
        <td>E = 0</td>
      </tr>
    </tbody>
  </table>

</div>

<hr />

<h2 id="forces-on-charges-in-electric-fields">Forces on Charges in Electric Fields</h2>

<div class="important-info">

  <ul>
    <li>Force on a charge in an electric field: $\vec{F} = q\vec{E}$</li>
    <li>Direction depends on charge sign:
      <ul>
        <li>Positive charge: Force in same direction as E-field</li>
        <li>Negative charge: Force in opposite direction to E-field</li>
      </ul>
    </li>
  </ul>

</div>

<ul>
  <li>Applications:
    <ul>
      <li>Cathode ray tubes (old TVs)</li>
      <li>Mass spectrometers</li>
      <li>Inkjet printers</li>
      <li>Electrostatic precipitators</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="motion-in-electric-fields-example">Motion in Electric Fields: Example</h2>

<div class="important-info">

  <p><strong>Problem</strong>: An electron enters a uniform electric field of 2.0 × 10⁴ N/C pointing right. What acceleration does it experience?</p>

  <p><strong>Solution</strong>:</p>
  <ol>
    <li>
      <p>Find the force: $F = qE = (-1.6 × 10^{-19} \text{ C})(2.0 × 10^4 \text{ N/C})$
$F = -3.2 × 10^{-15} \text{ N}$ (negative means left)</p>
    </li>
    <li>
      <p>Apply Newton’s 2nd Law: $a = \frac{F}{m} = \frac{-3.2 × 10^{-15} \text{ N}}{9.11 × 10^{-31} \text{ kg}}$
$a = -3.5 × 10^{15} \text{ m/s}^2$ (left)</p>
    </li>
  </ol>

  <p>The electron accelerates rapidly to the left (opposite to E-field).</p>

</div>

<hr />

<h2 id="comparing-electric-and-gravitational-forces">Comparing Electric and Gravitational Forces</h2>

<p><img src="img/8_em-wave-particle/force_comparison.png" alt="width:600px" /></p>

<div class="important-info">

  <ul>
    <li>Both follow inverse-square law</li>
    <li>Electric force is <strong>much stronger</strong>!</li>
  </ul>

  <p>Example: Electron and proton in hydrogen atom</p>
  <ul>
    <li>Electric: $F_e = k\frac{e^2}{r^2} = 8.2 × 10^{-8} \text{ N}$</li>
    <li>Gravitational: $F_g = G\frac{m_em_p}{r^2} = 3.6 × 10^{-47} \text{ N}$</li>
    <li>Ratio: $\frac{F_e}{F_g} ≈ 2.3 × 10^{39}$ (39 orders of magnitude!)</li>
  </ul>

</div>

<hr />

<h2 id="charge-equilibrium">Charge Equilibrium</h2>

<div class="important-info">

  <ul>
    <li><strong>Static equilibrium</strong>: Net force on charge is zero</li>
    <li><strong>Stable equilibrium</strong>: Returns to position when disturbed</li>
    <li>
      <p><strong>Unstable equilibrium</strong>: Moves away when disturbed</p>
    </li>
    <li>Finding equilibrium positions:
      <ol>
        <li>Set up Coulomb’s Law equations for all forces</li>
        <li>Set net force equal to zero</li>
        <li>Solve for position coordinates</li>
      </ol>
    </li>
  </ul>

</div>

<hr />

<h2 id="charge-equilibrium-example">Charge Equilibrium: Example</h2>

<p><img src="img/8_em-wave-particle/equilibrium_example.png" alt="width:500px" /></p>

<div class="important-info">

  <p><strong>Problem</strong>: Two +1.0 μC charges are fixed 10 cm apart. Where should a -1.0 μC charge be placed to be in equilibrium?</p>

  <p><strong>Solution</strong>:</p>
  <ul>
    <li>By symmetry: The negative charge must be somewhere on the line connecting the positive charges</li>
    <li>Let’s place positive charges at x = 0 and x = 10 cm</li>
    <li>For equilibrium, forces from both positive charges must be equal and opposite</li>
    <li>This occurs at x = 5 cm (midpoint)</li>
    <li>But this is an <strong>unstable equilibrium</strong>!</li>
  </ul>

</div>
