<h2 id="electromagnetic-waves">Electromagnetic Waves</h2>

<p>Now we encounter <strong>electromagnetic waves</strong> that don’t need a medium!</p>
<ul>
  <li>These waves show a mysterious <strong>dual nature</strong>:
    <ul>
      <li>Sometimes act as waves (interference, diffraction)</li>
      <li>Sometimes act as particles (photons)</li>
    </ul>
  </li>
  <li>This duality is fundamental to modern technology:
    <ul>
      <li>Solar panels</li>
      <li>Digital cameras</li>
      <li>Fiber optic communications</li>
    </ul>
  </li>
</ul>

<h2 id="the-electromagnetic-spectrum">The Electromagnetic Spectrum</h2>

<p><img src="https://science.nasa.gov/wp-content/uploads/2023/06/em_spectrum.jpeg" alt="width:800px" /></p>

<div class="important-info">

  <p>All electromagnetic waves travel at <strong>speed of light</strong></p>

  <p>[c = 3.00 \times 10^8\,m/s]</p>

  <p>Relationship: $c = f\lambda$</p>
  <ul>
    <li>where $f$ is frequency and $\lambda$ is wavelength</li>
    <li>Higher frequency = shorter wavelength = more energy per photon</li>
  </ul>
</div>

&lt;ul&gt;
  &lt;li&gt;It creates alternating bright and dark bands (interference pattern)&lt;/li&gt;
  &lt;li&gt;Bright bands occur where waves combine &lt;strong&gt;constructively&lt;/strong&gt;&lt;/li&gt;

  &lt;/li&gt;
  &lt;li&gt;This pattern can only be explained if light behaves as a &lt;strong&gt;wave&lt;/strong&gt;!&lt;/li&gt;
&lt;/ul&gt;

<h2 id="wave-properties-of-light">Wave Properties of Light</h2>

<p><img src="https://upload.wikimedia.org/wikipedia/commons/c/c5/Young%27s_Double_Slit_Experiment.svg" alt="width:500px" /></p>

<ul>
  <li>Light creates <strong>interference patterns</strong> when passing through slits</li>
  <li>Thomas Young’s double-slit experiment (1801) demonstrated wave nature</li>
</ul>

<div class="important-info">
  <p>Mathematical relationship for double-slit interference:</p>

  <p>[d \sin \theta = m\lambda]</p>

  <ul>
    <li>$d$ = slit separation</li>
    <li>$\theta$ = angle to maximum</li>
    <li>$m$ = order number (0, 1, 2…)</li>
    <li>$\lambda$ = wavelength</li>
  </ul>
</div>

<hr />

<h2 id="light-as-energy-transport">Light as Energy Transport</h2>

<ul>
  <li>Waves carry energy without transferring matter</li>
</ul>

<div class="important-info">
  <ul>
    <li>For all waves, intensity is proportional to amplitude squared:</li>
  </ul>

  <p>[I \propto A^2]</p>

</div>

<p>For electromagnetic waves: $I = \frac{1}{2}\varepsilon_0 E_0^2 c$</p>
<ul>
  <li>$\varepsilon_0$ = permittivity of free space</li>
  <li>$E_0$ = electric field amplitude</li>
  <li>
    <p>$c$ = speed of light</p>
  </li>
  <li>A bright light bulb (100W) emits about $10^{20}$ photons/second!</li>
</ul>

<hr />

<h2 id="electric-and-magnetic-field-components">Electric and Magnetic Field Components</h2>

<p><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Onde_electromagnetique.svg/1920px-Onde_electromagnetique.svg.png" alt="width:600px" /></p>

<ul>
  <li>EM waves consist of <strong>oscillating electric and magnetic fields</strong></li>
  <li>
    <p>Fields are <strong>perpendicular</strong> to each other and to direction of travel</p>
  </li>
  <li>The fields follow the relationship:</li>
</ul>

<p>(E = cB)</p>
<div class="important-info">

  <ul>
    <li>These oscillating fields <strong>self-sustain</strong> each other:
      <ul>
        <li>Changing electric field creates magnetic field</li>
        <li>Changing magnetic field creates electric field</li>
      </ul>
    </li>
  </ul>
</div>

<hr />

<h2 id="the-particle-nature-of-light">The Particle Nature of Light</h2>

<ul>
  <li><strong>Newton vs. Huygens debate</strong> (1600s-1700s):
    <ul>
      <li>Newton: light is particles (“corpuscles”)</li>
      <li>Huygens: light is waves</li>
    </ul>
  </li>
  <li>The <strong>photoelectric effect</strong> (observed late 1800s):
    <ul>
      <li>Light shining on metal causes electron emission</li>
      <li>But doesn’t follow wave predictions!</li>
    </ul>
  </li>
  <li><strong>Einstein’s explanation</strong> (1905):
    <ul>
      <li>Light consists of discrete packets (photons)</li>
      <li>Each photon carries a specific amount of energy</li>
      <li>Won Nobel Prize for this work in 1921</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="photoelectric-effect-evidence-for-photons">Photoelectric Effect: Evidence for Photons</h2>
<!-- _class="column" -->

<div style="column">
  <div>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;p&gt;&lt;img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Photoelectric_effect_in_a_solid_-_diagram.svg/1280px-Photoelectric_effect_in_a_solid_-_diagram.svg.png" alt="bg left" /&gt;&lt;/p&gt;

&lt;div class="important-info"&gt;

  &lt;p&gt;Only explained by &lt;strong&gt;photons&lt;/strong&gt; with $E = hf$&lt;/p&gt;

&lt;/div&gt;

&lt;ul&gt;
  &lt;li&gt;Wave theory prediction: Higher intensity = higher energy electrons&lt;/li&gt;
  &lt;li&gt;Actual observation: Higher frequency = higher energy electrons&lt;/li&gt;
&lt;/ul&gt;
</code></pre></div>    </div>

  </div>

<h2 id="photon-energy">Photon Energy</h2>
<ul>
  <li>There is a <strong>threshold frequency</strong> below which no electrons are emitted</li>
</ul>

<div class="important-info">

  <ul>
    <li>Energy is <strong>quantized</strong> into discrete packets (photons)</li>
    <li>Photon energy: $E = hf = \frac{hc}{\lambda}$
      <ul>
        <li>$h$ = Planck’s constant = $6.63 \times 10^{-34}$ J·s</li>
        <li>$f$ = frequency in Hz</li>
        <li>$\lambda$ = wavelength in meters</li>
      </ul>
    </li>
  </ul>
</div>

<hr />

<!-- _backgroundColor: Black
_color: yellow -->
<h2 id="example-yellow-light-550-nm">Example: Yellow light (550 nm)</h2>

<ul>
  <li>First, convert wavelength from nm to m:
    <ul>
      <li>$\lambda = 550 \text{ nm} = 550 \times 10^{-9} \text{ m}$</li>
    </ul>
  </li>
  <li>Now we can calculate energy:
    <ul>
      <li>$E = \frac{(6.63 \times 10^{-34} \text{ J}\cdot\text{s})(3.00 \times 10^8 \text{ m/s})}{550 \times 10^{-9} \text{ m}}$</li>
      <li>$E = 3.62 \times 10^{-19} \text{ J} = 2.26 \text{ eV}$</li>
    </ul>
  </li>
</ul>

<hr />

<h2 id="electron-volt-energy-unit">Electron-Volt: Energy Unit</h2>

<div class="important-info">

  <ul>
    <li>One electron-volt (eV) = energy gained by electron accelerated through 1 volt
\(1 eV = 1.602 \times 10^{-19} J\)</li>
  </ul>

</div>

<ul>
  <li>Useful for atomic-scale energies</li>
  <li>Visible light photons: ~1.8-3.1 eV</li>
  <li>UV photons: ~3.1-124 eV</li>
  <li>X-rays: ~124-124,000 eV</li>
</ul>

<hr />

<h2 id="wave-particle-duality">Wave-Particle Duality</h2>

<ul>
  <li>Light behaves as <strong>both</strong> a wave and a particle</li>
  <li><strong>Which behavior we see depends on the experiment</strong>:
    <ul>
      <li>Interference experiments → wave nature</li>
      <li>Photoelectric effect → particle nature</li>
    </ul>
  </li>
</ul>

<div class="important-info">

  <ul>
    <li>Matter also shows this duality!</li>
    <li>De Broglie wavelength: $\lambda = \frac{h}{mv}$
      <ul>
        <li>$h$ = Planck’s constant</li>
        <li>$m$ = mass</li>
        <li>$v$ = velocity</li>
      </ul>
    </li>
  </ul>

</div>

<p><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Double-slit_experiment_results_electron.jpg/800px-Double-slit_experiment_results_electron.jpg" alt="width:600px" /></p>

  <li>Electrons fired through double slits create <strong>interference patterns</strong></li>

<h2 id="detecting-light-from-brightness-to-photons">Detecting Light: From Brightness to Photons</h2>

<ul>
  <li><strong>Classical detection</strong>: Measures average intensity
    <ul>
      <li>Light meters in cameras</li>
      <li>Solar irradiance measurements</li>
    </ul>
  </li>
  <li><strong>Quantum detection</strong>: Counts individual photons
    <ul>

    </ul>

    </ul>
  </li>
</ul>

<h2 id="energy-in-electromagnetic-waves">Energy in Electromagnetic Waves</h2>

<div class="important-info">

  <ul>
    <li>Energy density in electric field: $u_E = \frac{1}{2}\varepsilon_0 E^2$</li>
    <li>Energy density in magnetic field: $u_B = \frac{1}{2}\frac{B^2}{\mu_0}$</li>
    <li>
      <p>Total energy density: $u = u_E + u_B = \varepsilon_0 E^2$</p>
    </li>
    <li>Energy flow rate (Poynting vector): $\vec{S} = \frac{1}{\mu_0}\vec{E} \times \vec{B}$</li>
    <li>Magnitude: $S = \frac{EB}{\mu_0} = \varepsilon_0 cE^2$</li>
  </ul>

</div>

<ul>
  <li>Intensity is magnitude of Poynting vector: $I = S$</li>
</ul>

<hr />

<h2 id="resonant-absorption-of-em-waves">Resonant Absorption of EM Waves</h2>

<ul>
  <li>
    <p><strong>Resonance</strong>: When EM wave frequency matches natural frequency of a system</p>
  </li>
  <li>Different materials and molecules resonate at different frequencies:
    <ul>
      <li>Water molecules: Rotate at microwave frequencies (~2.45 GHz)</li>
      <li>Electrons in atoms: Oscillate at visible/UV frequencies</li>
      <li>Chemical bonds: Vibrate at infrared frequencies</li>
    </ul>
  </li>
  <li><strong>Applications of resonant absorption</strong>:
    <ul>
      <li>Microwave cooking: Water molecules absorb 2.45 GHz radiation</li>
      <li>MRI: Hydrogen nuclei absorb radio waves in magnetic field</li>
      <li>Infrared spectroscopy: Identifies molecules by absorption patterns</li>
      <li>Sunscreen: Absorbs harmful UV radiation</li>
    </ul>
  </li>
</ul>

<h2 id="practice-problem-1-photon-energy">Practice Problem 1: Photon Energy</h2>
<p>Calculate the energy of a photon of yellow light with wavelength 580 nm.</p>

<hr />

<p><strong>Solution:</strong>
Using $E = \frac{hc}{\lambda}$:</p>
<ul>
  <li>$h = 6.63 \times 10^{-34}$ J·s</li>
  <li>$c = 3.00 \times 10^8$ m/s</li>
  <li>$\lambda = 580 \times 10^{-9}$ m</li>
</ul>

<p>$E = \frac{(6.63 \times 10^{-34})(3.00 \times 10^8)}{580 \times 10^{-9}}$
$E = \frac{1.989 \times 10^{-25}}{580 \times 10^{-9}}$
$E = 3.43 \times 10^{-19}$ J</p>

<p>Converting to electron-volts:
$E = \frac{3.43 \times 10^{-19}}{1.602 \times 10^{-19}} = 2.14$ eV</p>

&lt;ul&gt;
  &lt;li&gt;$h = 6.63 \times 10^{-34}$ J·s&lt;/li&gt;
  &lt;li&gt;$f = 101.5 \times 10^6$ Hz&lt;/li&gt;
&lt;/ul&gt;

&lt;p&gt;$E = (6.63 \times 10^{-34})(101.5 \times 10^6) = 6.73 \times 10^{-26}$ J&lt;/p&gt;

&lt;p&gt;Converting to electron-volts:    $E = \frac{6.73 \times 10^{-26}}{1.602 \times 10^{-19}} = 4.20 \times 10^{-7}$ eV&lt;/p&gt;
</code></pre></div>    </div>

<h2 id="practice-problem-3-em-wave-physics">Practice Problem 3: EM Wave Physics</h2>
<p>An electromagnetic wave in vacuum has an electric field amplitude of 2.0 × 10³ V/m. Find:
a) The magnetic field amplitude
b) The intensity of this wave</p>

<hr />

<p><strong>Solution:</strong>
a) Using $E = cB$:</p>
<ul>
  <li>$E = 2.0 \times 10^3$ V/m</li>
  <li>$c = 3.00 \times 10^8$ m/s</li>
</ul>

<p>$B = \frac{E}{c} = \frac{2.0 \times 10^3}{3.00 \times 10^8} = 6.67 \times 10^{-6}$ T</p>

<p>b) Using $I = \frac{1}{2}\varepsilon_0 E^2 c$:</p>
<ul>
  <li>$\varepsilon_0 = 8.85 \times 10^{-12}$ F/m</li>
  <li>$E = 2.0 \times 10^3$ V/m</li>
</ul>

<p>$I = \frac{1}{2}(8.85 \times 10^{-12})(2.0 \times 10^3)^2(3.00 \times 10^8)$
   $I = \frac{1}{2}(8.85 \times 10^{-12})(4.0 \times 10^6)(3.00 \times 10^8)$
   $I = 5.31 \times 10^3$ W/m²</p>

<hr />

<h2 id="practice-problem-4-double-slit-experiment">Practice Problem 4: Double-Slit Experiment</h2>
<p>Light with wavelength 650 nm passes through two slits separated by 0.2 mm. If a screen is placed 1.5 m away, what is the distance from the central maximum to the second bright fringe?</p>

<p><strong>Solution:</strong>
For bright fringes, $d \sin \theta = m\lambda$, where $m$ is the order (0, 1, 2…)</p>

<p>For the second bright fringe, $m = 2$:</p>
<ul>
  <li>$\lambda = 650 \times 10^{-9}$ m</li>
  <li>$d = 0.2 \times 10^{-3}$ m</li>
</ul>

<p>$\sin \theta = \frac{m\lambda}{d} = \frac{2 \times 650 \times 10^{-9}}{0.2 \times 10^{-3}} = \frac{1300 \times 10^{-9}}{0.2 \times 10^{-3}} = 6.5 \times 10^{-3}$</p>

<p>For small angles, $\sin \theta \approx \theta$ (in radians), so $\theta \approx 6.5 \times 10^{-3}$ rad</p>

<p>The distance on the screen is $y = L \times \theta$:</p>
<ul>
  <li>$L = 1.5$ m</li>
  <li>$\theta = 6.5 \times 10^{-3}$ rad</li>
</ul>

<p>$y = 1.5 \times 6.5 \times 10^{-3} = 9.75 \times 10^{-3}$ m = 9.75 mm</p>

<hr />

<h2 id="practice-problem-5-de-broglie-wavelength">Practice Problem 5: De Broglie Wavelength</h2>
<p>Calculate the de Broglie wavelength of an electron moving at 4.5 × 10⁶ m/s.</p>

<p><strong>Solution:</strong>
Using $\lambda = \frac{h}{mv}$:</p>
<ul>
  <li>$h = 6.63 \times 10^{-34}$ J·s</li>
  <li>$m = 9.11 \times 10^{-31}$ kg</li>
  <li>$v = 4.5 \times 10^6$ m/s</li>
</ul>

<p>$\lambda = \frac{6.63 \times 10^{-34}}{(9.11 \times 10^{-31})(4.5 \times 10^6)}$
$\lambda = \frac{6.63 \times 10^{-34}}{4.10 \times 10^{-24}}$
$\lambda = 1.62 \times 10^{-10}$ m = 0.162 nm</p>

<hr />

<h2 id="practice-problem-6-photon-detection">Practice Problem 6: Photon Detection</h2>
<p>A light source emits green light (wavelength 525 nm) with power 2.0 μW. How many photons per second does it emit?</p>

<hr />

<p><strong>Solution:</strong>
Energy of one photon = $E_{photon} = \frac{hc}{\lambda}$:</p>
<ul>
  <li>$h = 6.63 \times 10^{-34}$ J·s</li>
  <li>$c = 3.00 \times 10^8$ m/s</li>
  <li>$\lambda = 525 \times 10^{-9}$ m</li>
</ul>

<p>$E_{photon} = \frac{(6.63 \times 10^{-34})(3.00 \times 10^8)}{525 \times 10^{-9}} = 3.79 \times 10^{-19}$ J</p>

<p>Number of photons per second = $\frac{\text{Total Power}}{E_{photon}}$:</p>
<ul>
  <li>Total Power = 2.0 × 10⁻⁶ W = 2.0 × 10⁻⁶ J/s</li>
</ul>

<p>$\text{Photons/second} = \frac{2.0 \times 10^{-6}}{3.79 \times 10^{-19}} = 5.28 \times 10^{12}$ photons/s</p>

<hr />

<h2 id="practice-problem-7-microwave-resonance">Practice Problem 7: Microwave Resonance</h2>
<p>A microwave oven operates at 2.45 GHz. Calculate the wavelength of these microwaves and explain how they cook food through resonance.</p>

<hr />

<p><strong>Solution:</strong>
Wavelength calculation using $c = f\lambda$:</p>
<ul>
  <li>$c = 3.00 \times 10^8$ m/s</li>
  <li>$f = 2.45 \times 10^9$ Hz</li>
</ul>

<p>$\lambda = \frac{c}{f} = \frac{3.00 \times 10^8}{2.45 \times 10^9} = 0.122$ m = 12.2 cm</p>

<p>Cooking explanation:</p>
<ul>
  <li>Water molecules are polar (positive and negative ends)</li>
  <li>The 2.45 GHz frequency is specifically chosen to match a rotational resonance frequency of water</li>
  <li>As microwaves pass through food, water molecules rapidly rotate to align with oscillating electric field</li>
  <li>This rotation causes molecular friction/collisions</li>
  <li>Kinetic energy is transferred to surrounding molecules as heat</li>
  <li>This resonant absorption is much more efficient than non-resonant frequencies, allowing targeted heating of water-containing foods</li>
</ul>
