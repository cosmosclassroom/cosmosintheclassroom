<h1 id="ray-diagrams-on-flat-mirrors">Ray Diagrams on Flat Mirrors</h1>

  <div>

<h1 id="curved-mirrors-introduction">Curved Mirrors: Introduction</h1>

<div class="flexbox">
  <div>
    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;div class="language-plaintext highlighter-rouge"&gt;&lt;div class="highlight"&gt;&lt;pre class="highlight"&gt;&lt;code&gt;&amp;lt;h3&amp;gt;Types of Curved Mirrors:&amp;lt;/h3&amp;gt; &amp;lt;ul&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Concave mirrors:&amp;lt;/strong&amp;gt; curve inward, reflect light toward focus&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Convex mirrors:&amp;lt;/strong&amp;gt; curve outward, reflect light away from virtual focus&amp;lt;/li&amp;gt; &amp;lt;/ul&amp;gt; &amp;lt;p&amp;gt;Images formed on curved mirrors are rather different from those on flat mirrors&amp;lt;/p&amp;gt; &lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;    &lt;/div&gt;

<h1 id="concave-mirrors-key-terminology">Concave Mirrors: Key Terminology</h1>

<div class="flexbox">
  <div>
    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;div class="language-plaintext highlighter-rouge"&gt;&lt;div class="highlight"&gt;&lt;pre class="highlight"&gt;&lt;code&gt;&amp;lt;ul&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Vertex:&amp;lt;/strong&amp;gt; center point of the mirror surface&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Center of curvature (C):&amp;lt;/strong&amp;gt; center of the sphere from which the mirror is cut&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Focal point (F):&amp;lt;/strong&amp;gt; point where parallel rays converge after reflection&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Focal length (f):&amp;lt;/strong&amp;gt; distance from vertex to focal point&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Principal axis:&amp;lt;/strong&amp;gt; line passing through C and F&amp;lt;/li&amp;gt; &amp;lt;/ul&amp;gt; &lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;    &lt;/div&gt;
</code></pre></div>    </div>
  </div>
  <div class="image-container">
    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;div class="language-plaintext highlighter-rouge"&gt;&lt;div class="highlight"&gt;&lt;pre class="highlight"&gt;&lt;code&gt;&amp;lt;img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Concave_mirror_ray_diagram.svg/800px-Concave_mirror_ray_diagram.svg.png" alt="Concave mirror ray diagram" /&amp;gt; &lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;    &lt;/div&gt;

<h1 id="concave-mirror-ray-diagrams">Concave Mirror Ray Diagrams</h1>

</code></pre></div>    </div>
  </div>
  <div>
    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;div class="language-plaintext highlighter-rouge"&gt;&lt;div class="highlight"&gt;&lt;pre class="highlight"&gt;&lt;code&gt;&amp;lt;h3&amp;gt;Magnification:&amp;lt;/h3&amp;gt; &amp;lt;div class="formula"&amp;gt;   \[ m = -\frac{q}{p} \] &amp;lt;/div&amp;gt; &amp;lt;ul&amp;gt;   &amp;lt;li&amp;gt;Positive m: upright image&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;Negative m: inverted image&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;|m| &amp;gt; 1: enlarged image&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;|m| &amp;lt; 1: reduced image&amp;lt;/li&amp;gt; &amp;lt;/ul&amp;gt; &lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;    &lt;/div&gt;
</code></pre></div>    </div>
  </div>
</div>

<h1 id="sign-conventions-for-mirrors">Sign Conventions for Mirrors</h1>

<div class="columns">
  <div>
    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;div class="language-plaintext highlighter-rouge"&gt;&lt;div class="highlight"&gt;&lt;pre class="highlight"&gt;&lt;code&gt;&amp;lt;h3&amp;gt;Focal Length (f):&amp;lt;/h3&amp;gt; &amp;lt;ul&amp;gt;   &amp;lt;li&amp;gt;Positive for concave mirrors&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;Negative for convex mirrors&amp;lt;/li&amp;gt; &amp;lt;/ul&amp;gt;
</code></pre></div>    </div>

    <p>&lt;h3&gt;Object Distance (p):&lt;/h3&gt;
&lt;ul&gt;
  &lt;li&gt;Always positive for real objects&lt;/li&gt;
&lt;/ul&gt;
&lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;    &lt;/div&gt;</p>
  </div>
  <div>
    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;div class="language-plaintext highlighter-rouge"&gt;&lt;div class="highlight"&gt;&lt;pre class="highlight"&gt;&lt;code&gt;&amp;lt;h3&amp;gt;Image Distance (q):&amp;lt;/h3&amp;gt; &amp;lt;ul&amp;gt;   &amp;lt;li&amp;gt;Positive for real images (in front of mirror)&amp;lt;/li&amp;gt;   &amp;lt;li&amp;gt;Negative for virtual images (behind mirror)&amp;lt;/li&amp;gt; &amp;lt;/ul&amp;gt;
</code></pre></div>    </div>

    <p>&lt;h3&gt;Image Height (h’):&lt;/h3&gt;
&lt;ul&gt;
  &lt;li&gt;Positive for upright images&lt;/li&gt;
  &lt;li&gt;Negative for inverted images&lt;/li&gt;
&lt;/ul&gt;
&lt;/code&gt;&lt;/pre&gt;&lt;/div&gt;    &lt;/div&gt;</p>
  </div>
</div>
