<h1 id="the-life-force">The “Life Force”</h1>

<p>1791 - Discovers that static electricity can cause a frog leg to twitch</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_1.png" alt="" /></p>

<p>Twitching could also be induced by injecting a mixture of metals</p>

<p>Assumed the metals were conducting the “life force” of the animal</p>

<p>Luigi Galvani</p>

<p>1737 - 1798</p>

<h1 id="skeptical-interrogation">Skeptical interrogation</h1>

<p>Skeptical of Galvani’s “life force” claims</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_2.png" alt="" /></p>

<p>Experiments showed that the metals were the source of the electricity\, conducted by the liquid in the frog tissue</p>

<p>Experimented with disks of zinc and silver to generate the first battery</p>

<p>Debunked the idea that electricity was only a property of living things</p>

<p>Alessandro Volta</p>

<p>1745 - 1827</p>

<h1 id="electric-potential-energy-pee">Electric Potential Energy (PEE)</h1>

<p>Electric potential energy is the energy associated with the position of electric charges in an electric field.</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_3.png" alt="" /></p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_4.png" alt="" /></p>

<p>As previously\, electric potential energy is measured in  <em>Joules</em>  (J)</p>

<h1 id="relating-gravitational-and-electric-potential-energy">Relating Gravitational and Electric Potential Energy</h1>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_5.png" alt="" /></p>

<h1 id="understanding-voltage">Understanding Voltage</h1>

<p>Voltage\, also known as electric potential  <strong>difference</strong> \, is the measure of the potential energy  __difference __ per unit charge between  __two points __ in an electric field</p>

<p>It represents the  __work __ needed to  __move __ a  __charge __ from one point to another against an electric field</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_6.png" alt="" /></p>

<p>Voltage is measured in  <strong>volts (V)</strong></p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_7.png" alt="" /></p>

<h1 id="electric-current">Electric Current</h1>

<p><strong>Electric current (</strong>  <em>I</em>  <strong>) __ refers to the  __rate of flow of electric charge</strong>  through a conductor\, like a wire\, in a circuit</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_8.png" alt="" /></p>

<p>Current is measured in  __amperes __ (A)</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_9.png" alt="" /></p>

<p>The flow of  <strong>charge</strong>  through a  __conductor __ is very similar to</p>

<p>the flow of  <strong>water __ through a  __pipe</strong></p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_10.png" alt="" /></p>

<h1 id="ohms-law">Ohm’s Law</h1>

<p>German physicist\, mathematician and teacher</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_12.png" alt="" /></p>

<p>Showed relationship between voltage\, current\, and resistance in an electrical circuit</p>

<p>Experimented with circuits through metals\, pioneered by Volta</p>

<p>Georg Simon Ohm</p>

<p>1789 - 1854</p>

<h1 id="resistance-and-resistors">Resistance and Resistors</h1>

<p>__Resistance __ is a measure of how much a  __material opposes __ the flow of electric current</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_13.png" alt="" /></p>

<p>__Resistors __ are passive  __electrical components __ designed to introduce resistance into an electric circuit</p>

<p>Visualize resistance as the narrowness of a pipe that  __restricts __ the  __flow __ of water\, or a thumb over a hose</p>

<h1 id="measuring-resistance">Measuring resistance</h1>

<p><strong>Resistance (R)</strong>  __ is a measure of how much a material opposes the flow of current.__</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_14.png" alt="" /></p>

<p>Resistance is measured in  __ohms $Ω$
(R = \frac{1 V}{1 \,amp})
$resistance = \frac{voltage\,drop}{current}$</p>

<p>One ohm is the amount of resistance experienced by 1 amp of current when it experiences a voltage drop of 1 V</p>

<h1 id="ohms-law-1">Ohm’s Law</h1>

<p><strong>When a current flows through a __  __resistor</strong>  <strong>\, a potential difference or __  __voltage drop __  __is experienced.</strong></p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_16.png" alt="" /></p>

<p>The voltage drop across a resistor can be calculated using  <strong>Ohm’s Law</strong></p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_17.png" alt="" /></p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_18.png" alt="" /></p>

<h1 id="electrical-power">Electrical Power</h1>

<p>Electrical power is the rate at which electrical energy is transferred or converted into other forms of energy</p>

<p>Power in an electrical circuit is calculated as:</p>

<p>$P = V \cdot I$
$\text{power = voltage} \times \text{current}$</p>

<p>Power is measured in watts $W$</p>

<p>$1 watt = \frac{1 Joule}{s} = \frac{J}{s}$</p>

<p>$1 watt = volts \times amps $</p>
