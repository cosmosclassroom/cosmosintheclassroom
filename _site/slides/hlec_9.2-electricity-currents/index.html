<h1 id="the-life-force">The “Life Force”</h1>

<p><strong>1791:</strong> Static electricity causes a frog leg to twitch.</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_1.png" alt="" /></p>

<ul>
  <li>Twitching also induced by metals.</li>
  <li>Metals thought to conduct the animal’s “life force”.</li>
</ul>

<h2 id="luigi-galvani-17371798"><strong>Luigi Galvani (1737–1798)</strong></h2>

<h1 id="skeptical-interrogation">Skeptical Interrogation</h1>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_2.png" alt="" /></p>

<ul>
  <li>Galvani’s “life force” claim questioned.</li>
  <li>Experiments showed metals were the source of electricity, conducted by frog tissue.</li>
  <li>First battery: zinc and silver disks.</li>
  <li>Debunked idea that electricity is only in living things.</li>
</ul>

<h2 id="alessandro-volta-17451827"><strong>Alessandro Volta (1745–1827)</strong></h2>

<h1 id="electric-potential-energy">Electric Potential Energy</h1>

<p>Electric potential energy is the energy associated with the position of electric charges in an electric field.</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_3.png" alt="" />
<img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_4.png" alt="" /></p>

<ul>
  <li>
    <h2 id="measured-in-joules-j">Measured in <strong>Joules (J)</strong></h2>
  </li>
</ul>

<h1 id="gravitational-vs-electric-potential-energy">Gravitational vs. Electric Potential Energy</h1>

<h2><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_5.png" alt="" /></h2>

<h1 id="understanding-voltage">Understanding Voltage</h1>

<p>Voltage (electric potential difference) is the potential energy difference per unit charge between two points in an electric field.</p>

<ul>
  <li>Represents the work needed to move a charge from one point to another against an electric field.</li>
</ul>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_6.png" alt="" /></p>

<ul>
  <li>Measured in <strong>volts (V)</strong></li>
</ul>

<h2 id="-1"><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_7.png" alt="" /></h2>

<h1 id="electric-current">Electric Current</h1>

<p>Electric current (<strong>I</strong>) is the rate of flow of electric charge through a conductor (like a wire).</p>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_8.png" alt="" /></p>

<ul>
  <li>Measured in <strong>amperes (A)</strong></li>
</ul>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_9.png" alt="" /></p>

<ul>
  <li>
    <h2 id="flow-of-charge-through-a-conductor-is-similar-to-water-flowing-through-a-pipe">Flow of charge through a conductor is similar to water flowing through a pipe.</h2>
  </li>
</ul>

<h1 id="electric-current-analogy">Electric Current Analogy</h1>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_10.png" alt="" /></p>

<ul>
  <li>Current is measured in <strong>amperes (A)</strong></li>
  <li>Charge flow in a conductor is like water in a pipe.</li>
</ul>

<h2 id="-2"><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_11.png" alt="" /></h2>

<h1 id="ohms-law">Ohm’s Law</h1>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_12.png" alt="" /></p>

<ul>
  <li>German physicist Georg Simon Ohm (1789–1854)</li>
  <li>Showed relationship between voltage, current, and resistance.</li>
  <li>
    <h2 id="experimented-with-metal-circuits-pioneered-by-volta">Experimented with metal circuits (pioneered by Volta).</h2>
  </li>
</ul>

<h1 id="resistance-and-resistors">Resistance and Resistors</h1>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_13.png" alt="" /></p>

<ul>
  <li><strong>Resistance</strong>: How much a material opposes current flow.</li>
  <li><strong>Resistors</strong>: Components designed to introduce resistance.</li>
  <li>
    <h2 id="visualize-resistance-as-a-narrow-pipe-or-thumb-over-a-hose">Visualize resistance as a narrow pipe or thumb over a hose.</h2>
  </li>
</ul>

<h1 id="measuring-resistance">Measuring Resistance</h1>

<p><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_14.png" alt="" /></p>

<ul>
  <li><strong>Resistance (R)</strong> is measured in <strong>ohms (Ω)</strong></li>
  <li>$R = \frac{V}{I}$</li>
  <li>$1~\Omega = \frac{1~V}{1~A}$</li>
  <li>$resistance = \frac{voltage~drop}{current}$</li>
</ul>

<h2 id="one-ohm-1-amp-of-current-with-a-voltage-drop-of-1-v">One ohm: 1 amp of current with a voltage drop of 1 V.</h2>

<h1 id="crashcourse-physics">CrashCourse: Physics</h1>

<h2 id="-3"><img src="assets\images\9_electricity\0_Lecture_11_Electrodynamics_19.jpg" alt="" /></h2>

<h1 id="electrical-power">Electrical Power</h1>

<ul>
  <li>Electrical power is the rate at which electrical energy is transferred or converted.</li>
</ul>

<p><strong>Formulas:</strong></p>
<ul>
  <li>$P = V \cdot I$</li>
  <li>$P = I^2 \cdot R$</li>
  <li>
    <p>$P = \frac{V^2}{R}$</p>
  </li>
  <li>Power is measured in <strong>watts (W)</strong></li>
  <li>
    <h2 id="1w--1v-cdot-1a--1fracjs">$1~W = 1~V \cdot 1~A = 1~\frac{J}{s}$</h2>
  </li>
</ul>

<h1 id="energy-power-current">Energy, Power, Current</h1>

<h1 id="formula-summary">Formula Summary</h1>

<table>
  <thead>
    <tr>
      <th>Concept</th>
      <th>Formula</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Ohm’s Law</td>
      <td>$V = I \cdot R$</td>
      <td>Voltage = Current × Resistance</td>
    </tr>
    <tr>
      <td>Resistance</td>
      <td>$R = \frac{V}{I}$</td>
      <td>Resistance = Voltage / Current</td>
    </tr>
    <tr>
      <td>Power</td>
      <td>$P = V \cdot I$</td>
      <td>Power = Voltage × Current</td>
    </tr>
    <tr>
      <td>Power (alternate)</td>
      <td>$P = I^2 \cdot R$</td>
      <td>Power = Current² × Resistance</td>
    </tr>
    <tr>
      <td>Power (alternate)</td>
      <td>$P = \frac{V^2}{R}$</td>
      <td>Power = Voltage² / Resistance</td>
    </tr>
    <tr>
      <td>Electric Potential</td>
      <td>$V = \frac{PE}{q}$</td>
      <td>Potential = Potential Energy / Charge</td>
    </tr>
    <tr>
      <td>Potential Energy Change</td>
      <td>$\Delta PE = q \cdot E \cdot d$</td>
      <td>Change in PE = Charge × Electric Field × Distance</td>
    </tr>
    <tr>
      <td>Resistance (unit)</td>
      <td>$1~\Omega = \frac{1~V}{1~A}$</td>
      <td>1 Ohm = 1 Volt / 1 Ampere</td>
    </tr>
    <tr>
      <td>Power (unit)</td>
      <td>$1~W = 1~V \cdot 1~A$</td>
      <td>1 Watt = 1 Volt × 1 Ampere</td>
    </tr>
    <tr>
      <td>Power (unit)</td>
      <td>$1~W = 1~\frac{J}{s}$</td>
      <td>1 Watt = 1 Joule per second</td>
    </tr>
  </tbody>
</table>
