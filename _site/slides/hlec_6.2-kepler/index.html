          <h1 id="keplers-laws-and-planetary-motion">Kepler’s Laws and Planetary Motion</h1>
<h2 id="the-mathematical-framework-of-our-solar-system">The Mathematical Framework of Our Solar System</h2>

<hr />

<h1 id="historical-context">Historical Context</h1>

<ul>
  <li>Ancient astronomers noticed certain “stars” moved differently</li>
  <li>Greeks called these “planets” (meaning wanderer)</li>
  <li>Ptolemy’s geocentric model (perfect circles) lasted 1,400 years</li>
  <li>Tycho Brahe (1576) made precise astronomical observations</li>
  <li>Discovery of supernova challenged “unchanging heavens” belief</li>
</ul>

<hr />

<h1 id="keplers-journey-to-discovery">Kepler’s Journey to Discovery</h1>

<ul>
  <li>Worked with Tycho Brahe at Uraniborg observatory</li>
  <li>Had access to most accurate astronomical data of the time</li>
  <li>Spent years trying to reconcile Plato’s geometric rules with Brahe’s measurements</li>
  <li>Finally abandoned perfect circles for ellipses</li>
  <li>Developed three fundamental laws of planetary motion</li>
</ul>

<h1 id="keplers-first-law-elliptical-orbits">Kepler’s First Law: Elliptical Orbits</h1>

<ul>
  <li>Planets orbit the Sun in elliptical paths</li>
  <li>Sun is located at one focus of the ellipse</li>
  <li>Characterized by:
    <ul>
      <li>Semi-major axis ($a$)</li>
      <li>Eccentricity ($e$)</li>
    </ul>
  </li>
  <li>Most planets have low eccentricity (nearly circular)</li>
</ul>

<p><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Kepler-first-law.svg/330px-Kepler-first-law.svg.png" alt="bg right:40% width:400px" /></p>

<hr />

<h1 id="visualizing-elliptical-orbits">Visualizing Elliptical Orbits</h1>

<p><img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_5.gif" alt="bg right:60% 90%" /></p>

<ul>
  <li>Explains orbital shapes of:
    <ul>
      <li>Planets</li>
      <li>Comets</li>
      <li>Asteroids</li>
      <li>Artificial satellites</li>
    </ul>
  </li>
  <li>Special case: circular orbit ($e = 0$)</li>
</ul>

<hr />

<h1 id="keplers-second-law-equal-areas">Kepler’s Second Law: Equal Areas</h1>

<ul>
  <li>A line from Sun to planet sweeps equal areas in equal times</li>
  <li>Mathematical expression: $\frac{dA}{dt} = \text{constant}$</li>
  <li>Physical meaning: conservation of angular momentum</li>
  <li>Consequence: Planets move:
    <ul>
      <li>Faster at perihelion (closest approach)</li>
      <li>Slower at aphelion (farthest point)</li>
    </ul>
  </li>
</ul>

<p><img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_6.png" alt="bg right:50% 90%" /></p>

<hr />

<h1 id="keplers-third-law-orbital-periods">Kepler’s Third Law: Orbital Periods</h1>

<ul>
  <li>Relates orbital period to size of orbit</li>
  <li>Mathematical form: $T^2 \propto a^3$</li>
  <li>
    <p>For any two objects orbiting same body:
$\left(\frac{T_1}{T_2}\right)^2 = \left(\frac{a_1}{a_2}\right)^3$</p>
  </li>
  <li>Newton later showed: $T^2 = \frac{4\pi^2}{GM}a^3$</li>
</ul>

<p><img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_7.png" alt="bg right:40% 90%" /></p>

<hr />

<h1 id="practical-units--applications">Practical Units &amp; Applications</h1>

<ul>
  <li>Astronomical Unit (AU): Earth’s average distance from Sun
    <ul>
      <li>1 AU = 149,597,871 km</li>
    </ul>
  </li>
  <li>Simplified form for solar system:
    <ul>
      <li>When using AU and years: $T^2 = a^3$</li>
      <li>$T$ in Earth years</li>
      <li>$a$ in AU</li>
    </ul>
  </li>
</ul>

<p><img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_9.png" alt="bg right:40% vertical" />
(&lt;img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_10.png&gt;)</p>

<hr />

<h1 id="example-mars-orbit">Example: Mars’ Orbit</h1>

<p>Given: Mars’ orbital period = 1.88 years</p>

<p>Using $T^2 = a^3$:</p>
<ul>
  <li>$(1.88)^2 = a^3$</li>
  <li>$a = \sqrt[3]{3.5344} \approx 1.52$ AU</li>
  <li>In kilometers: $1.52 \times 149,597,871 \approx 2.27 \times 10^8$ km</li>
</ul>

<p>This matches observational data!</p>

<hr />

<h1 id="newtons-synthesis">Newton’s Synthesis</h1>

<ul>
  <li>Kepler described <em>how</em> planets move</li>
  <li>Newton explained <em>why</em> they move this way</li>
  <li>Gravitational force provides centripetal force:
    <ul>
      <li>$F_g = G\frac{Mm}{r^2}$ = $m\frac{v^2}{r}$</li>
    </ul>
  </li>
  <li>Slight orbital variations due to planetary interactions</li>
  <li>Foundation of modern orbital mechanics</li>
</ul>
