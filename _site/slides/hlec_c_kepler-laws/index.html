<h1 id="keplers-laws-and-universal-gravitation">Kepler’s Laws and Universal Gravitation</h1>

<p>How can the motions of the planets be described?
<img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_0.png" alt="bg right 85%" /></p>

<hr />

<h2 id="historical-context">Historical Context</h2>
<div class="column">
  <div>

    <div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>&lt;ul&gt;
  &lt;li&gt;Ancient astronomers noticed certain “stars” moved differently&lt;/li&gt;
  &lt;li&gt;Greeks called these “planets” (meaning wanderer)&lt;/li&gt;
  &lt;li&gt;Ptolemy’s geocentric model (perfect circles) lasted 1,400 years&lt;/li&gt;
&lt;/ul&gt;

&lt;div&gt;

  &lt;p&gt;&lt;img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_1.jpg" alt="bg right fill" /&gt;&lt;/p&gt;

  &lt;div&gt;

    &lt;hr /&gt;

    &lt;ul&gt;
      &lt;li&gt;Kepler’s empirical observations (early 1600s) laid groundwork for Newton’s theoretical framework (1687)&lt;/li&gt;
      &lt;li&gt;Kepler described &lt;em&gt;how&lt;/em&gt; planets move; Newton explained &lt;em&gt;why&lt;/em&gt; they move this way&lt;/li&gt;
      &lt;li&gt;Connection between circular motion, universal gravitation, and orbital mechanics&lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h1 id="tycho-brahe"&gt;Tycho Brahe&lt;/h1&gt;

    &lt;ul&gt;
      &lt;li&gt;1576 - &lt;em&gt;still&lt;/em&gt; using Ptolemy’s measurements&lt;/li&gt;
      &lt;li&gt;Noticed a previously unrecorded “new” star - &lt;em&gt;stella novae&lt;/em&gt; (supernova)
        &lt;ul&gt;
          &lt;li&gt;Refuted Plato and Aristotle’s ideas that the ‘heavens’ were perfect and unchanging &lt;img src="img/5_circ-gravitation/0 Lecture _ 53 Laws of Planetary Motion_2.png" alt="auto" /&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="review-universal-gravitation--circular-motion"&gt;Review: Universal Gravitation &amp;amp; Circular Motion&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;Newton’s Law of Universal Gravitation:  \(F_g = G\frac{m_1 m_2}{r^2}\)
        &lt;ul&gt;
          &lt;li&gt;For orbiting bodies, gravitational force provides the centripetal force&lt;/li&gt;
          &lt;li&gt;In circular motion: $F_g = F_c$ and $a_c = \frac{v^2}{r}$ \(G\frac{m_1 m_2}{r^2} = m_1\frac{v^2}{r}\)&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="keplers-first-law-law-of-elliptical-orbits"&gt;Kepler’s First Law: Law of Elliptical Orbits&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;Planets orbit the Sun in elliptical paths with the Sun at one focus&lt;/li&gt;
      &lt;li&gt;Ellipse defined by semi-major axis $a$ and eccentricity $e$&lt;/li&gt;
      &lt;li&gt;Solar system planets have relatively small eccentricities (nearly circular)&lt;/li&gt;
      &lt;li&gt;Special case: circular orbit when $e = 0$ (circle is a type of ellipse)&lt;/li&gt;
    &lt;/ul&gt;

    &lt;p&gt;&lt;img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Kepler-first-law.svg/330px-Kepler-first-law.svg.png" alt="width:500px" /&gt;&lt;/p&gt;

    &lt;hr /&gt;

    &lt;h2 id="keplers-second-law-law-of-equal-areas"&gt;Kepler’s Second Law: Law of Equal Areas&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;A line connecting planet to Sun sweeps equal areas in equal times&lt;/li&gt;
      &lt;li&gt;Mathematical expression: $\frac{dA}{dt} = \text{constant}$&lt;/li&gt;
      &lt;li&gt;Physical meaning: conservation of angular momentum&lt;/li&gt;
      &lt;li&gt;Planets move faster at perihelion (closest approach) and slower at aphelion (farthest point)&lt;/li&gt;
    &lt;/ul&gt;

    &lt;p&gt;&lt;img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Kepler-second-law.svg/500px-Kepler-second-law.svg.png" alt="width:500px" /&gt;&lt;/p&gt;

    &lt;hr /&gt;

    &lt;h2 id="keplers-third-law-law-of-periods"&gt;Kepler’s Third Law: Law of Periods&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;The square of a planet’s orbital period is proportional to the cube of its semi-major axis&lt;/li&gt;
      &lt;li&gt;Mathematical form: $T^2 \propto a^3$&lt;/li&gt;
      &lt;li&gt;More precisely: $T^2 = \frac{4\pi^2}{GM}a^3$ (where $M$ is Sun’s mass)&lt;/li&gt;
      &lt;li&gt;For solar system (using astronomical units): $T^2 = a^3$ (where $T$ is in years, $a$ in AU)&lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="derivation-connecting-kepler-to-newton"&gt;Derivation: Connecting Kepler to Newton&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;For circular orbits, starting with: $G\frac{Mm}{r^2} = m\frac{v^2}{r}$&lt;/li&gt;
      &lt;li&gt;For a circular orbit: $v = \frac{2\pi r}{T}$&lt;/li&gt;
      &lt;li&gt;Substituting: $G\frac{M}{r^2} = \frac{4\pi^2 r}{T^2}$&lt;/li&gt;
      &lt;li&gt;Rearranging: $T^2 = \frac{4\pi^2}{GM}r^3$&lt;/li&gt;
      &lt;li&gt;For elliptical orbits, replace $r$ with semi-major axis $a$: $T^2 = \frac{4\pi^2}{GM}a^3$&lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="practical-applications-units-and-conversions"&gt;Practical Applications: Units and Conversions&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;Astronomical Unit (AU): mean Earth-Sun distance = 149,597,871 km&lt;/li&gt;
      &lt;li&gt;For calculations in solar system:
        &lt;ul&gt;
          &lt;li&gt;When $a$ is in AU and $T$ in years: $T^2 = a^3$&lt;/li&gt;
          &lt;li&gt;When $a$ is in meters and $T$ in seconds: $T^2 = \frac{4\pi^2}{G \cdot M_{sun}}a^3$&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="example-finding-orbital-distance"&gt;Example: Finding Orbital Distance&lt;/h2&gt;

    &lt;p&gt;Mars orbital period: 1.88 years&lt;/p&gt;

    &lt;p&gt;Using $T^2 = a^3$:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;$(1.88)^2 = a^3$&lt;/li&gt;
      &lt;li&gt;$a = \sqrt[3]{3.5344} \approx 1.52$ AU&lt;/li&gt;
      &lt;li&gt;Converting to km: $1.52 \times 149,597,871 \approx 2.27 \times 10^8$ km&lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="example-finding-orbital-period"&gt;Example: Finding Orbital Period&lt;/h2&gt;

    &lt;p&gt;Jupiter’s semi-major axis: 5.2 AU&lt;/p&gt;

    &lt;p&gt;Using $T^2 = a^3$:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;$T^2 = (5.2)^3 = 140.6$&lt;/li&gt;
      &lt;li&gt;$T = \sqrt{140.6} \approx 11.86$ years&lt;/li&gt;
    &lt;/ul&gt;

    &lt;hr /&gt;

    &lt;h2 id="observational-verification"&gt;Observational Verification&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;Kepler’s Laws can be verified using observational data&lt;/li&gt;
      &lt;li&gt;Third law relationship forms a straight line when plotting $\log(T^2)$ vs $\log(a^3)$&lt;/li&gt;
      &lt;li&gt;Slope of exactly 1 confirms the relationship $T^2 \propto a^3$&lt;/li&gt;
    &lt;/ul&gt;

    &lt;p&gt;&lt;img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Kepler-third-law.svg/300px-Kepler-third-law.svg.png" alt="width:450px" /&gt;&lt;/p&gt;

    &lt;hr /&gt;

    &lt;h2 id="key-insights"&gt;Key Insights&lt;/h2&gt;

    &lt;ul&gt;
      &lt;li&gt;Kepler’s Laws are empirical (based on observation) but have theoretical foundation in Newton’s Laws&lt;/li&gt;
      &lt;li&gt;Circular motion and gravitational force combine to explain orbital mechanics&lt;/li&gt;
      &lt;li&gt;These principles apply universally—from satellites around Earth to exoplanets around distant stars&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;
</code></pre></div>    </div>
