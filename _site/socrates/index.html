<!DOCTYPE html>
<html lang="en">
<head>
    // ...existing head content...
    <script src="/src/shared/components/universal-header.js"></script>
</head>
<body>
    <!-- Universal Header -->
    <div id="universalHeader"></div>
    
    // ...existing body content...
    
    <script>
        // Load universal header
        async function loadUniversalHeader() {
            try {
                const response = await fetch('/src/shared/components/universal-header.html');
                if (response.ok) {
                    const headerHtml = await response.text();
                    document.getElementById('universalHeader').innerHTML = headerHtml;
                }
            } catch (error) {
                console.error('Failed to load universal header:', error);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadUniversalHeader();
        });
    </script>
</body>
</html>
