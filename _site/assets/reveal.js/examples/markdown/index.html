<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cosmos in the Classroom">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Markdown Demo | Cosmos in the Classroom</title>
    
    
    <!-- KaTeX Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
    <style>
      body {
        line-height: 1.6;
        max-width: 80%;
        margin: 0 auto;
        padding: 2rem;
        justify-content: center;
      }
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="markdown-body">
      <h1 id="markdown-demo">Markdown Demo</h1>

<h2 id="external-11">External 1.1</h2>

<p>Content 1.1</p>

<p>Note: This will only appear in the speaker notes window.</p>

<h2 id="external-12">External 1.2</h2>

<p>Content 1.2</p>

<h2 id="external-2">External 2</h2>

<p>Content 2.1</p>

<h2 id="external-31">External 3.1</h2>

<p>Content 3.1</p>

<h2 id="external-32">External 3.2</h2>

<p>Content 3.2</p>

<h2 id="external-33-image">External 3.3 (Image)</h2>

<p><img src="https://static.slid.es/logo/v2/slides-symbol-512x512.png" alt="External Image" /></p>

<h2 id="external-34-math">External 3.4 (Math)</h2>

<p><code class="language-plaintext highlighter-rouge">\[ J(\theta_0,\theta_1) = \sum_{i=0} \]</code></p>

    </div>
    
    
    <!-- Initialize KaTeX rendering -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });
        });
    </script>
    
  </body>
</html>
