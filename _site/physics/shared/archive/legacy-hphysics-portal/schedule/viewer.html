<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Documents Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        nav {
            background-color: #444;
            padding: 10px;
            text-align: center;
        }
        .dropdown {
            position: relative;
            display: inline-block;
            margin: 0 5px;
        }
        .dropbtn {
            background-color: #444;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .dropbtn:hover {
            background-color: #555;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            text-align: left;
            border-radius: 5px;
            padding: 5px 0;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            white-space: nowrap;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .iframe-container {
            width: 100%;
            height: calc(100vh - 120px);
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Physics Course Documents</h1>
    </header>

    <nav>
        <div class="dropdown">
            <button class="dropbtn">Schedules</button>
            <div class="dropdown-content">
                <a href="hphysschedule.html" target="contentFrame">Honors Physics Schedule</a>
                <a href="sphysschedule.html" target="contentFrame">Standard Physics Schedule</a>
                <a href="schedule2.html" target="contentFrame">Schedule 2</a>
                <a href="schedule3.html" target="contentFrame">Schedule 3</a>
                <a href="schedule4.html" target="contentFrame">Schedule 4</a>
                <a href="schedule5.html" target="contentFrame">Schedule 5</a>
                <a href="schedule6.html" target="contentFrame">Schedule 6</a>
                <a href="schedule/24-25.html" target="contentFrame">2024-2025 Schedule</a>
                <a href="schedule/24-pacing-adapt.html" target="contentFrame">2024 Pacing Adaptation</a>
            </div>
        </div>

        <div class="dropdown">
            <button class="dropbtn">Lessons & Problems</button>
            <div class="dropdown-content">
                <a href="scope-and-sequence1.html" target="contentFrame">Scope and Sequence</a>
                <a href="2-rocket-problem.html" target="contentFrame">Rocket Problem</a>
                <a href="3-seige.html" target="contentFrame">Siege Problem</a>
                <a href="4-pyramids.html" target="contentFrame">Pyramids Problem</a>
            </div>
        </div>
        
        <div class="dropdown">
            <button class="dropbtn">Other Docs</button>
            <div class="dropdown-content">
                <a href="research-log.html" target="contentFrame">Research Log</a>
            </div>
        </div>
        
    </nav>

    <iframe name="contentFrame" class="iframe-container" src="sphysschedule.html"></iframe>

</body>
</html>
