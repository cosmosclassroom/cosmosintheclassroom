    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const physicsTocData = JSON.parse(document.getElementById('physics-toc-data').textContent);
            const tocContainer = document.getElementById('toc-container');
            const portalTitle = document.getElementById('portal-title');

            // Render the table of contents
            function renderTableOfContents(data) {
                portalTitle.textContent = data.title;
                tocContainer.innerHTML = data.parts.map(part => `
                    <div class="mb-12">
                        <h3 class="text-xl md:text-3xl font-bold mb-2 text-terracotta">${part.title}</h3>
                        <p class="text-md text-gray-600 mb-6 font-sans">${part.description}</p>
                        ${part.chapters.map((chapter, index) => `
                            <details class="mb-4 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300 cursor-pointer border border-gray-200">
                                <!-- Now an actual link to the chapter page -->
                                <summary class="font-bold text-lg text-sage">
                                    <a href="chapter${index + 1}.html" class="text-sage no-underline hover:underline">${chapter.title}</a>
                                </summary>
                                <ul class="list-disc list-inside mt-4 space-y-2 text-sm text-gray-700 font-sans">
                                    ${chapter.sections.map(section => `<li>${section}</li>`).join('')}
                                </ul>
                            </details>
                        `).join('')}
                    </div>
                `).join('');
            }

            renderTableOfContents(physicsTocData);
        });
    </script>
