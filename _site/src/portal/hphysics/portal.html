<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Honors Physics Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { 
      font-family: 'Inter', Arial, sans-serif; 
      margin: 0; 
      padding: 20px; 
      background-color: #f9f9f6;
      color: #333;
    }
    h1 { 
      color: #2c3e50; 
      text-align: center;
      margin-bottom: 2rem;
    }
    .course-part { 
      margin: 2rem 0; 
      padding: 1.5rem;
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .units-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
      gap: 1rem; 
      margin-top: 1rem;
    }
    .unit-card { 
      border: 1px solid #e0e0e0; 
      padding: 1rem; 
      border-radius: 0.5rem;
      background: #fafafa;
    }
    .unit-card h3 { 
      margin-top: 0; 
      color: #2c3e50;
    }
    .unit-actions { 
      margin-top: 1rem; 
    }
    .unit-actions button { 
      background: #3498db; 
      color: white; 
      border: none; 
      padding: 0.5rem 1rem; 
      border-radius: 0.25rem; 
      margin-right: 0.5rem;
      cursor: pointer;
    }
    .unit-actions button:hover { 
      background: #2980b9; 
    }
    .course-overview {
      background: #ecf0f1;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
    }
    .quarterly-breakdown {
      margin-top: 3rem;
    }
    .quarter-card {
      background: white;
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 0.5rem;
      border-left: 4px solid #3498db;
    }
  </style>
</head>
<body>
  <h1 id="course-title">Loading course...</h1>
  <div id="units-container">Loading course data...</div>

  <script src="../script.js"></script>
  <script>
    // Load honors physics course when page loads
    document.addEventListener('DOMContentLoaded', function() {
      loadCourse('./admin/physics.json');
    });
  </script>
</body>
</html>
