<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Honors Physics Portal</title>
</head>
<body>
  <h1 id="course-title"></h1>
  <div id="units-container"></div>

  <script>
    fetch('admin/course.json')
      .then(res => res.json())
      .then(course => {
        document.getElementById('course-title').textContent = course.name;

        const container = document.getElementById('units-container');
        course.units.forEach(unit => {
          const unitDiv = document.createElement('div');
          const unitHeader = document.createElement('h2');
          unitHeader.textContent = unit.name;
          unitDiv.appendChild(unitHeader);

          const chapterUl = document.createElement('ul');
          unit.chapters.forEach(chapter => {
            const chapterLi = document.createElement('li');
            chapterLi.innerHTML = `<a href="${chapter.flexbookPath}">${chapter.title}</a>`;
            chapterUl.appendChild(chapterLi);
          });

          unitDiv.appendChild(chapterUl);
          container.appendChild(unitDiv);
        });
      });
  </script>
</body>
</html>
