<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook</title>
    <link rel="stylesheet" href="./assets/css/notebook.css" onerror="handleMissingCSS('notebook.css')" />
    <link rel="stylesheet" href="../../assets/css/style.css" onerror="handleMissingCSS('style.css')" />
    <script>
        function handleMissingCSS(fileName) {
            console.error(`Failed to load CSS file: ${fileName}`);
        }
    </script>
</head>
<body>
    <h1>Notebook</h1>
    <div class="nav">
        <button id="prevBtn" disabled>Previous</button>
        <div class="file-info">
            File <span id="currentIndex">1</span> of <span id="totalFiles">?</span>
        </div>
        <button id="nextBtn">Next</button>
    </div>
    <div id="content">
        <p>Loading...</p>
    </div>
    <script src="../../shared/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('p5l4_wave_variables.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to load file: p5l4_wave_variables.md`);
                    }
                    return response.text();
                })
                .then(content => {
                    document.getElementById('content').innerHTML = content;
                })
                .catch(error => {
                    console.error(error.message);
                    document.getElementById('content').innerHTML = '<p>Error loading content.</p>';
                });
        });
    </script>
</body>
</html>
