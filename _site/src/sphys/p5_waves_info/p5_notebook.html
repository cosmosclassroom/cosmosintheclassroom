<!-- This is a static HTML file for the Cosmos in the Classroom project. -->
<!-- It includes a navigation panel and some example content. -->
<!-- The file is structured with a head and body -->
 
<head>
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/reading.css">
    </head>
    <body>
    
    <!-- Updated navigation panel -->
    <div class="navbar">
      <div class="nav-panel">
        <button onclick="navigatePage(-1)" class="nav-button">← Back</button>
        <button onclick="navigatePage(1)" class="nav-button">Forward →</button>
      </div>
      <script>
        async function navigatePage(direction) {
          const response = await fetch('./statichtml.json');
          const pages = await response.json();
          const currentPath = document.getElementById('content-frame').src.split('/').pop();
          const currentIndex = pages.findIndex(page => page.url === currentPath); // Ensure exact match with `url`
          let newIndex = currentIndex + direction;
    
          // Wrap around logic
          if (newIndex < 0) {
            newIndex = pages.length - 1; // Go to the last page
          } else if (newIndex >= pages.length) {
            newIndex = 0; // Go to the first page
          }
    
          document.getElementById('content-frame').src = pages[newIndex].url;
        }
      </script>
    </div>
    
    <!-- Viewing port for rendering HTML pages -->
    <style>
        #content-frame {
            width: 100%;
            height: 80vh;
            border: none;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }
        .slide-out {
            transform: translateX(-100%);
            opacity: 0;
        }
        .slide-in {
            transform: translateX(0);
            opacity: 1;
        }
    </style>
    <iframe id="content-frame" src="html1.html" class="slide-in"></iframe>
    <script>
        function animatePageTransition(direction) {
            const frame = document.getElementById('content-frame');
            frame.classList.remove('slide-in');
            frame.classList.add('slide-out');
            
            setTimeout(() => {
                frame.classList.remove('slide-out');
                frame.classList.add('slide-in');
            }, 500);
        }
        
        // Update the existing navigatePage function to use animation
        const oldNavigatePage = window.navigatePage;
        window.navigatePage = async (direction) => {
            animatePageTransition(direction);
            await oldNavigatePage(direction);
        };
    </script>
    </body>
    </html>
