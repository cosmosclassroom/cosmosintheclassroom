<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Curriculum Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .unit-card {
            transition: all 0.3s ease-in-out;
        }
        .unit-card.is-complete {
            background-color: #f0fdf4; /* A light green */
            border-left-color: #22c55e; /* A darker green */
        }
        .unit-card.is-complete h3 {
            text-decoration: line-through;
            color: #6b7280;
        }
        .checkbox-custom {
            -webkit-appearance: none;
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 0.15em solid currentColor;
            border-radius: 0.15em;
            transform: translateY(-0.075em);
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        .checkbox-custom::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #22c55e; /* Tailwind's green-500 */
            transform-origin: bottom left;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .checkbox-custom:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl" id="curriculumTitle"></h1>
        </header>

        <!-- Calendar Controls -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-12">
            <h2 class="text-2xl font-bold mb-4">Projected Calendar</h2>
            <p class="text-gray-600 mb-4">Set a start date for the school year to project the timeline for each unit. The calculation assumes a standard Monday-Friday schedule.</p>
            <div class="flex items-center space-x-4">
                <label for="startDate" class="font-medium text-gray-700">School Year Start Date:</label>
                <input type="date" id="startDate" class="border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <button id="generateCalendarBtn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Generate</button>
            </div>
        </div>
        
        <!-- Calendar View -->
        <div id="calendarView" class="hidden mb-12">
            <h3 class="text-xl font-bold mb-4">Projected Timeline</h3>
            <div class="bg-white rounded-lg shadow-md">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Unit</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pacing (Days)</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Projected Start</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Projected End</th>
                        </tr>
                    </thead>
                    <tbody id="calendarBody" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>


        <!-- Curriculum content -->
        <main id="curriculumContainer" class="space-y-16"></main>
    </div>

    <script>
        // Merged and mapped curriculum data
        const curriculumData = {
          "curriculumTitle": "The Story of Physics",
          "parts": [
            {
              "partNumber": "I", "partTitle": "The Rules of the Game", "partSubtitle": "Establishing the fundamental language and tools of observation.",
              "units": [
                { "unitNumber": 1, "title": "Speaking the Same Language", "duration": 8, "coreIdea": "Establishes a universal language for precise and honest measurement.", "keySkills": ["Dimensional analysis", "unit conversions", "applying significant figures"], "anchoringPhenomenon": "The Challenge of Mapping the World." },
                { "unitNumber": 2, "title": "The Art of Observation", "duration": 12, "coreIdea": "Describes motion quantitatively using position, velocity, and acceleration.", "keySkills": ["Graphical analysis of motion", "solving 1D kinematic equations"], "anchoringPhenomenon": "The Launch and Trajectory of a Sounding Rocket." },
                { "unitNumber": 3, "title": "The World in Three Dimensions", "duration": 21, "coreIdea": "Analyzes complex, two-dimensional motion as the sum of simple, independent linear motions.", "keySkills": ["Vector decomposition", "projectile motion calculations", "relative velocity"], "anchoringPhenomenon": "The First Use of a Cannon at the Siege of Constantinople." }
              ]
            },
            {
              "partNumber": "II", "partTitle": "The Great Unification", "partSubtitle": "Discovering the universal laws that govern motion, energy, and interactions.",
              "units": [
                { "unitNumber": 4, "title": "The Why of Motion", "duration": 22, "coreIdea": "Introduces Force as the cause of changes in motion, governed by Newton's Laws.", "keySkills": ["Applying Newton's Second Law (ΣF=ma) with free-body diagrams", "including friction"], "anchoringPhenomenon": "The Construction of the Great Pyramid." },
                { "unitNumber": 5, "title": "The Universe's Accounting System", "duration": 19, "coreIdea": "Tracks changes in systems using the concept of Energy and its conservation.", "keySkills": ["Calculating Work, Power, Kinetic & Potential Energy", "applying the Conservation of Energy"], "anchoringPhenomenon": "The Power of the Hoover Dam." },
                { "unitNumber": 6, "title": "The Conversation of Matter", "duration": null, "coreIdea": "Analyzes interactions and collisions through the lens of Momentum and its conservation.", "keySkills": ["Calculating Momentum and Impulse", "applying the Conservation of Momentum to collisions"], "anchoringPhenomenon": "The 'Gravity Assist' or 'Slingshot' Maneuver of the Voyager Probes." },
                { "unitNumber": 7, "title": "The Great Cosmic Waltz", "duration": 21, "coreIdea": "Applies principles of force and motion to understand universal gravity and orbital mechanics.", "keySkills": ["Calculating centripetal force", "using Universal Gravitation to solve for orbital parameters"], "anchoringPhenomenon": "The Design of a Geostationary Satellite." }
              ]
            },
            {
              "partNumber": "III", "partTitle": "The Unseen World", "partSubtitle": "Exploring the physics of waves, light, and the fundamental forces of matter.",
              "units": [
                { "unitNumber": 8, "title": "The Traveling Ripple", "duration": 16, "coreIdea": "Explores how energy can be transferred through space and matter via waves.", "keySkills": ["Using the wave equation (v=fλ)", "analyzing wave interference"], "anchoringPhenomenon": "The Sound-Dampening of a Modern Recording Studio." },
                { "unitNumber": 9, "title": "The Story of Sight", "duration": null, "coreIdea": "Models the behavior of light as it reflects and refracts through mirrors and lenses.", "keySkills": ["Applying Snell's Law", "the thin lens equation", "constructing ray diagrams"], "anchoringPhenomenon": "The Use of Corrective Lenses." },
                { "unitNumber": 10, "title": "The Force That Binds Us All", "duration": 17, "coreIdea": "Investigates the fundamental electrostatic force that governs the structure of matter.", "keySkills": ["Applying Coulomb's Law for electrostatic forces", "Ohm's Law for simple circuits"], "anchoringPhenomenon": "The Physics of a Lightning Strike." }
              ]
            }
          ]
        };

        // --- Main Application Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            const curriculumTitleEl = document.getElementById('curriculumTitle');
            const container = document.getElementById('curriculumContainer');
            const generateBtn = document.getElementById('generateCalendarBtn');

            curriculumTitleEl.textContent = curriculumData.curriculumTitle;

            // Render curriculum cards
            curriculumData.parts.forEach(part => {
                const partElement = document.createElement('section');
                partElement.setAttribute('aria-labelledby', `part-title-${part.partNumber}`);
                partElement.innerHTML = `
                    <div class="mb-8 border-b border-gray-200 pb-5">
                        <h2 id="part-title-${part.partNumber}" class="text-3xl font-bold text-gray-900">
                            <span class="text-gray-400 font-normal">Part ${part.partNumber}:</span> ${part.partTitle}
                        </h2>
                        <p class="mt-2 max-w-4xl text-lg text-gray-500">${part.partSubtitle}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${part.units.map(createUnitCard).join('')}
                    </div>
                `;
                container.appendChild(partElement);
            });
            
            // Add event listeners for checkboxes
            addCheckboxListeners();
            
            // Add event listener for calendar generation
            generateBtn.addEventListener('click', generateCalendar);
        });

        function createUnitCard(unit) {
            const durationText = unit.duration ? `<p class="text-sm font-medium text-blue-600">${unit.duration} instructional days</p>` : '';
            return `
                <div id="unit-${unit.unitNumber}" class="unit-card bg-white rounded-lg shadow-md p-6 border-l-4 border-gray-200 hover:shadow-xl hover:border-blue-500">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <h3 class="text-lg font-semibold text-gray-900">
                                <span class="text-gray-500">Unit ${unit.unitNumber}:</span> ${unit.title}
                            </h3>
                            ${durationText}
                        </div>
                        <div class="ml-4">
                            <input type="checkbox" id="checkbox-${unit.unitNumber}" class="checkbox-custom unit-checkbox" aria-label="Mark Unit ${unit.unitNumber} as complete">
                        </div>
                    </div>
                    <div class="mt-4 space-y-3 text-sm text-gray-600">
                        <p><strong class="font-medium text-gray-800">Core Idea:</strong> ${unit.coreIdea}</p>
                        <p><strong class="font-medium text-gray-800">Key Skills:</strong> ${unit.keySkills.join(', ')}</p>
                        <p><strong class="font-medium text-gray-800">Anchoring Phenomenon:</strong> ${unit.anchoringPhenomenon}</p>
                    </div>
                </div>
            `;
        }

        function addCheckboxListeners() {
            const checkboxes = document.querySelectorAll('.unit-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', (event) => {
                    const card = event.target.closest('.unit-card');
                    card.classList.toggle('is-complete', event.target.checked);
                });
            });
        }

        function generateCalendar() {
            const startDateInput = document.getElementById('startDate');
            if (!startDateInput.value) {
                alert('Please select a start date.');
                return;
            }

            const calendarView = document.getElementById('calendarView');
            const calendarBody = document.getElementById('calendarBody');
            calendarBody.innerHTML = ''; // Clear previous results

            let currentDate = new Date(startDateInput.value + 'T00:00:00'); // Use T00:00:00 to avoid timezone issues

            curriculumData.parts.forEach(part => {
                part.units.forEach(unit => {
                    if (unit.duration) { // Only schedule units with a duration
                        const startDate = new Date(currentDate);
                        
                        // Find the end date by adding business days
                        let endDate = new Date(startDate);
                        let daysAdded = 0;
                        while (daysAdded < unit.duration - 1) {
                            endDate.setDate(endDate.getDate() + 1);
                            if (endDate.getDay() !== 0 && endDate.getDay() !== 6) { // 0=Sun, 6=Sat
                                daysAdded++;
                            }
                        }

                        const row = `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Unit ${unit.unitNumber}: ${unit.title}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${unit.duration}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(startDate)}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatDate(endDate)}</td>
                            </tr>
                        `;
                        calendarBody.innerHTML += row;

                        // Set the start for the next unit
                        currentDate = new Date(endDate);
                        currentDate.setDate(currentDate.getDate() + 1);
                        // Ensure the next unit starts on a weekday
                        while (currentDate.getDay() === 0 || currentDate.getDay() === 6) {
                            currentDate.setDate(currentDate.getDate() + 1);
                        }
                    }
                });
            });
            
            calendarView.classList.remove('hidden');
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
