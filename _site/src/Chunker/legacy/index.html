<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHS Teacher Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .calendar-day {
            transition: background-color 0.2s;
        }
        .calendar-day.meets {
            background-color: #EBF4FF;
            cursor: pointer;
            font-weight: bold;
        }
        .calendar-day.dropped {
            background-color: #F1F5F9;
            cursor: pointer;
            color: #94A3B8;
        }
        .calendar-day.selected {
            background-color: #3B82F6;
            color: white;
            border-radius: 50%;
        }
        .calendar-day.today {
            border: 2px solid #3B82F6;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">BHS Teacher Planner</h1>
            <p class="text-lg text-gray-600">A Data-Driven Planning Tool</p>
        </header>

        <div class="mb-6">
            <label for="course-selector" class="block text-sm font-medium text-gray-700">Select a Course Section:</label>
            <select id="course-selector" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                <!-- Options will be dynamically populated here -->
            </select>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Calendar -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <button id="prev-month" class="p-2 rounded-full hover:bg-gray-200">&lt;</button>
                    <h2 id="month-year" class="text-xl font-bold"></h2>
                    <button id="next-month" class="p-2 rounded-full hover:bg-gray-200">&gt;</button>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center">
                    <!-- Calendar will be generated here -->
                </div>
                 <div class="mt-4 text-sm text-gray-600">
                    <div class="flex items-center mb-2"><div class="w-4 h-4 rounded-full bg-blue-100 mr-2"></div><span>Class Meets</span></div>
                    <div class="flex items-center"><div class="w-4 h-4 rounded-full bg-slate-200 mr-2"></div><span>Class is Dropped</span></div>
                </div>
            </div>

            <!-- Right Column: Daily Details -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Daily Lesson Plan -->
                <div id="lesson-plan-container" class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-bold border-b pb-2 mb-4">Daily Lesson Plan</h2>
                    <div id="lesson-plan-content">
                        <p class="text-gray-500">Select a date from the calendar.</p>
                    </div>
                </div>

                <!-- Daily Bell Schedule -->
                <div id="bell-schedule-container" class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-bold border-b pb-2 mb-4">Daily Bell Schedule</h2>
                    <div id="bell-schedule-content">
                         <p class="text-gray-500">Select a date to see the schedule.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // --- GLOBAL STATE ---
            let config = {};
            let courses = [];
            let courseData = {};
            let masterCalendar = [];
            let mergedData = new Map();
            let currentDate = new Date();
            let selectedCourseInfo = {};

            // --- UI ELEMENTS ---
            const courseSelector = document.getElementById('course-selector');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const monthYearEl = document.getElementById('month-year');
            const calendarGridEl = document.getElementById('calendar-grid');
            const lessonPlanContentEl = document.getElementById('lesson-plan-content');
            const bellScheduleContentEl = document.getElementById('bell-schedule-content');

            // --- CORE WORKFLOW ---

            async function init() {
                try {
                    const configResponse = await fetch('config.json');
                    if (!configResponse.ok) throw new Error('config.json not found');
                    config = await configResponse.json();

                    buildMasterCalendar();
                    await populateCourseSelector();

                    if (courseSelector.value) {
                        await loadCourse(courseSelector.value);
                    }
                } catch (error) {
                    console.error("Initialization failed:", error);
                    alert("Failed to load critical files. Make sure you are running this from a local server.");
                }
            }

            async function populateCourseSelector() {
                try {
                    const coursesResponse = await fetch('courses.json');
                    if (!coursesResponse.ok) throw new Error('courses.json not found');
                    courses = await coursesResponse.json();
                    
                    courseSelector.innerHTML = '';
                    courses.forEach((course, index) => {
                        const option = document.createElement('option');
                        option.value = index; // Use index as value
                        option.textContent = course.displayName;
                        courseSelector.appendChild(option);
                    });
                } catch (error) {
                    console.error("Failed to populate courses:", error);
                    courseSelector.innerHTML = '<option>Error loading courses</option>';
                }
            }

            function buildMasterCalendar() {
                let instructionalDayCount = 1;
                let rotationDayCount = 1;
                const startDate = new Date(config.startDate + 'T00:00:00');
                const endDate = new Date(config.endDate + 'T00:00:00');
                const nonInstructional = new Set(config.nonInstructionalDays);

                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    const dayOfWeek = d.getDay();
                    const dateString = d.toISOString().split('T')[0];

                    if (dayOfWeek !== 0 && dayOfWeek !== 6 && !nonInstructional.has(dateString)) {
                        masterCalendar.push({
                            date: dateString,
                            instructionalDay: instructionalDayCount,
                            rotationDay: rotationDayCount
                        });
                        instructionalDayCount++;
                        rotationDayCount = (rotationDayCount % config.schedule.rotationDays) + 1;
                    }
                }
            }

            async function loadCourse(courseIndex) {
                selectedCourseInfo = courses[courseIndex];
                const courseFile = selectedCourseInfo.fileName;
                try {
                    const courseResponse = await fetch(courseFile);
                    if (!courseResponse.ok) throw new Error(`${courseFile} not found`);
                    courseData = await courseResponse.json();
                    mergeData();
                    
                    // Set calendar to the start of the school year
                    currentDate = new Date(config.startDate + 'T00:00:00');
                    renderCalendar();

                    // Render details for the first instructional day by default
                    if (masterCalendar.length > 0) {
                        renderDayDetails(masterCalendar[0].date);
                    }
                } catch (error) {
                    console.error(`Failed to load course file ${courseFile}:`, error);
                    alert(`Could not load data for ${courseFile}.`);
                }
            }

            function mergeData() {
                mergedData.clear();
                const lessonMap = new Map(courseData.pacingGuide.map(lesson => [lesson.instructionalDay, lesson]));
                const coursePeriod = selectedCourseInfo.period;

                masterCalendar.forEach(day => {
                    const droppedPeriods = config.schedule.dropRules[day.rotationDay];
                    const isDropped = droppedPeriods.includes(coursePeriod);
                    
                    mergedData.set(day.date, {
                        ...day,
                        lesson: lessonMap.get(day.instructionalDay) || null,
                        isDropped: isDropped
                    });
                });
            }

            // --- UI RENDERING ---

            function renderCalendar() {
                calendarGridEl.innerHTML = '';
                monthYearEl.textContent = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });
                
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const todayString = new Date().toISOString().split('T')[0];

                ['S','M','T','W','T','F','S'].forEach(day => {
                    const dayEl = document.createElement('div');
                    dayEl.className = 'font-bold text-gray-500';
                    dayEl.textContent = day;
                    calendarGridEl.appendChild(dayEl);
                });

                for (let i = 0; i < firstDay; i++) {
                    calendarGridEl.appendChild(document.createElement('div'));
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dayEl = document.createElement('div');
                    const dateString = new Date(year, month, day).toISOString().split('T')[0];
                    const dayData = mergedData.get(dateString);

                    dayEl.textContent = day;
                    dayEl.className = 'calendar-day p-2 rounded-full';
                    dayEl.dataset.date = dateString;

                    if (dayData) {
                        dayEl.classList.add(dayData.isDropped ? 'dropped' : 'meets');
                    }
                    if (dateString === todayString) {
                        dayEl.classList.add('today');
                    }

                    calendarGridEl.appendChild(dayEl);
                }
            }

            function renderDayDetails(dateString) {
                const dayData = mergedData.get(dateString);
                
                document.querySelectorAll('.calendar-day.selected').forEach(el => el.classList.remove('selected'));
                const selectedEl = document.querySelector(`.calendar-day[data-date="${dateString}"]`);
                if (selectedEl) selectedEl.classList.add('selected');

                if (dayData && dayData.lesson) {
                    const lesson = dayData.lesson;
                    lessonPlanContentEl.innerHTML = `
                        <p class="text-sm text-gray-500 mb-2">${new Date(dateString + 'T00:00:00').toDateString()}</p>
                        <h3 class="text-xl font-bold text-indigo-600">${lesson.topic}</h3>
                        <p class="text-sm font-semibold text-gray-600 mb-4">${lesson.unit}</p>
                        <div class="space-y-3">
                            <div><strong>Objective:</strong> ${lesson.objective}</div>
                            <div><strong>Activity:</strong> ${lesson.activity}</div>
                            <div><strong>Assignment:</strong> ${lesson.assignment}</div>
                        </div>
                    `;
                } else {
                    lessonPlanContentEl.innerHTML = `<p class="text-gray-500">No lesson plan for this date.</p>`;
                }

                if (dayData) {
                    const rotationDay = dayData.rotationDay;
                    const isDropped = dayData.isDropped;
                    const statusClass = isDropped ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
                    const statusText = isDropped ? 'Class is Dropped' : 'Class Meets';
                    
                    const isHiveDay = [2, 4].includes(new Date(dateString + 'T00:00:00').getDay());
                    const bellTimes = isHiveDay ? config.schedule.bellTimes.hiveDay : config.schedule.bellTimes.regular;

                    let scheduleHtml = `
                        <div class="flex justify-between items-center mb-4">
                            <p class="font-bold">Rotation Day ${rotationDay}</p>
                            <p class="font-bold px-3 py-1 rounded-full ${statusClass}">${statusText}</p>
                        </div>`;
                    scheduleHtml += '<ul class="space-y-1">';
                    for (const period in bellTimes) {
                        const isMyPeriod = period.includes(selectedCourseInfo.period);
                        const periodClass = isMyPeriod && !isDropped ? 'font-bold text-indigo-600' : '';
                        scheduleHtml += `<li class="flex justify-between ${periodClass}"><span>${period}</span><span>${bellTimes[period]}</span></li>`;
                    }
                    scheduleHtml += '</ul>';
                    bellScheduleContentEl.innerHTML = scheduleHtml;
                } else {
                    bellScheduleContentEl.innerHTML = `<p class="text-gray-500">Not an instructional day.</p>`;
                }
            }
            
            // --- EVENT LISTENERS ---
            courseSelector.addEventListener('change', (e) => loadCourse(e.target.value));
            
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            calendarGridEl.addEventListener('click', (e) => {
                if (e.target.dataset.date) {
                    renderDayDetails(e.target.dataset.date);
                }
            });

            // --- START THE APP ---
            init();
        });
    </script>

</body>
</html>
