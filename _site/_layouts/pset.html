<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .content {
            margin: auto;
            width: 80%;
            height: 80%;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #f9f9f9;
            position: absolute;
            bottom: 10%;
            right: 10%;
        }
    </style>
</head>
<body>
    <div class="content">
        {{ content }}
    </div>
</body>
</html>
