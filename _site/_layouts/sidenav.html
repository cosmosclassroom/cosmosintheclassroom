<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
    <title>{{ page.title }} | {{ site.title }}</title>
    
    {% if page.math != false %}
    <!-- KaTeX Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="text/javascript" async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    {% endif %}

    <!-- Stylesheet loading -->
    {% if page.stylesheet %}
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/' | append: page.stylesheet | append: '.css' | relative_url }}">
    {% else %}
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}">
    {% endif %}

<style>
:root {
    --parchment: #f4f4f4;
    --parchment-light: #f9f9f9;
    --parchment-dark: #eaeaea;
    --parchment-darkest: #d4d4d4;
    --gold: #d4af37;
    --gold-light: #e6c200;
    --gold-dark: #b5942c;
    --gold-darkest: #a68c2b;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding-top: 60px;
    font-family: Arial, Helvetica, sans-serif;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    padding: 1rem;
    background-color: var(--parchment-light);
    border-bottom: 1px solid var(--parchment-darkest);
    z-index: 100;
}

.sidenav {
    height: 100%;
    width: 20%;
    position: fixed;
    top: 0;
    left: 0;
    background-color: var(--parchment-darkest);
    padding-top: 20px;
    overflow-y: auto;
    overflow-x: hidden;
}

.sidenav button {
    padding: 16px;
    font-size: 25px;
    color: white;
    background-color: var(--parchment-darkest);
    border: none;
    display: block;
    text-align: center;
}

.sidenav a {
    color: green;
    background: black;
}

.sidenav a:hover {
    background-color: wheat;
    color: darkolivegreen;
}

.main-container {
    margin-left: 20%;
    padding: 2rem;
    max-width: 1200px;
}

.content {
    background-color: white;
    padding: 2rem;
    border-radius: 4px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
</style>
</head>
<body>
    <header class="header">
        <h1>{{ site.title }}</h1>
    </header>

    <nav class="sidenav">
        <h3>Side Navigation</h3>
        <a class="button" href="#">Honors Physics</a>
        <a class="buttons" href="#">Standard Physics</a>
        <a class="buttons" href="#">Teacher</a>
        <a class="buttons" href="#">About</a>
        <a href="#">Link</a>
    </nav>

    <main class="main-container">
        <div class="content">
            {{ content | markdownify }}
        </div>
    </main>
</body>
</html>
