<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ '/reveal.js/css/reveal.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/reveal.js/css/theme/black.css' | relative_url }}">
  <style>
    /* Marp slide styles */
    section {
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 2em;
    }
    h1, h2, h3 {
      margin: 0.5em 0;
    }
    p {
      margin: 1em 0;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-AMS_HTML"></script>
  <script>
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    });
  </script>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown>
        <script type="text/template"markdown="1">
          {{ content | markdownify }}
        </script>
      </section>
    </div>
  </div>
  <script src="{{ '/assets/reveal.js/dist/reveal.js' | relative_url }}"></script>
  <script>
    Reveal.initialize({
      hash: true, // Enable URL hash for navigation
      slideNumber: true, // Show slide numbers
      controls: true, // Show navigation controls
      progress: true, // Show progress bar
      transition: 'slide', // Slide transition effect
      math: {
        mathjax: 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js',
        config: 'TeX-AMS_HTML-full'
      }
    });
  </script>
</body>
</html>
