<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
    <title>{{ page.title }} | {{ site.title }}</title>
    
    {% if page.math != false %}
    <!-- KaTeX Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="text/javascript" async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    {% endif %}
    
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- tabs.js for tabs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tabs.js/1.0.0/tabs.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        // Initialize Highlight.js
        hljs.highlightAll();
        
        // Initialize tabs.js
        const tabs = new Tabs('.tabs');
        tabs.init();
      });
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    
    
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/worksheets.css' | relative_url }}">
    
    <!-- Add Mermaid library and initialize -->
    <script src="https://unpkg.com/mermaid/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: true });</script>
  </head>
  <body>
    <div class="example-3">
        <input type="checkbox" id="menuToggle" class="menu-toggle">
        <nav class="menu-3">
            <div class="menu-content">
                <div class="menu-header">
                    <h3>Pure CSS Menu</h3>
                </div>
                <div class="menu-item">🌱 Dashboard</div>
                <div class="menu-item">📈 Reports</div>
                <div class="menu-item"><a href='Tools.html'>Tools</a></div>
                <div class="menu-item">👥 Team</div>
                <div class="menu-item">🔒 Security</div>
            </div>
        </nav>
        <div class="main-content">
            {{ content }}
        </div>
        <div class='markdown-body'>

            {{ content }}
            
            </div>
    
    </body>
</html>
