<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NGSS Practices Reference | Socrates' Library</title>
    <link rel="stylesheet" href="../../assets/css/cosmos-theme.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            margin: 0;
            padding: 0;
        }
        .reference-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(44,62,80,0.08);
        }
        .reference-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .system-card {
            width: 100%;
            max-width: 600px;
            min-height: 220px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin: 0 auto;
            background: #f8fafc;
            border-radius: 10px;
            box-shadow: 0 1px 6px rgba(44,62,80,0.06);
        }
        .system-card img {
            width: 56px;
            height: 56px;
        }
        .practice-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: #2c3e50;
            margin-top: 0.5rem;
        }
        .practice-abbrev {
            font-size: 1rem;
            color: #3b4a5a;
            margin-top: 0.2rem;
            font-weight: 500;
        }
        .practice-description,
        .practice-definition {
            font-size: 0.95rem;
            color: #666;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="reference-container">
        <h1 class="reference-title">NGSS Science & Engineering Practices</h1>
        <div id="ngss-large-cards-list" class="cards-list"></div>
    </div>
    <script>
    function renderNgssCard(practice) {
        return `
            <div class="system-card">
                <img src="../../assets/icons/${practice.icon}" alt="${practice.abbreviated_name} icon">
                <span class="practice-title">${practice.name}</span>
                <span class="practice-abbrev">${practice.abbreviated_name}</span>
                <span class="practice-description">Short Description: ${practice.short_description}</span>
                <span class="practice-definition">${practice.definition}</span>
            </div>
        `;
    }

    fetch('../../assets/data/ngss_practices.json')
        .then(response => response.json())
        .then(data => {
            const list = document.getElementById('ngss-large-cards-list');
            list.innerHTML = data.map(practice => renderNgssCard(practice)).join('');
        });
    </script>
</body>
</html>
